[workspace]
resolver = "3"
members = [
    "bin/silvermere",
    "crates/silvermere-api",
    "crates/silvermere-auth",
    "crates/silvermere-db",
    "crates/silvermere-engine",
    "crates/silvermere-import",
    "crates/silvermere-net",
    "crates/silvermere-rules",
    "crates/silvermere-testkit",
    "crates/silvermere-text",
    "crates/silvermere-types",
]
# The crate template is copied by scaffolding cards; it is not built.
exclude = ["crates/_template"]

[workspace.package]
version = "0.1.14"
edition = "2024"
rust-version = "1.99.1"
publish = false
license = "MIT"
repository = "https://github.com/jnfisher/silvermere"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
silvermere-api = { path = "crates/silvermere-api" }
silvermere-auth = { path = "crates/silvermere-auth" }
silvermere-db = { path = "crates/silvermere-db" }
silvermere-engine = { path = "crates/silvermere-engine" }
silvermere-import = { path = "crates/silvermere-import" }
silvermere-net = { path = "crates/silvermere-net" }
silvermere-rules = { path = "crates/silvermere-rules" }
silvermere-testkit = { path = "crates/silvermere-testkit" }
silvermere-text = { path = "crates/silvermere-text" }
silvermere-types = { path = "crates/silvermere-types" }
anyhow = "1.0.104"
argon2 = "0.6.0"
axum = "0.8.9"
bitflags = { version = "2.13.2", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
fancy-regex = "0.20.0"
figment = { version = "0.10.19", features = ["toml", "env"] }
insta = "1.49.0"
jiff = "0.2.38"
metrics = "0.24.6"
metrics-exporter-prometheus = { version = "0.18.3", default-features = false, features = ["http-listener"] }
metrics-util = { version = "0.20.4", default-features = false, features = ["debugging", "registry"] }
miniz_oxide = "0.9.1"
proptest = "1.12.0"
rand = "0.10.3"
rand_chacha = "0.10.0"
regex = "1.13.1"
rpassword = "7.5.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
slotmap = { version = "1.1.1", features = ["serde"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "sqlite", "postgres", "migrate", "macros"] }
subtle = "2.6.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util", "signal"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
toml = "1.1.8"
toml_edit = "0.25.17"
tower = { version = "0.5.3", features = ["util"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
ureq = { version = "3.5.0", default-features = false, features = ["rustls"] }

# T-111: etcetera without the SHGetKnownFolderPath call that loads user32.dll on Windows (see
# patches/etcetera/Cargo.toml). sqlx-postgres is its only user.
[patch.crates-io]
etcetera = { path = "patches/etcetera" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Tests run in the dev profile, and unoptimised code made the suites an order of magnitude slower
# than they need to be: every test starts a server on the stock world, hashes passwords with
# argon2, and imports or copies a database. A light optimisation of the workspace's own crates and
# a stronger one of the dependencies change no test and no assertion (overflow checks and debug
# assertions stay on); line tables keep panic backtraces and cut the size of the target dir (T-090).
[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
