[package]
name = "silvermere-db"
description = "sqlx schema, migrations, repositories, persistence worker."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
# one test binary for all of tests/ (tests/all.rs), not one per file (T-129)
autotests = false

[lints]
workspace = true

[dependencies]
silvermere-types.workspace = true
silvermere-engine.workspace = true
sqlx = { workspace = true, features = ["any"] }
tokio.workspace = true
thiserror.workspace = true
tracing.workspace = true
metrics.workspace = true
serde.workspace = true
serde_json.workspace = true
jiff.workspace = true

[dev-dependencies]
sqlx = { workspace = true, features = ["any"] }
tokio = { workspace = true, features = ["test-util"] }
serde_json.workspace = true
jiff.workspace = true
tracing-subscriber.workspace = true

[[test]]
name = "all"
path = "tests/all.rs"
