[package]
name = "silvermere-import"
description = "One-time importer for legacy WCC*.DAT/.VIR/.MSG (the only crate that knows Btrieve layouts)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
# one test binary for all of tests/ (tests/all.rs), not one per file (T-129)
autotests = false

[lints]
workspace = true

[dependencies]
silvermere-db.workspace = true
silvermere-types.workspace = true
jiff.workspace = true
miniz_oxide.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true
ureq.workspace = true

[dev-dependencies]
proptest.workspace = true
sha2.workspace = true
sqlx = { workspace = true, features = ["any"] }
tokio.workspace = true

[[test]]
name = "all"
path = "tests/all.rs"
