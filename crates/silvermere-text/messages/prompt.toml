# The literal pieces of the prompt, the [MAJORMUD]: menu and the entry screen.
#
# Read by src/prompt.rs and src/menu.rs (`texts::PROMPT_TEXTS`). Each entry is the exact
# text the game prints, `\r` line ends as written (the renderer's `finish` turns
# them into `\r\n`) and ANSI as `\u001B`.
#
# The .MSG texts (MENUTEXT, MENUPMPT from WCCTEXT.MSG; USRFOLED, USRLOGIN from
# WCCMMUD.MSG) are here until T-011 converts the .MSG files; their bytes are the T-005
# capture `entry-existing/raw.bin`, which shows them as the game sends them.
# `{version}` is the one placeholder.

# --- the command prompt ---------------------------------------------------------------

[texts.hp_open]
text = "[HP="

[texts.mana_label]
text = "/MA="

[texts.kai_label]
text = "/KAI="

[texts.close]
text = "]:"

[texts.resting]
text = " (Resting) "

[texts.meditating]
text = " (Meditating) "

[texts.debug_open]
text = "{"

[texts.debug_energy]
text = "Energy={energy} "

[texts.debug_sneaking]
text = "Snk "

[texts.debug_just_arrived]
text = "JstEnt "

[texts.debug_hidden]
text = "Hdn "

[texts.debug_close]
text = "}:"

[texts.off]
text = ">"

