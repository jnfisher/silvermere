text = "{@ANSI_CLRLINE}There would not be enough people left in the frontrank if you did that.\r"
pattern = "rank_refused"
[messages.rank_back_other]
text = "{@ANSI_CLRLINE}{who} just moved to the back rank in your group.\r"
pattern = "rank_moved"
example = { who = "Bob" }
note = "Only the first member told gets it (see `rank_front_other`)."
[messages.rank_back_self]
text = "You have moved to the back ranks of your group.\r"
pattern = "rank_moved"
[messages.rank_back_only]
text = "{@ANSI_CLRLINE}You are the only one in the back rank.  You may not leave.\r"
pattern = "rank_refused"
[messages.rank_mid_leader]
text = "{@ANSI_CLRLINE}You may not leave your current rank in your own party.\r"
pattern = "rank_refused"
[messages.rank_mid_other]
text = "{@ANSI_CLRLINE}{who} just moved to the middle of your group.\r"
pattern = "rank_moved"
example = { who = "Bob" }
note = "Only the first member told gets it (see `rank_front_other`)."
[messages.rank_mid_self]
text = "You have moved to the middle ranks of your group.\r"
pattern = "rank_moved"
[messages.party_following]
text = "{@ANSI_BOLD}{@ANSI_FGCYAN}You are following {who}.\r"
pattern = "following"
example = { who = "Bob" }
note = "PARTY starts with ANSI_CLRLINE alone (`clrline`), sent with whatever line comes first."
[messages.party_header]
text = "{@ANSI_GREY}The following people are in your travel party:\r"
pattern = "party_header"
note = "Sent together with the first row."
[messages.party_row_invited]
text = "  {name} {class} [Invited]\r"
example = { name = "Bob Smith                     ", class = "(Warrior)   " }
note = "`%-30.30s %-12.12s`: `name` is first and last name padded or cut to 30, `class` the class name in brackets padded or cut to 12."
[messages.party_row]
text = "  {name} {class}{mana} [H:{hp}%]{poison}{rest}{rank}\r"
example = { name = "Bob Smith                     ", class = "(Warrior)   ", mana = "         ", hp = "100", poison = " ", rest = " ", rank = " - Frontrank" }
note = "`mana` is ` [M:%3.3s%]` (K for a kai class) or nine spaces when the mana percentage is 0; `hp` is `%3.3s` of the percentage; `poison` P or a space; `rest` R, M (meditating) or a space; `rank` ` - Frontrank`, ` - Backrank` or ` - Midrank`."
[messages.party_none]
text = "{@ANSI_LTRED}You are not in a party at the present time.\r"
pattern = "party_none"
note = "Followed by the player's own row all the same."
[messages.aid_syntax]
text = "{@ANSI_LTREDBLK}Syntax: AID {{user name}}\r"
pattern = "syntax"
[messages.aided]
text = "{@ANSI_CLRLINE}You have aided {who}, {his} wounds are now healing.\r"
example = { who = "Bob", his = "his" }
[messages.aided_you]
text = "{@ANSI_CLRLINE}{who} has aided you.\r"
example = { who = "Bob" }
note = "Followed by the aided player's prompt."
[messages.aid_not_needed]
text = "{@ANSI_CLRLINE}{who} is in no need of assistance.\r"
example = { who = "Bob" }
[messages.share_syntax_default]
text = "{@ANSI_CLRLINE}{@ANSI_LTREDBLK}Syntax: SHARE {{amount}} {{currency}} [WITH ROOM/PARTY] - default: PARTY\r"
[messages.share_syntax]
text = "{@ANSI_CLRLINE}{@ANSI_LTREDBLK}Syntax: SHARE {{amount}} {{currency}} [WITH ROOM/PARTY]\r"
[messages.share_not_enough]
text = "{@ANSI_CLRLINE}You do not have enough to share!\r"
note = "The receivers' lines are `gave_coins`, `got_coins` and `gave_some_coins`. `There is nobody to share with.` can never print (sic) and is not carried."

# ---- T-053: item use (USE, READ, EAT, DRINK, OPEN {item}) ---------------------------

[messages.use_syntax]
text = "{@ANSI_LTREDBLK}Syntax: USE {{Item to use}} [{{target}}]\r"
pattern = "syntax"

[messages.read_syntax]
text = "{@ANSI_LTREDBLK}Syntax: Read {{Item}}\r"
pattern = "syntax"

[messages.use_forbidden]
text = "You may not use that item!\r"
pattern = "use_forbidden"

[messages.use_must_ready]
text = "You must have that item readied to use it!\r"
pattern = "use_forbidden"

[messages.use_must_wear]
text = "You must be wearing that item to use it!\r"
pattern = "use_forbidden"

[messages.no_uses]
text = "{@ANSI_LTREDBLK}There are no more uses in {item}.\r"
pattern = "no_uses"
example = { item = "wand" }

[messages.dont_have]
text = "{@ANSI_LTREDBLK}You don't have {item}.\r"
pattern = "dont_have"
example = { item = "potion" }
note = "The whole rest of the line."

[messages.learn_scroll]
text = "You read {item} and learn the spell {spell}.\r"
pattern = "learn_scroll"
example = { item = "scroll of vines", spell = "vine strike" }
note = "Follows an ANSI_CLRLINE (`clrline`), as do the other two scroll lines."

[messages.already_known_scroll]
text = "You realize that you already know this scroll!\r"
pattern = "already_known"

[messages.use_unknown]
text = "You don't know what to do with this!\r"
pattern = "use_unknown"

[messages.receive_hp]
text = "You receive {n} hit points.\r"
args = { n = "i64" }
pattern = "receive_hp"
example = { n = "10" }

[messages.receive_mana]
text = "You receive {n} mana.\r"
args = { n = "i64" }
pattern = "receive_hp"
example = { n = "5" }

[messages.key_not_locked]
text = "The {what} was not locked.\r"
example = { what = "door" }

[messages.key_no_fit]
text = "The {item} doesn't seem to fit that lock.\r"
example = { item = "bone key" }

[messages.eat_item]
text = "You eat the {item}.\r"
pattern = "eat_drink"
example = { item = "iron ration" }

[messages.other_eats]
text = "{who} eats {item}.\r"
pattern = "other_eat_drink"
example = { who = "Bob", item = "iron ration" }

[messages.drink_item]
text = "You drink the {item}.\r"
pattern = "eat_drink"
example = { item = "potion" }

[messages.other_drinks]
text = "{who} drinks {item}.\r"
pattern = "other_eat_drink"
example = { who = "Bob", item = "potion" }

# ---- T-052: monster casting (monster_cast).

[messages.monster_cast_you_resisted]
text = "{@ANSI_CLRLINE}{@ANSI_CYAN}You resisted {caster}'s cast of {spell}.\r"
pattern = "you_resisted"
example = { caster = "orc shaman", spell = "chill" }
note = "The monster's name as typed in the record, no `The` prefix."

[messages.monster_cast_other_resisted]
text = "{@ANSI_CLRLINE}{@ANSI_CYAN}{who} resisted {caster}'s cast of {spell}.\r"
pattern = "other_resisted"
example = { who = "Bob", caster = "orc shaman", spell = "chill" }

[messages.monster_cast_failed_you]
text = "{@ANSI_CLRLINE}{@ANSI_CYAN}The {caster} attempted to cast {spell} at you, but failed.\r"
pattern = "cast_at_you_failed"
example = { caster = "orc shaman", spell = "chill" }

[messages.monster_cast_failed_room]
text = "{@ANSI_CLRLINE}{@ANSI_CYAN}The {caster} attempted to cast {spell} at {target}, but failed.\r"
example = { caster = "orc shaman", spell = "chill", target = "Ann" }

