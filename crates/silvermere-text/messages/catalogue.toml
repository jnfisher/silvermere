# The message catalogue: one entry per line or piece the game prints, keyed by a
# snake_case name. Format: src/catalogue.rs (and docs/text.md). `text` is what the game prints,
# with `\r` line ends as written; `{name}` is an argument, `{@ANSI_*}` an ANSI string
# resolved at build time, `{@COL_*}` a colour-table row resolved with the player's
# palette at render time. `build.rs` generates the `Msg` enum from this file.
#
# T-010 seeds the entries the tests and the prompt (T-020) need; T-011 fills in the
# .MSG files; the display and command cards add their own sites.

[messages.clrline]
text = "{@ANSI_CLRLINE}"
note = "The ANSI_CLRLINE prefix alone (column 1, erase the line), for callers that print it before text of their own."

[messages.mud_menu_prompt]
text = "\u001B[1;30m[\u001B[0mMAJORMUD\u001B[1;30m]\u001B[0m: "
pattern = "mud_menu_prompt"
note = "The `[MAJORMUD]:` menu prompt as the game-full path prints it (plain ANSI, no if-ANSI); no newline follows."

[messages.tournament_notice]
text = "*** MajorMUD Tournament Play enabled! ***\r"
pattern = "tournament_notice"

[messages.game_full]
text = "{@ANSI_WHITE}\rWe're sorry, but the game is currently full.\r\r"
pattern = "game_full"
note = "Printed when the player cap is reached; the menu prompt and ANSI_NORMAL follow. The game's second line here is licensing wording and is dropped; the blank line before the prompt stays."

[messages.player_entered]
text = "{@ANSI_CLRLINE}{who} just entered the Realm.\r"
pattern = "player_entered"
example = { who = "Bob" }

[messages.player_left_realm]
text = "{@ANSI_CLRLINE}{who} just left the Realm.\r"
pattern = "player_left_realm"
example = { who = "Bob" }

[messages.player_disconnected]
text = "{@ANSI_CLRLINE}{@ANSI_WHITE}{who} just disconnected!!!\r"
pattern = "player_disconnected"
example = { who = "Bob" }

[messages.name_validating]
text = "{@ANSI_LTCYAN}Please wait - Validating your name.\r "
pattern = "name_validating"
note = "The game's literal ends in `\\r ` (a space after the line end)."

[messages.enter_hangup_note]
text = "{@ANSI_WHITE}\rLast time you were on, you disconnected while playing.\r"
pattern = "enter_hangup_note"

[messages.enter_hangup_punished]
text = "The gods have punished you appropriately.\r"
pattern = "enter_hangup_punished"

[messages.enter_promoted]
text = "{@ANSI_WHITE}You have been promoted to the rank of lieutenant.\n"
note = "load_player: the character was promoted while offline (T-023)."

[messages.enter_demoted]
text = "{@ANSI_WHITE}You have been demoted from the rank of lieutenant.\n"

[messages.enter_house_closed]
text = "{@ANSI_WHITE}Your ganghouse has been closed down!!\n"

[messages.enter_house_items]
text = "{@ANSI_WHITE}Gang house items have dissappeared from your inventory!\n"
note = "(sic) dissappeared."

[messages.enter_gang_disbanded]
text = "{@ANSI_WHITE}\rYour gang, {gang}, has been disbanded!\r"
example = { gang = "Raiders" }

[messages.enter_gang_rank_stripped]
text = "{@ANSI_WHITE}\rYou have been stripped of your rank as lieutenant!"
note = "No line end: the next message starts with one."

[messages.enter_gang_gone]
text = "{@ANSI_WHITE}\rYou are no longer in the gang {gang}.\r"
example = { gang = "Raiders" }

[messages.enter_stats_reset]
text = "{@ANSI_WHITE}\rYour stats have been reset due to an earlier bug.\rPlease TRAIN STATS as soon as possible to re-apply your CPs\r(Unfortunately, if any spells were cast on you they will be terminated.\r"
note = "Goes out as one message. (sic) The parenthesis is never closed."

[messages.enter_life_ebbing]
text = "You feel your life-force ebbing.\r"

[messages.command_interrupted]
text = "Command interrupted.\r"
pattern = "command_interrupted"

[messages.slow_down]
text = "Why don't you slow down for a few seconds?\r"
pattern = "slow_down"

[messages.too_fast]
text = "You are typing too quickly - command ignored\r"
pattern = "too_fast"

[messages.no_exit]
text = "There is no exit in that direction!\r"
pattern = "no_exit"

[messages.look_no_exit]
text = "{@ANSI_LTREDBLK}There are no exits to the {dir}!\r"
pattern = "look_no_exit"
example = { dir = "north" }
note = "The up and down wordings (`upwards`, `downwards`) are separate entries."

[messages.sneaking]
text = "{@ANSI_CLRLINE}{@ANSI_GREY}Sneaking...\r"
pattern = "sneaking"

[messages.exp_gain]
text = "{@ANSI_CLRLINE}You gain {exp} experience.\r"
pattern = "exp_gain"
args = { exp = "i64" }
example = { exp = "13" }
note = "The amount is printed as a plain signed decimal."

[messages.exp_capped]
text = "{@ANSI_CLRLINE}You have progressed too far without training to acquire anymore experience!\r"
pattern = "exp_capped"
note = "add_experience: the character holds more than the experience for level + XTRALVL; nothing is added. The prompt follows."

[messages.train_tournament]
text = "{@ANSI_CLRLINE}{@ANSI_LTRED}You may not do any training while in tournament mode!\r"
note = "cmd_train: TRAIN and TRAIN STATS are refused while TOURNAMENT_PLAY is on."

[messages.train_wrong_room]
text = "You must be in an appropriate training room to train!\r"
pattern = "train_wrong_room"
note = "train_level: not a shop room, or the shop is not a Training shop (two sites, one text)."

[messages.train_wrong_class]
text = "This shop is not suitable for your training.\r"
pattern = "train_wrong_room"

[messages.train_too_low]
text = "You have not progressed far enough to use the training provided here.\r"
pattern = "train_level_band"
note = "The trainer's minlevel is above the character's level + 1."

[messages.train_too_high]
text = "You have progressed too far to use the training provided here.\r"
pattern = "train_level_band"
note = "The trainer's maxlevel is below the character's level + 1."

[messages.train_no_money]
text = "You do not have the money required for your training.\r"
pattern = "train_no_money"

[messages.trained]
text = "You hand over{paid} and you receive training to attain level {level}.\r"
pattern = "trained"
args = { level = "i64" }
example = { paid = " 5 silver nobles", level = "2" }
note = "`paid` is the list of coins paid, each entry with its leading blank, or \" nothing\"."

[messages.train_receive]
text = "You receive the following:\r"
pattern = "train_receive"

[messages.train_cp]
text = "{cp} additional character points\r"
pattern = "train_cp"
args = { cp = "i64" }
example = { cp = "10" }

[messages.train_lives]
text = "{lives} additional lives\r"
pattern = "train_lives"
args = { lives = "i64" }
example = { lives = "1" }
note = "Only when the lives changed; at the cap of 9 nothing is printed."

[messages.train_no_exp]
text = "{@ANSI_CLRLINE}You do not have the required experience to train yet!\r"
pattern = "train_no_exp"

[messages.you_killed]
text = "{@ANSI_CLRLINE}{@ANSI_LTREDBLK}You have been killed!\r"
pattern = "you_killed"

[messages.drops_unconscious]
text = "{@ANSI_CLRLINE}{@ANSI_GREY}{@ANSI_BGRED}{who} drops to the ground!\u0007{@ANSI_BGBLACK}\r"
pattern = "drops_unconscious"
example = { who = "Thornwyn" }
note = "Grey on red with a bell; sent to the whole room, blinded players included."

[messages.combat_engaged]
text = "{@ANSI_CLRLINE}{@ANSI_BROWN}*Combat Engaged*\r"
pattern = "combat_engaged"

[messages.combat_off]
text = "{@ANSI_CLRLINE}{@ANSI_BROWN}*Combat Off*\r"
pattern = "combat_off"

[messages.combat_breaks_off]
text = "{@ANSI_CLRLINE}{@ANSI_BROWN}{who} breaks off combat.\r"
pattern = "breaks_off"
example = { who = "Bob" }
note = "To the rest of the room when the player stops on purpose (BREAK)."

[messages.combat_target_gone]
text = "You don't see your target here!\r"
pattern = "target_missing"
note = "ATTACK or BASH alone when the auto-combat monster has left the room."

[messages.room_exits]
text = "{@COL_EXITS}Obvious exits: {exits}\r"
wrap = true
pattern = "room_exits"
example = { exits = "closed door north, up" }
note = "The label in the palette's COL_EXITS colour; the list is built one exit at a time and wrapped at 79 columns (display_room_desc)."

[messages.room_exits_none]
text = "{@COL_EXITS}Obvious exits: NONE!!!\r"
wrap = true
pattern = "room_exits"

[messages.room_items]
text = "{@ANSI_CYAN}You notice {items} here.\r"
wrap = true
pattern = "room_items"
example = { items = "9 copper farthings, torch" }

[messages.room_also_here]
text = "{@COL_ALSOHERE}Also here: {who}{@COL_ALSOHERE}.\r{@ANSI_RESET}"
wrap = true
pattern = "room_also_here"
example = { who = "Thornwyn, giant rat" }
note = "`who` carries its own colours, resolved in the viewer's palette by the room display (silvermere-engine `display::room`): COL_HERENAMES before the players, then per monster COL_HERENAMES before the \", \" and the alignment colour before the name and ANSI_RESET after it."

[messages.room_light]
text = "{@ANSI_GREY}The room is {light}\r"
pattern = "room_light"
example = { light = "dimly lit" }

[messages.noise]
text = "{@ANSI_CLRLINE}{@ANSI_MAGENTA}You hear movement to the {dir}.\r"
pattern = "noise"
example = { dir = "north" }

[messages.arena_warning]
text = "{@ANSI_CLRLINE}{@ANSI_LTRED}NOTE: This room is *not* a death-free zone right now!\rTreat this room as you would any other combat zone.\r{@ANSI_LTCYAN}"
pattern = "arena_warning"

[messages.search_nothing]
text = "{@ANSI_CYAN}Your search revealed nothing.\r"
pattern = "search_nothing"

[messages.who_count]
text = "\rThere are {count} users in the game.\r"
pattern = "who_count"
args = { count = "i32" }
example = { count = "3" }

[messages.who_none]
text = "\r{@ANSI_FGMAGENTA}There are no users in the game at the moment.\r"
pattern = "who_none"

[messages.version]
text = "{@ANSI_GREY}MajorMUD v {version}\r"
pattern = "version"
example = { version = "1.11p" }

# --- T-021: leaving the realm, the main menu, the BBS menu shim ----------------------

[messages.exit_wounded]
text = "You may not exit MajorMud while you are mortally wounded!\r"
pattern = "exit_wounded"

[messages.exit_meditate]
text = "You will exit after a period of silent meditation.\r."
pattern = "exit_meditate"
note = "(sic) A `.` follows the line end; the `...` of each fast cycle continue it."

[messages.exit_others]
text = "{@ANSI_CLRLINE}{who} sits down and meditates.\r"
pattern = "exit_others"
example = { who = "Bob" }

[messages.exit_dots]
text = "..."
note = "One per fast cycle while the exit delay counts down."

[messages.exit_waiting]
text = "You may not perform any commands while waiting to exit!\r"
pattern = "exit_waiting"

[messages.exit_interrupted]
text = "Your meditation has been interrupted - you may not exit now!\r"
pattern = "exit_interrupted"

[messages.mud_menu_prompt_cr]
text = "\r\u001B[1;30m[\u001B[0mMAJORMUD\u001B[1;30m]\u001B[0m: {@ANSI_NORMAL}"
pattern = "mud_menu_prompt"
note = "The `[MAJORMUD]:` prompt after leaving the realm, the G and S/W lists and an unknown menu word: a line end first, plain ANSI around it (not MENUPMPT), then ANSI_NORMAL."

[messages.mud_menu_prompt_normal]
text = "\u001B[1;30m[\u001B[0mMAJORMUD\u001B[1;30m]\u001B[0m: {@ANSI_NORMAL}"
pattern = "mud_menu_prompt"
note = "The bare `[MAJORMUD]:` prompt then ANSI_NORMAL, after the game-full refusal."

[messages.menu_invalid_option]
text = "\rInvalid Option."
note = "An unknown word at the main menu; the `\\r[MAJORMUD]: ` prompt follows."

[messages.ansi_normal]
text = "{@ANSI_NORMAL}"
note = "ANSI_NORMAL alone, as printed after the main menu."

[messages.bbs_menu]
text = "\r\u001B[32m\u001B[1mPlease select one of the following:\u001B[0m\r\r   \u001B[36m\u001B[1mM\u001B[33m ... MajorMUD\r\r\u001B[33m\u001B[1mMain Menu\r\u001B[36m\u001B[1mMake your selection (X to exit): "
pattern = "bbs_menu_prompt"
note = "The `compat.bbs_menu` shim: the BBS main menu MegaMud login scripts wait for, byte for byte as MBBSEmu prints it. Not part of the game itself."

[messages.bbs_enter_module]
text = "\u001B[2J\u001B[H"
note = "MBBSEmu clears the screen when `M` selects the module, before the module's first output."

[messages.bbs_logoff_warning]
text = "\u001B[37m\u001B[5m\u001B[1mYou are about to terminate this connection!\u001B[0m\r\r\u001B[36m\u001B[1mAre you sure (Y/N, or R to re-logon)? "
note = "`X` at the BBS menu shim."

[messages.bbs_goodbye]
text = "\r\r\u001B[32m\u001B[1mOk, thanks for calling!\r\rHave a nice day...\r\r"
note = "`Y` at the logoff confirmation; the connection is closed after it."

[messages.help_prompt]
