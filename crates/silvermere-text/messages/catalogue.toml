# ---- T-045: communications ---------------------------------------------------------

[messages.telepath_nothing]
text = "You have to telepath something!\r"
note = "`/name` or `TELEPATH` with nothing after it (margc 1)."
[messages.telepath_no_target]
text = "You have to specify a person to telepath to.\r"
note = "A `/` on its own, then the message."
[messages.telepath_blocking]
text = "You may not telepath while you are blocking telepaths.\r"
[messages.telepath]
text = "{@ANSI_CLRLINE}{@ANSI_FGGREEN}{who} telepaths: {@COL_TELEPATH}{text}\r"
pattern = "telepath"
example = { who = "Bob", text = "@heal" }
note = "What the receiver sees, in the receiver's palette; the receiver's prompt follows."
[messages.telepath_what]
text = "{@ANSI_CLRLINE}{@ANSI_FGGREEN}What do you really mean?\r"
note = "`TELEPATH name` without a message; the clear-line and green were already queued. (sic) The target's page count has gone up by then."
[messages.telepath_sent]
text = "{@ANSI_GREY}--- Telepath Sent to {who} ---\r"
pattern = "telepath_status"
example = { who = "Bob" }
[messages.telepath_not_sent]
text = "{@ANSI_GREY}--- Telepath Not Sent ---\r"
pattern = "telepath_status"
note = "Out of pages, blocking telepaths or the sender forgotten: the sender is not told which."
[messages.telepath_self]
text = "Why are you telepathing to yourself?\r"
[messages.user_unknown]
text = "Cannot find user!\r"
pattern = "user_unknown"
[messages.direct_nothing]
text = "You have to direct something!\r"
[messages.direct_no_target]
text = "You have to specify a person to direct to.\r"
[messages.direct_muted]
text = "{@ANSI_CLRLINE}{@ANSI_GREEN}You may not direct any messages right now.\r"
[messages.says_to_you]
text = "{@ANSI_CLRLINE}{@ANSI_GREEN}{who} says (to you) \"{text}\"\r"
pattern = "says_to_you"
example = { who = "Bob", text = "hi" }
note = "The target's line; the target's prompt follows."
[messages.says_to]
text = "{@ANSI_CLRLINE}{@ANSI_GREEN}{who} says (to {target}) \"{text}\"\r"
pattern = "says_to_you"
example = { who = "Bob", target = "Brynja", text = "hi" }
note = "The rest of the room (tell_room TRN_ALWAYS, TRB_ALL, with the prompt)."
[messages.direct_what]
text = "{@ANSI_CLRLINE}{@ANSI_GREEN}What do you really mean?\r"
note = "`DIRECTMSG name` without a message. (sic) The target's page count has gone up by then."
[messages.message_directed]
text = "{@ANSI_GREY}--- Message Directed to {who} ---\r"
pattern = "telepath_status"
example = { who = "Bob" }
[messages.message_not_sent]
text = "{@ANSI_GREY}--- Message Not Sent ---\r"
pattern = "telepath_status"
note = "The target is not in the sender's room, or is hidden there."
[messages.direct_self]
text = "Why are you directing messages to yourself?\r"
[messages.broadcast]
text = "{@ANSI_CLRLINE}{@ANSI_YELLOW}Broadcast from {who} \"{text}\"\r"
pattern = "broadcast"
example = { who = "Bob", text = "hi" }
note = "Sent with tell_group to the speaker's channel, the speaker included."
[messages.channel_users]
text = "{@ANSI_CLRLINE}The following users are on channel {n}:\r{names}\r"
args = { n = "i32" }
example = { n = "1", names = "Bob, Brynja" }
note = "`'`, `-` or BROADCAST alone; `names` is every player in the game on the channel, in channel order, joined with `, `."
[messages.gossip_refused]
text = "You may not use gossip - please contact your sysop.\r"
note = "The account lacks the gossip permission (GOSSKEY, `hasgoss`)."
[messages.gossip_turned_off]
text = "You may not use gossip while your gossip is turned off.\rType 'gossip' to turn gossip on again.\r"
[messages.gossip_prefix]
text = "{@ANSI_CLRLINE}{who} gossips: "
example = { who = "Bob" }
note = "The first of two tell_game sends (no prompt, no colour); the text follows in [`channel_text`] with COL_BROADCAST and the prompt. Each send counts against the listener's gossip allowance."
[messages.auction_refused]
text = "You may not use auction - please contact your sysop.\r"
[messages.auction_turned_off]
text = "You may not use auction while your auction is turned off.\rType 'auction' to turn auction on again.\r"
[messages.auction_prefix]
text = "{@ANSI_CLRLINE}{who} auctions: "
example = { who = "Bob" }
[messages.channel_text]
text = "{text}\r"
example = { text = "hello" }
note = "The gossip or auction text, sent after its prefix with the COL_BROADCAST row and the listener's prompt."
[messages.forget_list_head]
text = "Forgotten Users:\r"
[messages.forget_list_empty]
text = "You have not forgotten any users.\r"
[messages.forget_list_name]
text = "{name}\r"
example = { name = "Bob" }
[messages.forget_removed]
text = "You have no longer forgotten {name}\n"
example = { name = "Bob" }
note = "(sic) Ends in `\\n`, not `\\r`, as the game prints it; the wire shows `\\r\\n` either way (render normalises line ends)."
[messages.forget_too_long]
text = "Your forget list is too long.\r"
[messages.forget_added]
text = "You have now forgotten {name}\n"
example = { name = "Bob" }
note = "(sic) Ends in `\\n`, as [`forget_removed`]."

