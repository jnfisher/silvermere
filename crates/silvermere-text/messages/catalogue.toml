note = "The help topic prompt of the main menu's H and of SUBST_HELP, with the ANSI_NORMAL on either side; the topic list before it is help_text's."

[messages.room_debug]
text = "DBG: {room} Map: {map}\r"
args = { room = "u32", map = "u32" }
example = { room = "2140", map = "1" }
note = "Only for a sysop with SYSOP DEBUG on, after the room display's ANSI_CLRLINE."

[messages.room_title]
text = "{@ANSI_LTCYAN}{name}\r"
wrap = true
example = { name = "Newhaven, Village Entrance" }
note = "After the room display's ANSI_CLRLINE; a FILE DESCRIPTION room shows the first line of its file instead."

[messages.room_long_desc]
text = "{@ANSI_CLRLINE}{@ANSI_NORMAL}    {text}\r"
wrap = true
example = { text = "Welcome to Newhaven! You are standing at the crude wooden gates of the " }
note = "`text` is the seven description lines, each non-empty one depadded and followed by one space, so the paragraph ends in a space before the line end."

[messages.room_shop_desc]
text = "{text}\r"
wrap = true
example = { text = "A stocky man stands behind the counter. " }
note = "A shop room's three description lines after the room's paragraph, joined the same way; only when one of them is not empty."

[messages.room_file_line]
text = "{line}\r"
wrap = true
example = { line = "Entrance White House Room" }
note = "One line of a FILE DESCRIPTION file, after the prefix the room's third description line names; the title shows the first, LOOK all of them."

[messages.conversion_rates]
text = "{@ANSI_CLRLINE}{@ANSI_CYAN}\rThe currency conversion rates are:\r{plat_per_runic} platinum pieces == 1 {runic}\r{gold_per_plat} gold crowns == 1 platinum piece\r{silv_per_gold} silver nobles == 1 gold crown\r{copper_per_silv} copper farthings == 1 silver noble\r"
args = { plat_per_runic = "u32", gold_per_plat = "u32", silv_per_gold = "u32", copper_per_silv = "u32" }
example = { plat_per_runic = "100", gold_per_plat = "10", silv_per_gold = "10", copper_per_silv = "10", runic = "runic coins" }
note = "The bank's conversion rates: the coin names are the singular and plural currency names (currnames/currname1); `runic` is the sysop's USRCURNM, which fills the runic slot of both tables. Shown after a bank's description."

[messages.blind]
text = "You are blind.\r"
pattern = "blind"
note = "can_see() for a player with ST_BLIND; in the room display it follows the ANSI_CLRLINE and nothing else is shown."

[messages.room_dark]
text = "The room is {light} - you can't see anything\r"
pattern = "room_dark"
example = { light = "very dark" }
note = "can_see() below LIGHT_DARK (-150); no colour of its own."

[messages.light_blinding]
text = "{light}\r"
pattern = "blind"
example = { light = "You are blind!" }
note = "can_see() above LIGHT_BLIND (900): the light's description alone, which at that level is always `You are blind!`."

[messages.noise_above]
text = "{@ANSI_CLRLINE}{@ANSI_MAGENTA}You hear movement above you!\r"
pattern = "noise"

[messages.noise_below]
text = "{@ANSI_CLRLINE}{@ANSI_MAGENTA}You hear movement below you!\r"
pattern = "noise"

[messages.hiding_seen]
text = "{@ANSI_LTRED}You see {who} hiding in the shadows.\r"
pattern = "hiding_seen"
example = { who = "Bob" }
note = "The players hidden in the room: the names joined with \", \"."

[messages.look_around]
text = "{@ANSI_CLRLINE}{who} is looking around the room.\r"
pattern = "look_others"
example = { who = "Bob" }
note = "To the room after a bare LOOK, unless the looker is hidden."
# --- T-024: the command pipeline (execute_input, handle_commands, the pending queue) ---

