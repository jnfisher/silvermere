note = "The new name is a game command word (parse_command)."
[messages.name_invalid_new]
text = "{@ANSI_LTRED}The name you have chosen is invalid!\r"
[messages.name_validating_plain]
text = "Please wait - Validating your name.\r "
pattern = "name_validating"
note = "The new-name prompt's copy, without the ANSI_LTCYAN of `name_validating`."
[messages.name_taken]
