[messages.sysop_menu]
text = "\r[SYSOP MENU]\r\rC - Clear all saved evil points\rCP- Clear all saved profiles (for resetting only)\rR - Reindex the Limited Items  (RF = Full reindex)\rD - Check for defunct MUD users, etc.\rH - Check for item hoarders\rI - Sysop Instructions (wccmmud.rln)\rN - Sysop Release notes (wccmmsys.rel)\rS - Online Sysop Command Help (wccmmsys.not)\rL - Change the limits for defunct user checking\rX - Exit to Main Menu\r\r\u001B[1;30m[\u001B[0mMAJORMUD Sysop\u001B[1;30m]\u001B[0m: {@ANSI_NORMAL}"
