# SUICIDE, SUICIDE NOW and REROLL (T-068): cmd_suicide and commit_suicide.
[messages.suicide_tournament]
text = "You may not suicide or reroll during a tournament.\r"
[messages.suicide_room_refused]
text = "You may not suicide or reroll in this room!\r"
note = "A Colliseum room while the arena switch (arenasafe) is on."
[messages.suicide_enter_password]
text = "{@ANSI_CLRLINE}Enter your suicide password:"
note = "The password is then read with `*` echoed for each key (echsec, eight characters); the answer is handled as SUBST_SUICIDE."
[messages.suicide_item_returned]
text = "Your {item} has returned to its rightful place.\r"
pattern = "item_returned"
example = { item = "ruby" }
note = "An item set to be destroyed on death, or one that cannot be placed in the room or along the trail."
[messages.suicide_deleted]
text = "{@ANSI_LTREDBLK}\rAfter a LONG thought, you take your own life\r{@ANSI_NORMAL}"
pattern = "suicide"
note = "The character is deleted (last life, SUICIDE NOW or REROLL): no full stop, unlike the life-lost line. The main menu and ANSI_NORMAL follow."
[messages.suicide_life_lost]
text = "{@ANSI_LTREDBLK}\rAfter a LONG thought, you take your own life.\rYou now have {lives} lives remaining.\r"
pattern = "suicide"
args = { lives = "i32" }
example = { lives = "2" }
[messages.suicide_room]
text = "{@ANSI_CLRLINE}{who} took their own life!\r"
pattern = "suicide"
example = { who = "Bob" }
note = "To the rest of the room (tell_room, TRN_ALWAYS, TRB_ALL, with the prompt, no colour)."
[messages.goodtext]
text = "\u001B[0m\rYou must now choose if you want to be a truly 'lawful' citizen of the realm.\rIf you answer YES to this question then you will never be allowed to instigate\rany action which would give you evil points, and any player that attacks or\rrobs from you will receive three times the regular evil points in return. You\rcan still attack those with a bad reputation. This option is designed\rsolely for those who want to stay away from the player combat aspects of the\rgame, and choosing it for any other reason (Item storage, etc...) is strictly\rprohibited.\r\rRemember, this is a very important choice. Once you have chosen Lawfulness,\ryou may not remove this title, unless you start a new character.\r"
note = "The same bytes as messages/wcctext.toml `goodtext` (the converted .MSG text), here so the engine has it as a Msg; tests/msg_catalogue.rs pins the .MSG file."
[messages.goodpmpt]
text = "\u001B[0m\rDo you want to be \u001B[1mLawful\u001B[0m?  [Yes/No] "
pattern = "chargen_lawful"
note = "The same bytes as messages/wcctext.toml `goodpmpt` (the converted .MSG text), here so the engine has it as a Msg; tests/msg_catalogue.rs pins the .MSG file."
[messages.chsrace]
text = "\u001B[0m\r\u001B[32mPlease choose your race [ ? for help ] : "
pattern = "chargen_choose"
note = "The same bytes as messages/wcctext.toml `chsrace` (the converted .MSG text), here so the engine has it as a Msg; tests/msg_catalogue.rs pins the .MSG file."
[messages.chsclass]
text = "\u001B[0m\r\u001B[32mPlease choose your class [ ? for help ] : "
pattern = "chargen_choose"
note = "The same bytes as messages/wcctext.toml `chsclass` (the converted .MSG text), here so the engine has it as a Msg; tests/msg_catalogue.rs pins the .MSG file."

# ---- T-027: the info commands (LOOK, EXPERIENCE, the status displays, HELP, the menu screens).
# Field widths (`%-29.29s`, `%5d`, ...) are applied by the engine before the argument is
# passed; each entry's note gives them.

[messages.st_name]
text = "{@ANSI_CLRLINE}{@ANSI_RESET}{@ANSI_FGGREEN}Name: {@ANSI_FGCYAN}{name}    {@ANSI_FGGREEN}Lives/CP:  {@ANSI_FGCYAN}{lives}/{cp}\r"
pattern = "st_name"
example = { name = "Kasimir Drakemoor            ", lives = "    9", cp = "12   " }
note = "name is `%-29.29s` of \"first last\", lives `%5d`, cp `%-5d`, padded by the engine (display/status.rs)."

[messages.st_race]
text = "{@ANSI_FGGREEN}Race: {@ANSI_FGCYAN}{race} {@ANSI_FGGREEN}Exp: {@ANSI_FGCYAN}{exp} {@ANSI_FGGREEN}Perception:  {@ANSI_FGCYAN}{perception}\r"
pattern = "st_race"
example = { race = "Kang       ", exp = "1712           ", perception = "   33" }
note = "race `%-11.11s`, exp `%-15.15s` of `%lu` or `%lu%09lu` when the billions are not 0, perception `%5d`."

[messages.st_class]
text = "{@ANSI_FGGREEN}Class: {@ANSI_FGCYAN}{class} {@ANSI_FGGREEN}Level: {@ANSI_FGCYAN}{level}         {@ANSI_FGGREEN}Stealth:     {@ANSI_FGCYAN}{stealth}\r"
pattern = "st_class"
example = { class = "Witchunter", level = "2    ", stealth = "    0" }
note = "class `%-10.10s`, level `%-5d`, stealth `%5d`."

[messages.st_hits]
text = "{@ANSI_FGGREEN}Hits: {@ANSI_FGCYAN}{hp}/{maxhp} {@ANSI_FGGREEN}Armour Class: {@ANSI_FGCYAN}{ac}/{dr} {@ANSI_FGGREEN}Thievery:    {@ANSI_FGCYAN}{thievery}\r"
pattern = "st_hits"
example = { hp = "   48", maxhp = "56   ", ac = " 19", dr = "1 ", thievery = "    0" }
note = "hp `%5d`, maxhp `%-5d`, armour class `%3d` and damage resistance `%-2d` (both tenths of the armour rating), thievery `%5d`."

[messages.st_traps]
text = "                                       {@ANSI_FGGREEN}Traps:       {@ANSI_FGCYAN}{traps}\r"
example = { traps = "    0" }
note = "The magery line of a class without magic (MAGERY_NONE and anything unknown): traps `%5d` alone. No `pattern`: as st_picklocks, the leading blanks; tests/info_commands.rs checks the st_traps regex on the trimmed line."

[messages.st_mana]
text = "{@ANSI_FGGREEN}Mana: {mark}{mana}/{maxmana} {@ANSI_FGGREEN}Spellcasting: {@ANSI_FGCYAN}{spellcast}  {@ANSI_FGGREEN}Traps:       {@ANSI_FGCYAN}{traps}\r"
example = { mark = "\u001b[1;31m*\u001b[0;36m", mana = "   9", maxmana = "9    ", spellcast = "40   ", traps = "    0" }
note = "Mage, Priest, Druid and Bard. `mark` is `ANSI_LTRED \"*\" ANSI_CYAN` for a character with the Mana ability, else `ANSI_FGCYAN \" \"`; mana `%4d`, maxmana `%-5d`, spellcasting `%-5d`, traps `%5d`. No `pattern`: the registry example (`Mana: *  9/9    Spellcasting`) does not follow these widths; tests/info_commands.rs checks the st_mana regex."

[messages.st_kai]
text = "{@ANSI_FGGREEN}Kai:  {mark}{mana}/{maxmana}                      {@ANSI_FGGREEN}Traps:       {@ANSI_FGCYAN}{traps}\r"
example = { mark = "\u001b[36m ", mana = "   3", maxmana = "3    ", traps = "    0" }
note = "Kai classes: kai `%4d`/`%-5d` with the Mana-ability mark as st_mana, traps `%5d`."

[messages.st_picklocks]
text = "{@ANSI_FGGREEN}                                       Picklocks:   {@ANSI_FGCYAN}{picklocks}\r"
example = { picklocks = "    0" }
note = "picklocks `%5d`. No `pattern`: the line starts with 39 blanks, which the anchored registry regex does not allow; tests/info_commands.rs checks the st_picklocks regex on the trimmed line."

[messages.st_str]
text = "{@ANSI_FGGREEN}Strength: {mark1}{stat1}  {@ANSI_GREEN}Agility:{mark2}{stat2}       {@ANSI_GREEN}Tracking:    {@ANSI_FGCYAN}{stat3}\r"
pattern = "st_str"
example = { mark1 = "\u001b[36m ", stat1 = "79   ", mark2 = "\u001b[36m ", stat2 = "42   ", stat3 = "    0" }
note = "Each mark is `ANSI_FGCYAN \" \"` while the stat equals its base value, else `ANSI_LTRED \"*\"` (the red star of a raised or lowered stat); the two stats `%-5d`, the skill `%5d`."

[messages.st_int]
text = "{@ANSI_FGGREEN}Intellect:{mark1}{stat1}  {@ANSI_GREEN}Health: {mark2}{stat2}       {@ANSI_GREEN}Martial Arts:{@ANSI_FGCYAN}{stat3}\r"
example = { mark1 = "\u001b[36m ", stat1 = "40   ", mark2 = "\u001b[36m ", stat2 = "64   ", stat3 = "    0" }
note = "No `pattern`: the registry example prints the martial arts 0 in four columns, not `%5d`; tests/info_commands.rs checks the st_int regex. Each mark is `ANSI_FGCYAN \" \"` while the stat equals its base value, else `ANSI_LTRED \"*\"` (the red star of a raised or lowered stat); the two stats `%-5d`, the skill `%5d`."

[messages.st_wil]
text = "{@ANSI_FGGREEN}Willpower:{mark1}{stat1}  {@ANSI_GREEN}Charm:  {mark2}{stat2}       {@ANSI_GREEN}MagicRes:    {@ANSI_FGCYAN}{stat3}\r"
pattern = "st_wil"
example = { mark1 = "\u001b[36m ", stat1 = "40   ", mark2 = "\u001b[36m ", stat2 = "30   ", stat3 = "   30" }
note = "Each mark is `ANSI_FGCYAN \" \"` while the stat equals its base value, else `ANSI_LTRED \"*\"` (the red star of a raised or lowered stat); the two stats `%-5d`, the skill `%5d`."

[messages.st_poisoned]
text = "{@ANSI_LTRED}You are Poisoned!\r"
pattern = "st_poisoned"

[messages.st_rank_front]
text = "You are in the front rank of your group.\r"
pattern = "st_rank"

[messages.st_rank_back]
text = "You are in the back rank of your group.\r"
pattern = "st_rank"

[messages.st_spells_on]
text = "You have the following spell cast upon you:\r{list}.\r"
pattern = "st_spells_on"
example = { list = "  bless (5,10), light (10,40)" }
note = "The debug form only (SYSOP DEBUG on the character shown): `list` is `  name (value,rounds)` then `, name (value,rounds)` for each further spell; the plain `, name` forms never print (sic). st_blank follows."

[messages.st_blank]
text = "\r"
note = "The blank line that ends the debug spell list, printed whether or not a spell was listed."

[messages.st_spell_desc]
text = "{text}\r"
example = { text = "You are glowing." }
note = "Third text of the Descriptive Message of a spell cast on the character."

[messages.health_mana]
text = "{@ANSI_CLRLINE}{@ANSI_NORMAL}Health: {hp} [{hppct}%]  {kind}: {mana} [{manapct}%]\r"
pattern = "health"
example = { hp = "   48/56   ", hppct = "85", kind = "Mana", mana = "  9/9  ", manapct = "100" }
note = "hp is `%5d/%-5d` of the hit points and their maximum, mana `%3d/%-3d`; kind is `Kai` for a Kai class, else `Mana`."

[messages.health]
text = "{@ANSI_CLRLINE}{@ANSI_NORMAL}Health: {hp} [{hppct}%]\r"
pattern = "health"
example = { hp = "   48/56   ", hppct = "85" }
note = "hp is `%5d/%-5d` of the hit points and their maximum."

[messages.exp_line]
text = "{@ANSI_GREEN}Exp: {@ANSI_FGCYAN}{exp} {@ANSI_FGGREEN}Level: {@ANSI_FGCYAN}{level}{@ANSI_FGGREEN} Exp needed for next level: {@ANSI_FGCYAN}{left} ({need}) [{pct}%]\r"
pattern = "exp"
example = { exp = "346", level = "1", left = "1304", need = "1650", pct = "21" }
note = "exp, left and need are `%lu`, or `%lu%09lu` when their billions are not 0; pct is calc_exp_percent."

[messages.inv_carrying]
text = "{@ANSI_NORMAL}{@ANSI_CLRLINE}You are carrying {items}\r"
wrap = true
example = { items = "18 silver nobles, padded vest (Torso), quarterstaff (Two handed)" }
note = "items: the coins (runic under the sysop name, then platinum, gold, silver, copper), the worn items with ` (wornloc)`, the readied item ` (Readied/uses/10)`, the weapon ` (Two handed)` or ` (Weapon Hand)`, then the rest with a count before duplicates, joined by `, `. The whole display wraps at 79 columns (btutsw). No `pattern`: the registry example is 81 columns, so the wrap splits it; tests/info_commands.rs checks the inv_carrying regex."

[messages.inv_carrying_nothing]
text = "{@ANSI_NORMAL}{@ANSI_CLRLINE}You are carrying Nothing!\r"
wrap = true
pattern = "inv_nothing"

[messages.inv_keys_list]
text = "{@ANSI_CLRLINE}{@ANSI_NORMAL}You have the following keys: {keys}.\r"
wrap = true
pattern = "inv_keys"
example = { keys = " brass key" }
note = "The keys line inside the inventory display, wrapped at 79 like the rest of it. keys: ` name` per key kind, ` count names` for two or more (an `s` added whatever the name, sic), `,` between; newest kind first."

[messages.keys_list]
text = "{@ANSI_CLRLINE}{@ANSI_NORMAL}You have the following keys: {keys}.\r"
pattern = "inv_keys"
example = { keys = " brass key, 2 iron keys" }
note = "The KEYS command: as inv_keys_list, not wrapped."

[messages.keys_none]
text = "{@ANSI_CLRLINE}{@ANSI_NORMAL}You have no keys.\r"
pattern = "inv_no_keys"

[messages.inv_wealth]
text = "{@ANSI_GREEN}Wealth: {@ANSI_FGCYAN}{copper} {name}\r"
pattern = "inv_wealth"
args = { copper = "u32" }
example = { copper = "223", name = "copper farthings" }
note = "The total in copper and the copper coin name; INVENTORY and WEALTH print the same line."

[messages.inv_encumbrance]
text = "{@ANSI_GREEN}Encumbrance: {@ANSI_FGCYAN}{cur}/{max} - {colour}{level} [{pct}%]{@ANSI_RESET}\r"
pattern = "inv_encumbrance"
args = { pct = "i32" }
example = { cur = "520", max = "3792", colour = "\u001b[37m", level = "None", pct = "13" }
note = "colour is ANSI_FGRED for Heavy (over 66%), ANSI_FGBROWN Medium (over 33%), ANSI_FGGREEN Light (over 16%), ANSI_FGGREY None."

[messages.wealth_list]
text = "{@ANSI_CLRLINE}{@ANSI_NORMAL}You have {coins}.\r"
example = { coins = "3 gold crowns, 5 copper farthings" }
note = "The WEALTH command: the coins as in the inventory line, then inv_wealth."

[messages.wealth_none]
text = "{@ANSI_CLRLINE}{@ANSI_NORMAL}You have No money!\r"

[messages.who_header]
text = "{@ANSI_CLRLINE}{@ANSI_YELLOW}         Current Adventurers\r"
note = "No `pattern`: the nine leading blanks defeat the anchored registry regex; tests/info_commands.rs checks who_header on the trimmed line."

[messages.who_rule]
text = "{@ANSI_DKGREY}         ===================\r\r{@ANSI_RESET}"
note = "No `pattern`: as who_header; tests/info_commands.rs checks who_rule on the trimmed line."

[messages.who_tech_header]
text = "{@ANSI_CLRLINE}{@ANSI_FGMAGENTA}Title           {@ANSI_FGGREEN}Name                   {@ANSI_FGCYAN}Reputation {@ANSI_FGBROWN}Gang/Guild          {@ANSI_FGGREY}      \r{@ANSI_DKGREY}=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=\r{@ANSI_RESET}"
note = "The Technical message style (PS_TECHNICAL) heading."

[messages.who_row]
text = "{rep}{@ANSI_GREEN}{name}  {gossip}  {@ANSI_FGMAGENTA}{title}{@ANSI_FGGREEN}  {@ANSI_FGGREY}{edited}\r"
args = { gossip = "char" }
example = { rep = "         ", name = "Aldric Stonebrook", gossip = "-", title = "Apprentice", edited = " " }
note = "rep: `%8.8s ` of \"\" for a Neutral player, else the legal colour then `%8.8s ` of the legal name (`Lawful` for a forced-lawful one while ENABLAWF); name padded to max_name_len; gossip `x` when gossip is off, else `-`; edited `EDITED` or ` `."

[messages.who_row_gang]
text = "{rep}{@ANSI_GREEN}{name}  {gossip}  {@ANSI_FGMAGENTA}{title}{@ANSI_FGGREEN}  of {@ANSI_FGBROWN}{gang} {@ANSI_FGGREY}{edited}\r"
args = { gossip = "char" }
example = { rep = "\u001b[1;37m    Good ", name = "Aldric Stonebrook", gossip = "x", title = "Apprentice", gang = "Old Guard", edited = " " }
note = "As who_row, for a player in a gang."

[messages.who_tech_row]
text = "{@ANSI_FGMAGENTA}{title} {@ANSI_FGGREEN}{name}{flags} {rep} {@ANSI_BROWN}{gang} {@ANSI_FGGREY}{edited}\r"
example = { title = "Apprentice     ", name = "Aldric Stonebrook   ", flags = "  ", rep = "\u001b[36mNeutral   ", gang = "None               ", edited = "      " }
note = "title `%-15.15s`, name `%-20.20s`, flags `%c%c` (`g` and `a` for gossip and auctions off), rep the legal colour then the reputation `%-10.10s`, gang `%-19.19s` (`None`), edited `%-6.6s`."

[messages.who_end]
text = "\r"
note = "The blank line after a non-empty player list (mode 0 prints no count)."

[messages.topten_menu_header]
text = "{@ANSI_CLRLINE}{@ANSI_BROWN}Heroes of The Realm\r{@ANSI_FGGREY}=-=-=-=-=-=-=-=-=-=\r\r{@ANSI_FGRED}Ran {@ANSI_FGGREEN}Name                  {@ANSI_FGMAGENTA}Class      {@ANSI_FGBROWN}Gang/Guild          {@ANSI_FGGREEN}      \r{@ANSI_DKGREY}=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-\r{@ANSI_RESET}"
pattern = "topten_header"
