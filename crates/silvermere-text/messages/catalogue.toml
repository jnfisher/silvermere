# --- Movement and exits (T-026): move_user, user_allowed_in_room, cmd_move, searching,
# the door commands (cmd_open, cmd_close, cmd_lock, cmd_picklock, cmd_bash, cmd_drag),
# open_door_by_force and the timed reverts. The `{dir}` of a line is a live `dirnames`
# entry (letter slot and backspace included); the examples use the plain word.

[messages.move_sneaking]
text = "{@ANSI_CLRLINE}{@ANSI_GREY}Sneaking...\r"
pattern = "sneaking"

[messages.move_no_drag_in_party]
text = "{@ANSI_CLRLINE}{@ANSI_WHITE}You may not drag someone while in a party!\r"

[messages.move_too_heavy]
text = "{@ANSI_CLRLINE}{@ANSI_WHITE}You are too heavy to move!\r"
pattern = "too_heavy"

[messages.move_too_heavy_dragged]
text = "{@ANSI_CLRLINE}{@ANSI_WHITE}You are too heavy to be dragged!\r"
pattern = "too_heavy"

[messages.move_too_heavy_anywhere]
text = "{@ANSI_CLRLINE}{@ANSI_WHITE}You are too heavy to move anywhere!\r"
pattern = "too_heavy"

[messages.move_delay_debug]
text = "Delay: {delay}\r"
args = { delay = "i64" }
example = { delay = "2" }
note = "Sysops with debugging on see the delay a move was given."

[messages.ran_into_wall]
text = "{@ANSI_CLRLINE}{who} ran into the wall to the {dir}.\r"
pattern = "ran_into_wall"
example = { who = "Bob", dir = "north" }

[messages.exit_no_drag]
text = "{@ANSI_CLRLINE}You may not drag anyone through this exit.\r"
note = "The eight copies of the dragging refusal, one per gated exit type (Spell, Key, Item, Toll, Class, Race, Level, Alignment)."

[messages.exit_need_spell]
text = "{@ANSI_LTREDBLK}You need to cast a spell to go that way!\r"
pattern = "need_spell"

[messages.exit_key_closed]
text = "{@ANSI_LTREDBLK}There is a closed door in that direction!\r"
pattern = "door_closed_drag"

[messages.exit_need_item]
text = "You do not have the appropriate item to go that direction!\r"
pattern = "need_item"

[messages.exit_text_plain]
text = "{@ANSI_CLRLINE}{text}\r"
example = { text = "The gate creaks open." }
note = "A WCCMSG exit text after ANSI_CLRLINE alone; `text` is the record's line with its %s and %d filled in."

[messages.exit_text_yellow]
text = "{@ANSI_CLRLINE}{@ANSI_YELLOW}{text}\r"
example = { text = "Bob squeezes through the crack." }

[messages.exit_text_green]
text = "{@ANSI_CLRLINE}{@ANSI_GREEN}{text}\r"
example = { text = "You squeeze through the crack." }

[messages.exit_text_bare_double]
text = "{text}\r\r"
example = { text = "Bob is engulfed in a shower of sparks." }
note = "The Spell Trap room texts end with a blank line and have no line-clearing prefix (sic)."

[messages.toll_paid]
text = "{@ANSI_NORMAL}You just paid{paid} in toll charges.\r"
pattern = "toll_paid"
example = { paid = " 5 gold crowns" }
note = "`paid` lists the coins paid: each coin type as ` N name`, comma-separated, largest first, or ` nothing`."

[messages.toll_short]
text = "You do not have enough to cover the toll of {n} {cur}.\r"
pattern = "toll_short"
args = { n = "i64" }
example = { n = "5", cur = "gold crowns" }
note = "The amount is the low word of the exit's first parameter (sic)."

[messages.not_permitted]
text = "You are not permitted in that room!\r"
pattern = "not_permitted"

[messages.dragging_you]
text = "{@ANSI_LTREDBLK}{who} is dragging you around.\r"
pattern = "dragging"
example = { who = "Bob" }

[messages.dragging_you_white]
text = "{@ANSI_CLRLINE}{@ANSI_WHITE}{who} is dragging you around.\r"
pattern = "dragging"
example = { who = "Bob" }

[messages.gate_closed_locked]
text = "{@ANSI_LTREDBLK}The gate is Closed!\r"
pattern = "door_closed"
note = "Capital C: the gate's first parameter is 1 (LOCK_CLOSED, shut but unlocked); this is the wording a locked gate shows in play, because the start-up relock leaves stock gates at 2."

[messages.gate_closed]
text = "{@ANSI_LTREDBLK}The gate is closed!\r"
