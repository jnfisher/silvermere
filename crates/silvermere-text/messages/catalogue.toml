[messages.topten_menu_row]
text = "{@ANSI_FGRED}{rank}. {@ANSI_FGGREEN}{name} {@ANSI_FGMAGENTA}{class} {@ANSI_FGBROWN}{gang} {@ANSI_FGGREEN}{edited}\r"
example = { rank = "  1", name = "Bob Smith            ", class = "Warrior   ", gang = "None               ", edited = "      " }
note = "rank `%3.3s`, name `%-21.21s` of \"first last\", class `%-10.10s`, gang `%-19.19s` (`None`), edited `%-6.6s`."

[messages.topten_header]
text = "{@ANSI_CLRLINE}{@ANSI_BROWN}Top Heroes of the Realm\r{@ANSI_FGGREY}-=-=-=-=-=-=-=-=-=-=-=-\r\r"
