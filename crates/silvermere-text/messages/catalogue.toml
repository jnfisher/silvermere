# --- Banks (T-042): DEPOSIT, WITHDRAW, BANKBOOK.
[messages.bank_deposit]
text = "{@ANSI_CLRLINE}{@ANSI_CYAN}You deposit{coins}.\r"
pattern = "bank_deposit"
example = { coins = " 5 gold crowns" }
note = "`coins` lists the coins paid: ` <n> <name>` per coin type, comma separated, or ` nothing`."
[messages.bank_deposit_refused]
text = "{@ANSI_CLRLINE}{@ANSI_CYAN}The bank cannot accept your deposit at this time.\r"
pattern = "bank_misc"
note = "The balance would wrap past an unsigned 32-bit value; the coins stay in the purse."
[messages.bank_withdraw]
text = "{@ANSI_CLRLINE}{@ANSI_CYAN}You withdrew {amount} {coin}.\r"
pattern = "bank_withdraw"
args = { amount = "u32" }
example = { amount = "5", coin = "gold crowns" }
note = "The coin is always the copper name (proper_currency_name); the example is the registry's literal, which the pattern test compares."
[messages.bank_see_deposit]
text = "{@ANSI_CLRLINE}You see {who} making a deposit.\r"
pattern = "bank_misc"
example = { who = "Bob" }
[messages.bank_see_withdrawal]
text = "{@ANSI_CLRLINE}You see {who} making a withdrawal.\r"
pattern = "bank_misc"
example = { who = "Bob" }
[messages.bank_reasonable]
text = "{@ANSI_LTREDBLK}Please specify a more reasonable amount.\r"
pattern = "bank_misc"
[messages.bank_syntax_deposit]
text = "{@ANSI_LTREDBLK}Syntax: DEPOSIT {{Amount to deposit in copper}}\r"
pattern = "syntax"
[messages.bank_syntax_withdraw]
text = "{@ANSI_LTREDBLK}Syntax: WITHDRAW {{Amount to withdraw in copper}}\r"
pattern = "syntax"
[messages.bank_syntax_bankbook]
text = "{@ANSI_LTREDBLK}Syntax: BANKBOOK\r"
pattern = "syntax"
[messages.bank_not_deposit]
text = "{@ANSI_LTREDBLK}You cannot DEPOSIT if you are not in a bank!\r"
note = "Matches the `not_in_shop` pattern; its registry example is the BUY wording, which the shop card (T-041) renders."
[messages.bank_not_withdraw]
text = "{@ANSI_LTREDBLK}You cannot WITHDRAW if you are not in a bank!\r"
[messages.bank_balance]
text = "{@ANSI_CLRLINE}Your balance at {bank} (#{num}) is:\rOn deposit: {copper} {copper_name} [{@ANSI_WHITE}{gold} {@ANSI_RESET}{gold_name}]\r"
pattern = "bank_balance"
args = { num = "i64", copper = "u32" }
example = { bank = "First Bank", num = "7", copper = "523", copper_name = "copper farthings", gold = "5.23", gold_name = "gold crowns" }
note = "Sent as one piece for both lines. `gold` is `format_number_with_commas(balance/100)`, a point and the two-digit remainder (one argument, to keep `Msg` small); the single space before the reset is inside the colour."

