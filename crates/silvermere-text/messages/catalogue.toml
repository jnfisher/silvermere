[messages.topten_columns_exp]
text = "{@ANSI_FGRED}Rank {@ANSI_FGGREEN}Name                  {@ANSI_FGMAGENTA}Class      {@ANSI_FGBROWN}Gang/Guild          {@ANSI_FGGREEN}Experience   {@ANSI_FGMAGENTA}      \r{@ANSI_DKGREY}=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=\r{@ANSI_RESET}"
note = "The column titles with the Experience column (EXPINTEN)."

[messages.topten_columns]
text = "{@ANSI_FGRED}Rank {@ANSI_FGGREEN}Name                  {@ANSI_FGMAGENTA}Class      {@ANSI_FGBROWN}Gang/Guild          {@ANSI_FGGREEN}      \r{@ANSI_DKGREY}=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=\r{@ANSI_RESET}"
note = "The column titles without EXPINTEN."

[messages.topten_row_exp]
text = "{@ANSI_FGRED}{rank}. {@ANSI_FGGREEN}{name} {@ANSI_FGMAGENTA}{class} {@ANSI_FGBROWN}{gang} {@ANSI_FGGREEN}{exp} {@ANSI_FGMAGENTA}{edited}\r"
example = { rank = "  1", name = "Bob Smith            ", class = "Warrior   ", gang = "None               ", exp = "1712        ", edited = "      " }
note = "rank `%3.3s`, name `%-21.21s`, class `%-10.10s`, gang `%-19.19s` (`None`), exp `%-12.12s` of `%lu` or `%lu%09lu`, edited `%-6.6s`."

[messages.topten_row]
text = "{@ANSI_FGRED}{rank}. {@ANSI_FGGREEN}{name} {@ANSI_FGMAGENTA}{class} {@ANSI_FGBROWN}{gang}\r"
example = { rank = "  1", name = "Bob Smith            ", class = "Warrior   ", gang = "None               " }
note = "As topten_row_exp without the experience and the mark."

[messages.gangs_header]
text = "{@ANSI_CLRLINE}{@ANSI_BROWN}Top Gangs of the Realm\r{@ANSI_FGGREY}-=-==-=-=-=-=-=-=-=-=-\r\r{@ANSI_FGRED}Rank {@ANSI_FGGREEN}Gangname            {@ANSI_FGMAGENTA}Leader      {@ANSI_FGBROWN}Members {@ANSI_FGGREEN}Created\r{@ANSI_DKGREY}=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-\r{@ANSI_RESET}"
pattern = "topten_header"
note = "The top gangs heading without the experience column."

[messages.gangs_header_exp]
text = "{@ANSI_CLRLINE}{@ANSI_BROWN}Top Gangs of the Realm\r{@ANSI_FGGREY}-=-==-=-=-=-=-=-=-=-=-\r\r{@ANSI_FGRED}Rank {@ANSI_FGGREEN}Gangname            {@ANSI_FGMAGENTA}Leader      {@ANSI_FGBROWN}Members {@ANSI_FGGREEN}Created      {@ANSI_FGBROWN}Exp\r{@ANSI_DKGREY}=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-\r{@ANSI_RESET}"
note = "With the experience column: a sysop in debug mode, or EXPTOPGANG."

[messages.gang_row]
text = "{@ANSI_FGRED}{rank}. {@ANSI_FGGREEN}{name} {@ANSI_FGMAGENTA}{leader} {@ANSI_FGBROWN}{members}    {@ANSI_FGGREEN}{created}\r"
example = { rank = "  1", name = "Old Guard          ", leader = "Nester     ", members = "   3", created = "10/14/26" }
note = "rank `%3.3s`, name `%-19.19s`, leader `%-11.11s`, members `%4.4s`, created ncedat (MM/DD/YY)."

[messages.gang_row_exp]
text = "{@ANSI_FGRED}{rank}. {@ANSI_FGGREEN}{name} {@ANSI_FGMAGENTA}{leader} {@ANSI_FGBROWN}{members}    {@ANSI_FGGREEN}{created}    {@ANSI_FGBROWN}{exp}\r"
example = { rank = "  1", name = "Old Guard          ", leader = "Nester     ", members = "   3", created = "10/14/26", exp = "1000" }
note = "As gang_row with the experience `%lu`, followed for a gang past the cap (GF_OVERFLOW) by `\\r%58.58s(%d times)` (more than one wrap) and `\\r%58.58s+%lu`."

[messages.gangs_none]
text = "There are no gangs currently established!\r"

[messages.spells_kai_refused]
text = "{@ANSI_CLRLINE}You may not list your spells. You are KAI! You must list your powers.\r"
pattern = "spells_wrong_kind"

[messages.powers_refused]
text = "{@ANSI_CLRLINE}You may not list your powers. You are not KAI! You must list your spells.\r"
pattern = "spells_wrong_kind"

[messages.spells_header]
text = "{@ANSI_CLRLINE}{@ANSI_WHITE}You have the following {what}:\r"
pattern = "spells_header"
example = { what = "spells" }
note = "what: `spells` or `powers`."

[messages.spells_columns]
text = "{@ANSI_MAGENTA}Level {cost} Short Spell Name\r{@ANSI_FGCYAN}"
pattern = "spells_columns"
example = { cost = "Mana" }
note = "cost: `Mana` for SPELLS, `Kai ` for POWERS (`%4.4s`)."

[messages.spell_row]
text = "{level}   {mana} {short}  {name}\r"
example = { level = "  1", mana = "2   ", short = "mmis", name = "magic missile                 " }
note = "level `%3d`, mana `%-4d`, short name `%4.4s`, name `%-30.30s`."

[messages.spells_end]
text = "\r"
note = "After a non-empty spell list."

[messages.spells_none]
text = "You have no {what}.\r"
pattern = "spells_none"
example = { what = "spells" }

[messages.help_overview]
text = "{text}"
example = { text = "Type HELP followed by a topic\r" }
note = "HL1B0 (help_topics.toml `overview`), HELP alone."

[messages.help_body]
text = "{text}\r"
example = { text = "Attack <OPPONENT>" }
note = "A topic text (the message after its topic string) with the say and yell characters filled in."

[messages.help_topics_head]
text = "{@ANSI_NORMAL}The following help topics are currently available: \r"
pattern = "help_topics"

[messages.help_topic_list]
text = "{list}.\r"
example = { list = "Commands, Communications, Combat, Help ?" }
note = "The first word of every topic, `, ` after each, a new line before a word that would pass column 79 (HLPWIDTH), the end marker `Help ?` last with a full stop."

[messages.help_exp_header]
text = "\rLevel   Experience\r-----   ----------\r"

[messages.help_exp_row]
text = "  {level}     {exp}\r"
example = { level = " 2", exp = "1000" }
note = "level `%2d` (the next level), exp `%lu` or `%lu%09lu`."

[messages.help_list_name]
text = "{@ANSI_GREY}{name}\r"
example = { name = "Warrior" }
note = "HELP CLASSES and HELP RACES: display_class_list and display_race_list in the brief form (names only), after ANSI_NORMAL."

[messages.help_none]
text = "Sorry, no help is available for that topic!\r"
pattern = "help_none"

[messages.look_no_exit_up]
text = "{@ANSI_LTREDBLK}There are no exits upwards!\r"
pattern = "look_no_exit"

[messages.look_no_exit_down]
text = "{@ANSI_LTREDBLK}There are no exits downwards!\r"
pattern = "look_no_exit"

[messages.look_door_closed]
text = "The door is closed in that direction!\r"
pattern = "look_door_closed"
note = "No colour and no CLRLINE; a shut Key exit gives this line too."

[messages.look_cast_exit]
text = "{text}\r"
example = { text = "A shimmering wall blocks your view." }
note = "A Cast exit with a message (exitpar4s) shows its first text instead of the room."

[messages.look_dir_up]
text = "{@ANSI_CLRLINE}{who} is looking up.\r"
pattern = "look_others"
example = { who = "Bob" }
note = "To the room."

[messages.look_dir_down]
text = "{@ANSI_CLRLINE}{who} is looking down.\r"
pattern = "look_others"
example = { who = "Bob" }
note = "To the room."

[messages.look_dir]
text = "{@ANSI_CLRLINE}{who} is looking to the {dir}.\r"
pattern = "look_others"
example = { who = "Bob", dir = "north" }
note = "To the room; dir is the live dirnames word."

[messages.peek_in_above]
text = "{@ANSI_CLRLINE}{@ANSI_MAGENTA}{who} peeks in from above!\r"
pattern = "peek_in"
example = { who = "Bob" }
note = "To the room looked into."

[messages.peek_in_below]
text = "{@ANSI_CLRLINE}{@ANSI_MAGENTA}{who} peeks in from below!\r"
pattern = "peek_in"
example = { who = "Bob" }
note = "To the room looked into."

[messages.peek_in]
text = "{@ANSI_CLRLINE}{@ANSI_MAGENTA}{who} peeks in from the {dir}!\r"
pattern = "peek_in"
example = { who = "Bob", dir = "north" }
note = "To the room looked into, from the reverse direction."

[messages.look_not_here]
text = "{@ANSI_LTREDBLK}You do not see {what} here!\r"
example = { what = "bob" }
note = "what: the rest of the line after LOOK."

[messages.look_up_down]
text = "{@ANSI_CLRLINE}{@ANSI_CYAN}{who} looks {target} up and down.\r"
pattern = "look_up_down"
example = { who = "Bob", target = "Ann" }
note = "To the room, leaving out the looker and the one looked at."

[messages.look_at_you]
text = "{@ANSI_CLRLINE}{@ANSI_CYAN}{who} is looking at you.\r"
pattern = "look_others"
example = { who = "Bob" }
note = "To the player looked at, with his prompt."

[messages.look_nothing]
text = "{@ANSI_LTREDBLK}Why would you want to look at that?\r"
pattern = "look_nothing"

[messages.look_player_header]
text = "{@ANSI_CLRLINE}{@ANSI_LTCYAN}[ {first} {last}{close}{immortal}{@ANSI_GREY}{gang}"
pattern = "look_player_header"
example = { first = "Nester", last = "TheDupe", close = " ]", immortal = "", gang = " (Old Guard)" }
note = "close is ` ]` with a last name, else `]`; immortal is ANSI_FGRED ` -- Immortal !` or empty; gang ` (name)` or empty. The description follows on the next line."

[messages.look_shadowy]
text = "\rA shadowy figure\r"
note = "After the player heading, for a character with Shadow Stealth."

[messages.look_shadowy_monster]
text = "A shadowy figure\r"
note = "A monster with Shadow Stealth, after its name."

[messages.look_player_cr]
text = "\r"
note = "The line end before a Shadowform text block."

[messages.look_player]
text = "\r{first} is a {build} with {looks}.  {manner}.  {first} appears to be {mind}.  {state}.\r"
wrap = true
pattern = "look_player"
example = { first = "Bob", build = "healthy, moderately built Human Warrior", looks = "short brown hair and hazel eyes", manner = "He moves cautiously, and is likable in an unassuming sort of way", mind = "intelligent and looks fairly knowledgeable", state = "He is unwounded" }
note = "The description, wrapped at 79 columns (btutsw). build is `%s, %s ` of the health and strength phrases then `%s %s` of race and class; looks `%s%s hair and %s eyes`; manner `%s moves %s, and is %s`; mind `%s and %s` of intellect and willpower; state `%s is %s%s` with the bleeding clause (so a full stop follows its `!`, sic)."

[messages.look_desc_msg]
text = "{text}\r"
example = { text = "He is glowing." }
note = "Second text (`msgs[1]`) of a Descriptive Message, its %s filled with the pronoun."

[messages.look_equipped]
text = "{@ANSI_FGBROWN}\r{pronoun} is equipped with:\r\r{@ANSI_FGGREEN}"
pattern = "look_equipped"
example = { pronoun = "He" }

[messages.look_equip_readied]
text = "{@ANSI_FGGREEN}{name} {@ANSI_FGCYAN}(Readied)\r"
example = { name = "torch                         " }
note = "name `%-30.30s`; a readied light source only."

[messages.look_equip_worn]
text = "{@ANSI_FGGREEN}{name} {@ANSI_FGCYAN}({loc})\r"
example = { name = "padded vest                   ", loc = "Torso" }
note = "name `%-30.30s`, loc the worn-location name."

[messages.look_equip_worn_debug]
text = "{@ANSI_FGGREEN}{name} ({uses}) {@ANSI_FGCYAN}({loc})\r"
args = { uses = "i32" }
example = { name = "padded vest", uses = "5", loc = "Torso" }
note = "Sysop debug: the uses left, unpadded name."

[messages.look_equip_weapon]
text = "{@ANSI_FGGREEN}{name} {@ANSI_FGCYAN}(Weapon Hand)\r"
example = { name = "quarterstaff                  " }
note = "name `%-30.30s`."

[messages.look_equip_end]
text = "{nothing}\r"
example = { nothing = "" }
note = "nothing: `Nothing\\r` when nothing is equipped, else empty; then the blank line."

[messages.look_monster_name]
text = "{@ANSI_CLRLINE}{@ANSI_LTCYAN}{name}{@ANSI_GREY}\r"
example = { name = "giant rat" }

[messages.look_monster_desc]
text = "{text}\r"
wrap = true
example = { text = "A large rat. " }
note = "The known monster description lines, depadded, each followed by a blank, up to the first empty one; wrapped at 79."

[messages.look_monster]
text = "{pronoun} appears to be {wound}.\r"
wrap = true
pattern = "look_monster"
example = { pronoun = "The giant rat", wound = "unwounded" }
note = "He: the pronoun for the gender; wound in the monster steps."

[messages.look_poisoned]
text = "{pronoun} is poisoned!\r"
wrap = true
pattern = "look_poisoned"
example = { pronoun = "Bob" }

[messages.look_monster_desc_msg]
text = "{text}\r"
wrap = true
example = { text = "It is glowing." }
note = "As look_desc_msg, inside the monster display (wrapped)."

[messages.look_item]
text = "{@ANSI_CLRLINE}{@ANSI_FGGREY}{text}\r"
wrap = true
example = { text = "A simple wooden staff. " }
note = "The item description lines, depadded, each followed by a blank; wrapped at 79."

[messages.look_spell]
text = "{@ANSI_CLRLINE}{name} ({short}):\r"
example = { name = "magic missile", short = "mmis" }

[messages.look_spell_noshort]
text = "{@ANSI_CLRLINE}{name}:\r"
example = { name = "magic missile" }

[messages.look_spell_desc]
text = "{text}\r"
example = { text = "A bolt of force." }

[messages.long_text_start]
text = "{@ANSI_CLRLINE}{@ANSI_GREEN}"
note = "display_long_text: before the first part."

[messages.long_text_part]
text = "{text}"
wrap = true
example = { text = "The text.\r" }
note = "One part of a WCCTEXT text, wrapped at 79 (btutsw)."

[messages.long_text_end]
text = "\r"
note = "When the last part did not end its line."

