# Generated from WCCMMHLP.MSG by tools/msgconv/msgconv.py --help-topics; do not edit by hand.
# `overview` is HL1B0; each [[topic]] is an HL1Tn message and the message after it in file
# order. `words` is the topic string the HELP command matches; `text` is the body, a catalogue template whose `{talk_char}` and
# `{yell_char}` are the say and yell characters (the file's two `%c`). `body_key` is the
# message the text came from. The last row, `Help ?`, is the end marker.

overview = "\u001B[0m\u001B[2JType \u001B[1;33mHELP \u001B[0mfollowed by a topic for help on that topic\r(\u001B[1;36mNOTE: \u001B[0mIf you are in the\rHelp Sub-menu, there is no need to type \u001B[1;33mHELP\u001B[0m, just the topic will be fine)\r\r\u001B[1;33mTips     \u001B[0m- A few tips to help you get started.\r\u001B[1;33mCommands \u001B[0m- A list of commands available within the game\r\u001B[1;33mStats1   \u001B[0m- An explanation of the statistics of your character\r\u001B[1;33mStats2   \u001B[0m- A continuation of stats1, including help on allocating your stats\r\u001B[1;33mCombat   \u001B[0m- Everything you need to know about killing others\r\u001B[1;33mRaces    \u001B[0m- A list of the various races\r\u001B[1;33mClasses  \u001B[0m- For help on a certain class, type Help <Classname>\r\u001B[1;33mCommun   \u001B[0m- Communicating with others in the realm\r\u001B[1;33mInfo     \u001B[0m- A list of information commands, and how to use them\r\u001B[1;33mSpells   \u001B[0m- Everything you need to know about spellcasting\r\u001B[1;33mShops    \u001B[0m- Buying and selling of items in the Realm\r\u001B[1;33mLaws     \u001B[0m- Before thinking of doing anything nasty, read this\r\u001B[1;33mMovement \u001B[0m- How to travel throughout the Realm\r\u001B[1;33mParty    \u001B[0m- You have friends? Well here's how to use them\r\u001B[1;33mItems    \u001B[0m- Commands related to items within the game\r\u001B[1;33mHelp     \u001B[0m- A quick description of how to use the help system\r\u001B[1;33mTopics   \u001B[0m- A list of all available topics\r\u001B[1;33mProfile  \u001B[0m- Setting up your personal options within the game\r\u001B[1;33mMisc     \u001B[0m- Miscellaneous commands\r\u001B[1;33mSet      \u001B[0m- Various toggleable profile options\r"

[[topic]]
key = "HL1T1"
body_key = "HL1B1"
words = "Commands comands"
text = "\u001B[0m\u001B[2J   \u001B[1mMovement: \u001B[0mNorth, East, South, West, Northeast, Southeast, Southwest,\r             Northwest, Sneak, Hide, Drag <Char Name>, Go <Location>\r\r       \u001B[1mInfo: \u001B[0mLook, Look <Direction>, Status, Inventory, Bank, Topten, Statline,\r             Help, Search, Health, Brief, Verbose, Map, Profile, Keys, Track <User>\r\r     \u001B[1mCombat: \u001B[0mAttack, Bash, Punch, Kick, Jumpkick, Backstab (BS), Break, Aid\r\r      \u001B[1mItems: \u001B[0mWear, Remove, Use, Get, Light, Drop, Stash, Give\r\r      \u001B[1mShops: \u001B[0mList, Buy, Sell, Inventory \r\r\u001B[1mCommunicate: \u001B[0m{talk_char}<Message>(Talking), {yell_char}<Message>(Yelling)\r\r      \u001B[1mParty: \u001B[0mInvite, Join, Follow, Party\r\r     \u001B[1mSpells: \u001B[0mSpells, Cast <Spellname>, Mana, Invoke <Kai Power>, Powers\r\r    \u001B[1mProfile: \u001B[0mStatline On/Off/Full/Custom, Brief, Verbose, Talk fast, Talk Slow\r\r       \u001B[1mMisc: \u001B[0mSuicide, Reroll, Train, Train Stats, Greet, Ask\r\rFor full detailed information on each command, type the according sub-header.\r(Ie... If you wanted to find out about sneak, type help movement)\r          "

[[topic]]
key = "HL1T1A"
body_key = "HL1B1A"
words = "Communications telepaths talking forget communicate yelling speaking telepathy"
text = "\u001B[0m\u001B[2J\r\u001B[1m{talk_char}<TEXT>             \u001B[0m- Allows you to communicate to others in the same room\r                      as yourself (Ie... .Hey Dakor, how's life?)\r\u001B[1m{yell_char}<TEXT>             \u001B[0m- Allows you to be heard in adjacent rooms, as well as\r                      the one you are currently in.\r\u001B[1m/Username <TEXT>    \u001B[0m- Allows you to telepath to someone. He/She will be the\r                      only one to hear your words.\r\u001B[1mAsk <NPC> <MESSAGE> \u001B[0m- To solve certain quests, etc... you will sometimes have\r                      to seek out information from various NPCs (Non-Player\r                      Characters). For example, if have heard that Jack the\r                      bartender knows a certain something about, say, the\r                      Holy Sword, you would type Ask Jack Holy Sword.\r\u001B[1mSay <MESSAGE>       \u001B[0m- Some areas in the game require you to say certain words\r                      or sentences. For example, if the password to the\r                      Thieves Guild was ORANGE you would stand before the\r                      entrance and type \u001B[1;36mSay Orange\u001B[0m.\r\u001B[1mGossip <MESSAGE>    \u001B[0m- Everything that you say in gossip will be heard by all\r                      who have their gossip flag turned on. You may toggle it\r                      on or off by simply typing \"Gossip\".\r\u001B[1mAuction <MESSAGE>   \u001B[0m- Exactly the same as gossip. Mostly used as a channel to\r                      trade or sell items to other adventurers.\r\u001B[1mForget <Player> \u001B[0m-Typing this once will cause any telepaths from the\r\t\t      player to be ignored. Typing this the second time with the same player\r                      specified will allow you to see their telepaths. Typing \"Forget\" by itself will show\r\t\t      all users you are not receiving telepaths from.\r"

[[topic]]
key = "HL1T2"
body_key = "HL1B2"
words = "Combat attacking bash punch kick jumpkick kill force autocombat fire fight kick killblow"
text = "\u001B[0m\u001B[2J\u001B[1;33mAttack    Bash      Backstab    Fire    Cast\rKick      Punch     Jumpkick    Break\r\r\u001B[37mAttack <OPPONENT>   \u001B[0m- Basic attack command. Will attack with whatever weapon\r                      is readied. If you are unarmed, you will punch.\r\u001B[1mBash <OPPONENT>     \u001B[0m- More powerful attack. Does more damage, but harder to\r\u001B[1mForce                 \u001B[0mland.  Also good for knocking down doors.\r\u001B[1mBackstab <OPPONENT> \u001B[0m- Only allowed if you are successfully hiding or sneaking\r                      Easier to land, and does very high damage at higher\r                      levels.  (BS for short)\r\u001B[1mPunch               \u001B[0m- Basic Mystic attack command.\r\u001B[1mKick                \u001B[0m- Slower and less accurate than a punch, but will cause\r                      more damage. (Good for martial artists)\r\u001B[1mJumpkick            \u001B[0m- The most devastating martial arts attack. Can be used\r                      from the backrank very effectively. Mystics only.\r\u001B[1mBreak               \u001B[0m- Will break off autocombat.\r\r"

[[topic]]
key = "HL1T3"
body_key = "HL1B3"
words = "Races"
text = "\u001B[0m\u001B[2J\rType \u001B[1;33mHELP \u001B[36m<Race Name> \u001B[0mfor specific help on a race.\r"

[[topic]]
key = "HL1T4"
body_key = "HL1B4"
words = "Classes"
text = "\u001B[0m\u001B[2J\rType \u001B[1;33mHELP \u001B[36m<class name> \u001B[0mfor specific help on a class.\r\rType \u001B[1;33mHELP CLASS POWERS \u001B[0mfor descriptions of the powers assigned to classes.\r\rType \u001B[1;33mHELP CLASS SKILLS1 \u001B[0mor \u001B[1;33mHELP CLASS SKILLS2 \u001B[0mfor descriptions of the skills\rassigned to classes.\r\r"

[[topic]]
key = "HL1T4A"
body_key = "HL1B4A"
words = "Class Powers"
text = "\u001B[0m\u001B[2J\r \u001B[1mHP/level: \u001B[0mThe number of Hit Points a class gains when going up a level, plus\r           or minus the Health adjustment.\r\r \u001B[1mMagic: \u001B[0mThe type and level of magic use the character has. The type of magic\r        'Mage, Druid, etc...' is self-explanatory. A magic level of 1\r        indicates minor magical abilities 'ie. Priest-1'. A magic level of 2\r        is average magical skill, and a magic level of 3 shows excellent\r        magical powers. Kai powers are a Mystic's mental powers, and a Mystic\r        will gain new ones as he gets more experienced.\r\r \u001B[1mCombat: \u001B[0mThis is a measure of the combat effectiveness of the class. A combat\r         of 1 is Poor, 2 is Fair, 3 is Average, 4 is Good, and 5 is\r         Excellent. This affects accuracy and speed of attacks.\r\r \u001B[1mWeapons: \u001B[0mThis shows what weapons a character may use. 1-handed means any\r          one-handed weapon, Any means, of course, any weapon. Blunt means\r          only blunt weapons may be used (mace, etc...) and Staff means only\r          the staff and dagger may be used.\r\r \u001B[1mArmour: \u001B[0mLike weaponry, this indicates what armour a class may use. Scale\r         means up to and including scale armour. Leather means up to and\r         including Studded Leather. Any class may wear robes.\r"

[[topic]]
key = "HL1T4B"
body_key = "HL1B4B"
words = "Class Skills1 class skills 1 traps"
text = "\u001B[0m\u001B[2J\r \u001B[1mBash: \u001B[0mThis is the ability to deal a heavy, innacurate blow. See HELP COMBAT\r       for details. Any class may Bash, but character classes with weak combat\r       will rarely hit.\r\r \u001B[1mStealth: \u001B[0mThis is the skill of sneaking and concealment. A character with\r          this skill can lurk in wait, concealed in the shadows of the room\r          by typing HIDE. This can be used for a backstab. Also, you can\r          sneak into a room by typing SNEAK and then moving. If you are lucky,\r          no-one will see you, and then you can try to HIDE immediately or\r          backstab some unfortunate person.\r\r \u001B[1mTraps: \u001B[0mAnyone with the Traps skill is proficient in finding and disarming\r        traps. Normally anyone can find a trap by searching, but someone with\r        the Traps skill has a much higher chance. Also, a traps expert can\r        attempt to disarm any trap he finds.\r\r \u001B[1mLockpicking: \u001B[0mThis is the skill of unlocking locked doors. Some doors cannot\r              be picked, and some are harder to pick than others. Once a door\r              is successfully unlocked with this skill, it may be opened\r              quite easily (unless there is a trap also!). Most locks are\r              specially enchanted so that they will re-lock after a certain\r              amount of time, so don't get yourself stuck anywhere.\r\r"

[[topic]]
key = "HL1T4C"
body_key = "HL1B4C"
words = "Class Skills2 Class Skills 2 thievery martial arts dodge"
text = "\u001B[0m\u001B[2J\r \u001B[1mThievery: \u001B[0mRobbing someone is a difficult skill, especially if the foe is not\r           just another mark. Thievery is the ability to steal cash or items\r           (non-equipped) from a character. A successful Thievery attempt will\r           either gain you one item, or a substantial amount of cash from the\r           target's money pouch.\r\r \u001B[1mTracking: \u001B[0mEveryone leaves a trail behind them while travelling around, even\r           while sneaking. With this skill, it is possible to track someone\r           wherever he goes. It is quite useful in setting up ambushes, to see\r           if the target has passed nearby recently.\r\r \u001B[1mDodge: \u001B[0mThis is the ability a Mystic has to dodge attacks and missiles\r        (including missile spells) by acrobatically leaping and rolling. This\r        ability increases as the character get more experienced.\r\r \u001B[1mMartial Arts: \u001B[0mThis is the skill Mystics use in their unarmed combat. This\r               ability allows you to attack with Punches, Kicks, and Jumpkicks\r               as opposed to only Punches from an ordinary unarmed foe. The\r               damage these attacks do increases with level, as does the\r               chance of a critical hit.\r\r No Magic Items: As a result of their vows, WitchHunter can not, and would not\r"

[[topic]]
key = "HL1T5"
body_key = "HL1B5"
words = "Info topten search who scan maps status high"
text = "\u001B[0m\u001B[2J\u001B[1;33mTopten  Bank    Map      Track   Who\rStats   Health  Save  Keys  Spells  Look     Search\r\r\u001B[37mLook        \u001B[0m- Will display all the current details of the room you are in. You\r              may look into adjacent rooms by typing Look <Direction>.\r\u001B[1mStatus      \u001B[0m- Will display your character's statistics, abilities, etc... For\r              those familiar to role-playing games, this would be called a\r              character sheet.\r\u001B[1mInventory   \u001B[0m- Displays your current possessions, including wealth on-hand, and\r              which items you have equipped.\r\u001B[1mMap         \u001B[0m- Displays a map of Silvermere. \u001B[44mANSI\u001B[40m required.\r\u001B[1mBank        \u001B[0m- Will display how much money you have stored in the bank.\r\u001B[1mWho         \u001B[0m- Displays all the current users in the Realm.\r\u001B[1mTopten      \u001B[0m- Will display the top ten adventurers in the game.\r\u001B[1mSearch      \u001B[0m- Will search the room for any hidden items, locations, etc... You\r              may also search specific objects by typing search <Object> (Ie...\r              Search Cabinet)\r\u001B[1mTrack       \u001B[0m- Allows you to pick up the trail of a certain user. You must have\r              the Track skill to use this ability.\r\u001B[1mKeys        \u001B[0m- Displays all the keys in your key-ring\r\r"

[[topic]]
key = "HL1T6"
body_key = "HL1B6"
words = "Spells cast invoke magic chant"
text = "\u001B[0m\u001B[2J\u001B[1;33mCast     Spells     Health    Break    Read <Scroll name>   Invoke\rBreak\r\r\u001B[37mCast <Spellname>   \u001B[0m- Will cast a spell accordingly, if you have enough mana\r                     points available. For combat spells, type Cast <Spellname>\r                     <Target>.  Cast by itself will re-initiate combat if\r                     appropriate.\r\u001B[1mInvoke <Kai Power> \u001B[0m- Will invoke the appropraite Kai power, if you are a Mystic\r                     and have enough Kai points to use it.\r\u001B[1mRead <Scroll name> \u001B[0m- If you are of the appropriate class and level to cast the\r                     spell in question, you will memorize the spell and the\r                     scroll will disappear\r\u001B[1mSpells             \u001B[0m- Will display all the spells currently known.\r\u001B[1mPowers             \u001B[0m- Will display all the Kai powers currently known.\r\u001B[1mHealth             \u001B[0m- Displays your current Health and Mana Points. Useful if\r                     you are not using the Statline option.\r\u001B[1mBreak              \u001B[0m- Will break off casting of auto-combat spells.\r\r"

[[topic]]
key = "HL1T7"
body_key = "HL1B7"
words = "Shops buy sell list order"
text = "\u001B[0m\u001B[2J\u001B[1;33mList     Buy      Sell\r\r\u001B[37mList   \u001B[0m- Displays the public items that are currently available in the\r               current room. This will display all the necessary information on\r\u001B[s               purchasing an item, including it's going price and how many items\u001B[u\r\u001B[0;1m               \u001B[0mare available.\r\u001B[1mBuy <Item>   \u001B[0m- Will attempt to purchase an item at the best price possible\r               (based on your charm).\r\u001B[1mSell <Item>  \u001B[0m- Will attempt to sell an item at the best price possible (Again\r               this is based on your charm).\r\u001B[1mAppraise     \u001B[0m- Informs you on the selling price you will receive for\r                the item that you are appraising.\r\r"

[[topic]]
key = "HL1T8"
body_key = "HL1B8"
words = "Movement travel north south east west northeast northwest southeast southwest up down ne nw se sw"
text = "\u001B[0m\u001B[2J\u001B[1;33mNorth      East     South    West    Northwest   Northeast   Southwest\rSoutheast  Up       Down     Sneak   Exits       Picklock    Go <Location>\r\r\u001B[37mN, E, S W, NE, SE, \u001B[0m- General movement commands (North, East, South, West,\r\u001B[1mSW, NW, Up, Down     \u001B[0metc...) To get to special locations, you may have to\r                     type a corresponding action command. (Ie... Go Hole,\r                     or Climb Tree). You should experiment with various\r                     commands.\r\u001B[1mHide               \u001B[0m- If your class permits it, you will be able to hide\r                     amongst the shadows.\r\u001B[1mSneak              \u001B[0m- If class permits, you will be able to effectively\r                     walk from room to room without being seen moving.\r\r"

[[topic]]
key = "HL1T9"
body_key = "HL1B9"
words = "Party frontrank backrank midrank invite uninvite rank parties partys"
text = "\u001B[0m\u001B[2J\u001B[1;33mInvite     Uninvite    Party     Join    Backrank   Frontrank\r\r\u001B[37mInvite <USERNAME>   \u001B[0m- Will invite someone into your adventuring group.\r\u001B[1mUninvite <USERNAME> \u001B[0m- Will kick someone out of your adventuring group.\r\u001B[1mJoin <USERNAME>     \u001B[0m- Allows you to join another user, but ONLY if he/she\r                      has already invited you.\r\u001B[1mLeave               \u001B[0m- Pretty straightforward.\r\u001B[1mParty               \u001B[0m- Will display who is in your adventuring group, and what\r                      ranks they are in.\r\u001B[1mBackrank            \u001B[0m- If you are in someone's adventuring group, this will\r                      put you into the back rank. You will be harder to hit\r                      in combat, but will also have a harder time hitting\r                      opponents with close combat attacks. Great for magic\r                      users casting ranged spells, or players with missile\r                      weapons.\r\u001B[1mFrontrank           \u001B[0m- Will place you into the frontrank, if a spot is currently\r                      available. At least the same amount of users must be in the front\r                      rank as the back. You will have an easier time hitting opponents,\r\t\t      but will get hit easier as well.\t\t      \r"

[[topic]]
key = "HL1T10"
body_key = "HL1B10"
words = "Training room advancement"
text = "\u001B[0m\rTo train to the next level, you must find the appropriate training room\rfor your class.  Once you have found it, you may purchase training if you\rhave adequate experience.\r\rAfter you have been trained, you may use the TRAIN STATS command to\rredistribute your new CP among your stats.\r\r"

[[topic]]
key = "HL1T11"
body_key = "HL1B11"
words = " chaos good evil reputation alignment criminals gods sins laws saints fiends outlaws villains seedy neutrality jail"
text = "\u001B[0m\u001B[2J\u001B[sLike any respectful city, Silvermere has its laws. Some follow them, some\rdon't.\u001B[u\r\u001B[0mIf you are in the latter category, your stay in the realm may be cut short, in\rmore ways than one. There are two main criminal acts in the Realm. Attacking\r\"innocents\" (The town doesnt care if you slay a hated person), or stealing from\rothers. Although the latter is more tolerated of course. People will be\rclassified in the following titles, so watch who you trust.\r\r\u001B[1;37mLawful   \u001B[0;32m-  Attacking a lawful player will give thrice the evil points.\r\u001B[1;37mSaint    \u001B[0;32m-  A true saint, in society and in heart. A rarity in these times.\r\u001B[1;37mGood     \u001B[0;32m-  Someone with a noteworthy reputation of lawfulness.\r\u001B[36mNeutral  \u001B[32m-  An average citizen, you will be treated fairly within the realm.\r\u001B[37mSeedy    \u001B[32m-  The dregs of society. Bad deeds done to you will be ignored.\r\u001B[35mOutlaw   \u001B[32m-  Guards will attack you on sight, but will spare your life.\r\u001B[1;35mCriminal \u001B[0;32m-  Same as Outlaw, except that Guards will SLAY you on sight.\r\u001B[31mVillain  \u001B[32m-  Same as Criminal, except that the \"Gods\" may sometimes intervene.\r\u001B[1;31mFiend    \u001B[0;32m-  The utmost in evil. Don't count on living too long in this state.\r\r\u001B[37mCurrently, the only way to become a more \"respected\" citizen is to wait it off.\r\u001B[sIn times like these, your deeds will eventually be forgotten, and it is commonly\u001B[u\r\u001B[0mknown for an infamous villain to become a well respected townsman after a\r\u001B[scertain amount of time. \r"

[[topic]]
key = "HL1T12"
body_key = "HL1B12"
words = "Tips"
text = "\u001B[0m\u001B[2JHere are some helpful \"hints\" or advice to get you started...\r\r\u001B[1;33m1. \u001B[0mRead all of the help files, or at least glance through them. This will save\r   you a lot of time and effort overall.\r\r\u001B[1;33m2. \u001B[0mPick a class that you feel comfortable with. We have tried to make ALL of\r   the classes equal in efficiency, but each one has its own unique features.\r\r\u001B[1;33m2. \u001B[0mOnce you have your character made, check out all of the stores in Newhaven\r   and equip yourself with weaponry, armour, and spells (if you are a\r   spellcaster). Don't go down into the arena until you are armed and ready.\r\r\u001B[1;33m3. \u001B[0mTo familiarize yourself with the combat system, go to the Newhaven Arena.\r   Here you will be able to earn experience for your next level, and gold to\r   purchase better weaponry and armour. Once you have enough experience to\r   obtain your next level, go to the guild and train.\r\r\u001B[1;33m4. \u001B[0mNow that you have completed these steps, you could try adventuring in\r   the dungeon past the north door in the Newhaven Arena. Type \"bash north\"\r   or \"picklock north\" (If you have the skill) to open the lock/door.\r\r"

[[topic]]
key = "HL1T13"
body_key = "HL1B13"
words = "Items give wear equipment remove get drop use light ready"
text = "\u001B[0m\u001B[2J\u001B[1;33mBuy       Sell     Get      Drop    Use        Light      Rob\rEat       Drink    Search   Hide    Inventory  Keys       Give\rList      Ready    Remove\r\r\u001B[37mWear <Item>         \u001B[0m- Equips any item that must be readied to use. Ie..\r                      armour, weapons, etc... Optional words are Arm, Wear,\r                      Wield, etc...\r\u001B[1mRemove <Item>       \u001B[0m- Will remove an equipped item.\r\u001B[1mUse <Item>          \u001B[0m- If an item has a specific use (Ie... A potion), the most\r                      common command to activate it would be USE. Some items\r                      require you to use a different action word (Ie... LIGHT\r                      torch, or RUB Lamp), so experiment.\r\u001B[1mLook <OBJECT>       \u001B[0m- Displays the visible info on an object, creature, or\r                      item.\r\u001B[1mGet <Item>          \u001B[0m- Will pick up a visable item, if you can carry it.\r\u001B[1mDrop <Item>         \u001B[0m- Will drop an item on the ground.\r\u001B[1mGive <Item><Player> \u001B[0m- Will give an item to the according user.\r\u001B[1mInventory           \u001B[0m- Displays what items, money that you own, and if\r                      they are equipped or not.\r\u001B[1mBank                \u001B[0m- Will display your current bank rating and balance.\r\u001B[1mStash/Hide <Item>   \u001B[0m- Will hide an item in a room, which can only be found\r                      again if someone successfully searches that room.\r\r"

[[topic]]
key = "HL1T14"
body_key = "HL1B14"
words = "Profile statline page talk fast talk slow statusline"
text = "\u001B[0;1;33mProfile    Statline   Verbose    Quiet     Brief\rJoin       Broadcast  Talk       Leave     Scan      Page\r\r\u001B[37mProfile              \u001B[0m- Will display your current profile settings\r\u001B[1mStatline On/Off/Full \u001B[0m- Will set your statline Prompt. On will display your\r                       current Hit Points at mana at every prompt, Off will\r                       display your standard BBS prompt, and Full acts the same\r                       as On, except that everytime you hit Enter, the brief\r                       description of your current room will be displayed.\r                       Look for help on CUSTOM for the custom statline.\r                       NOTE: Sneaking players will not show up when you hit\r                       Enter. You must type look.  \r\u001B[1mBrief                \u001B[0m- Will put on brief room descriptions\r\u001B[1mVerbose              \u001B[0m- Displays the full room description everytime that you\r                       enter a room.\r\u001B[1mTalk Fast            \u001B[0m- Turning this mode on will make it so that everything\r                       that you type, BESIDES commands, will show up as if you\r                       had spoken it. There will be no need to type . before\r                       every sentence if you wish to converse with others.\r\u001B[1mTalk Slow            \u001B[0m- If this option is used, the only way that you will be\r                       able to talk openly is by typing . before your message.\r\u001B[1mPage                 \u001B[0m- Typing page will toggle on/off the ability for other\r                       users on the system to page you while you are in the\r                       game.\r\u001B[1mSet Receive On/Off   \u001B[0m- Will toggle on your ability to receive items from other\r                       players when they use the give command. Helpful command  "

