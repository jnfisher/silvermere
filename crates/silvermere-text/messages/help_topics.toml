key = "HL1T39"
body_key = "HL1B39"
words = "Half-elfs halfelfs half elfs"
text = "\u001B[0m\r\u001B[40m\u001B[2J\u001B[0;34m\u2554\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2557\r\u2551 \u001B[1;33mHALF-ELVES\u001B[55C\u001B[37mEXP: \u001B[0m+15% \u001B[34m\u2551\r\u2560\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2563\r\u2551 \u001B[37mHalf-Elves are the offspring of a Human and an Elf. Most are born from\u001B[5C\u001B[34m\u2551\r\u2551 \u001B[37mHuman raids into Elven lands -- Humans can sometimes be despicable -- but  \u001B[34m\u2551\r\u2551 \u001B[37msome are the result of an Elf and Human partnership. This is a rare\u001B[8C\u001B[34m\u2551\r\u2551 \u001B[37moccasion, for though Elves are very beautiful to Humans, they are aloof,   \u001B[34m\u2551\r\u2551 \u001B[37mand rarely mix with others. This dubious background makes many Half-Elves  \u001B[34m\u2551\r\u2551 \u001B[37mbitter and so they remain loners, not wanting to be part of any culture    \u001B[34m\u2551\r\u2551 \u001B[37m(and in their minds, not welcome). These are usually ferocious and un-\u001B[5C\u001B[34m\u2551\r\u2551 \u001B[37mtrusting, but make good allies if you can gain their respect. They look    \u001B[34m\u2551\r\u2560\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2557 \u001B[37mmuch like humans, except they are\u001B[5C\u001B[34m\u2551\r\u2551 \u001B[1;37mStatistics\u001B[9CAbilities\u001B[7C\u001B[0;34m\u2551 \u001B[37mslimmer and more attractive, with\u001B[5C\u001B[34m\u2551\r\u2560\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2566\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2563 \u001B[37mslightly Elven features. They mix the \u001B[34m\u2551\r\u2551 \u001B[37mStrength  \u001B[31m40\u001B[37m-\u001B[32m90  \u001B[34m\u2551 \u001B[37mMana+10\u001B[9C\u001B[34m\u2551 \u001B[37mgood qualities of both races, and are \u001B[34m\u2551\r\u2551 \u001B[37mAgility   \u001B[31m45\u001B[37m-\u001B[32m110 \u001B[34m\u2551\u001B[17C\u2551 \u001B[37mquite versatile. Half-Elves have the  \u001B[34m\u2551\r\u2551 \u001B[37mHealth    \u001B[31m30\u001B[37m-\u001B[32m100 \u001B[34m\u2551\u001B[17C\u2551 \u001B[37msame increased magical power as their \u001B[34m\u2551\r\u2551 \u001B[37mIntellect \u001B[31m45\u001B[37m-\u001B[32m110 \u001B[34m\u2551\u001B[17C\u2551 \u001B[37mElven cousins, and often choose the   \u001B[34m\u2551\r\u2551 \u001B[37mWillpower \u001B[31m40\u001B[37m-\u001B[32m100 \u001B[34m\u2551\u001B[17C\u2551 \u001B[37mpath of the Ranger or Druid, due to   \u001B[34m\u2551\r\u2551 \u001B[37mCharm\u001B[5C\u001B[31m50\u001B[37m-\u001B[32m110 \u001B[34m\u2551\u001B[17C\u2551 \u001B[37mtheir preference for solitude.\u001B[8C\u001B[34m\u2551\r\u255A\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2569\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2569\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u255D\r"

