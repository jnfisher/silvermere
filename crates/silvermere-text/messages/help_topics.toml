words = "Dark-elf dark elf darkelf"
text = "\u001B[0m\r\u001B[40m\u001B[2J\u001B[0;34m\u2554\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2557\r\u2551 \u001B[0;1;33mDARK-ELVES\u001B[55C\u001B[0;1mEXP: \u001B[0m+45% \u001B[0;34m\u2551\r\u2560\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2563\r\u2551 \u001B[0mDark-Elves are not actually a seperate race, but are in fact a fanatic\u001B[5C\u001B[0;34m\u2551\r\u2551 \u001B[0msect of Elves who believe that the other races of the realm are destroying \u001B[0;34m\u2551\r\u2551 \u001B[0mthe ancient homelands of the Elves, and must be stopped for this. They are \u001B[0;34m\u2551\r\u2551 \u001B[0mthe enemy of all other races (save Elves), and will wage war with anyone   \u001B[0;34m\u2551\r\u2551 \u001B[0mwho threatens the forests and their homes. Dark-Elves do not accept the    \u001B[0;34m\u2551\r\u2551 \u001B[0mtraditional Elven belief that this is the natual course of time, and are   \u001B[0;34m\u2551\r\u2551 \u001B[0mdetermined to stop it. Consequently, they are driven from any already-\u001B[5C\u001B[0;34m\u2551\r\u2551 \u001B[0mpopulated area, and so make their homes far from the wooded groves they    \u001B[0;34m\u2551\r\u2551 \u001B[0mlove. Most live in the mountains, or in caves, and thus have a much more   \u001B[0;34m\u2551\r\u2551 \u001B[0mpallid complexion than their sylvan brethren. Due to their harsher lives   \u001B[0;34m\u2551\r\u2560\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2557 \u001B[0mthey are tougher and less friendly    \u001B[0;34m\u2551\r\u2551 \u001B[0;1mStatistics\u001B[9CAbilities\u001B[7C\u001B[0;34m\u2551 \u001B[0mbetween themselves. Any Dark-Elf seen \u001B[0;34m\u2551\r\u2560\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2566\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2563 \u001B[0moutside of a stronghold is one who    \u001B[0;34m\u2551\r\u2551 \u001B[0mStrength  \u001B[0;31m40\u001B[0m-\u001B[0;32m90  \u001B[0;34m\u2551 \u001B[0mRacial Stealth  \u001B[0;34m\u2551 \u001B[0mdoes not agree with the intolerant    \u001B[0;34m\u2551\r\u2551 \u001B[0mAgility   \u001B[0;31m50\u001B[0m-\u001B[0;32m120 \u001B[0;34m\u2551 \u001B[0mNight Vision    \u001B[0;34m\u2551 \u001B[0mviews of his people -- an outcast.    \u001B[0;34m\u2551\r\u2551 \u001B[0mHealth    \u001B[0;31m30\u001B[0m-\u001B[0;32m90  \u001B[0;34m\u2551 \u001B[0mCritical Hits+1 \u001B[0;34m\u2551 \u001B[0mDark-Elves are more skilled in combat \u001B[0;34m\u2551\r\u2551 \u001B[0mIntellect \u001B[0;31m50\u001B[0m-\u001B[0;32m120 \u001B[0;34m\u2551 \u001B[0mAccuracy Bonus  \u001B[0;34m\u2551 \u001B[0mthan the Elves, but are less powerful \u001B[0;34m\u2551\r\u2551 \u001B[0mWillpower \u001B[0;31m30\u001B[0m-\u001B[0;32m100 \u001B[0;34m\u2551\u001B[17C\u2551 \u001B[0mmagically, making them ideally suited \u001B[0;34m\u2551\r\u2551 \u001B[0mCharm\u001B[5C\u001B[0;31m40\u001B[0m-\u001B[0;32m110 \u001B[0;34m\u2551\u001B[17C\u2551 \u001B[0mto be Warlocks, Gypsies or Ninjas.    \u001B[0;34m\u2551\r\u255A\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2569\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2569\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u255D\r"

