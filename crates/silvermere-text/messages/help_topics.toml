text = "\rNo help currently available.\r"

[[topic]]
key = "HL1T81"
body_key = "HL1B81"
words = "Release Notes"
text = "\rChoose the option 'R' from the main menu for release notes on MajorMUD.\r"

[[topic]]
key = "HL1T82"
body_key = "HL1B82"
words = "Magic Resistance Magicres"
text = "\r\u001B[0;1;33mMAGIC RESISTANCE (MagicRes)\r\r\u001B[0mEvery character has a certain level of Magic Resistance. It affects your\rchance of resisting offensive spells, and reduces the damage you take from\rcombat spells significantly. Having a low value in this stat will result in\ryou getting whomped by spellcasters! Witchunters will find that they resist\rbeneficial magic as well as the offensive kind, as they never willingly\rsubmit to the effects of magic. Having a high Willpower will greatly increase\rthis stat, while Intellect will also increase it a little. Though many \rWarrior-types neglect to increase these stats, they often regret it later.\r"

[[topic]]
key = "HL1T83"
body_key = "HL1B83"
words = "CP Character Points lives/cps cps"
text = "\r\u001B[0;1;33mCHARACTER POINTS (CP)\r\r\u001B[0mEach race starts with a certain amount of CPs (character points) which may\rbe assigned to your stats.  Use these wisely because they will define the\rway your character performs in the game.\r\rWhen you train, you will receive additional CPs to assign to your stats. To do\rso, type TRAIN STATS in your training hall. Also see \u001B[0;1mStats1\u001B[0m and \u001B[0;1mStats2\u001B[0m in the\rhelp files for more information on training.\r\rNote that you do not have to assign all of your CPs to create a character.\rIf you wish, you may wait until you have entered the game and talked to \rother people before typing TRAIN STATS in your training hall to allocate\ryour CPs.\r"

[[topic]]
key = "HL1T84"
body_key = "HL1B84"
words = "Exit Quit Save"
text = "\rTyping X will start the process of exitting MajorMUD.  You will have to\rwait for 5 seconds prior to leaving the Realm.\r\rYour character will automatically be saved when you exit.\r"

[[topic]]
key = "HL1T85"
body_key = "HL1B85"
words = "Abilities"
text = "\rNo help available yet.\r"

[[topic]]
key = "HL1T86"
body_key = "HL1B86"
words = "Rest Meditate"
text = "\rThe REST command will increase your rate of HP regeneration.  You must\rremain resting for at least 20 seconds for the increase to take effect.\r\rThe MEDITATE command will increase your rate of Mana regeneration.\rYou must remain meditating for at least 20 seconds for the increase\rto take effect.\r\rIf you move, attack, or are attacked during this period, your restful/\rmeditative state will be terminated and you will get no bonus.  \r"

[[topic]]
key = "HL1T87"
body_key = "HL1B87"
words = "Buy healing temple healer chapel"
text = "\rType buy healing in the appropriate room to heal all your wounds for a price.\r"

[[topic]]
key = "HL1T88"
body_key = "HL1B88"
words = "Attack interrupts"
text = "\rPlease see help set.\r"

[[topic]]
key = "HL1T89"
body_key = "HL1B89"
words = "Critical hits"
text = "\rA critical hit is a hit which lands on a vulnerable part of the defender,\rdoing up to four times the damage of a normal hit.\r\rMost characters have only a small chance of getting a critical hit,\ralthough Mystics and Ninjas receive the proper training to increase their \rchance of getting a critical hit.\r"

[[topic]]
key = "HL1T90"
body_key = "HL1B90"
words = "Quests"
text = "\rThroughout the land, and over time, there are numerous quests in MajorMUD.\rThese include killing evil monsters, finding magical items, finding secret\rdoors and exits, and other things.\r"

[[topic]]
key = "HL1T91"
body_key = "HL1B91"
words = "Feedback bug bugs bugreport bugreports"
text = "\rFor bugreports, please email Bugs@MajorMud.com\rFor any other feedback, please email info@MajorMud.com\r"

[[topic]]
key = "HL1T92"
body_key = "HL1B92"
words = "Leave"
text = "\rThe leave command does a number of things depending on its use:\r\rYou can leave a party which you are following by typing LEAVE.\r\rYou can leave your broadcast group and switch to group 0 (no group)\rby typing LEAVE when you are not in a party.\r\rYou can leave a gang by typing LEAVE GANG.\r"

[[topic]]
key = "HL1T93"
body_key = "HL1B93"
words = "Ansi"
text = "\rANSI is a set of codes which allow your terminal to display colours and\rto move the cursor around on your screen.  Most terminal programs provide\rsupport for ANSI colours and we recommend that you enable ANSI while\ryou are playing MajorMUD\r"

[[topic]]
key = "HL1T94"
body_key = "HL1B94"
words = "Spell Level"
text = "\rEach spell has a specific level which you must attain before you may cast \rit.  This is because the spell is too powerful for you to control until\ryou reach that level.\r"

[[topic]]
key = "HL1T95"
body_key = "HL1B95"
words = "Apprentice"
text = "\rAn apprentice is a user who is just starting in the world of MajorMUD\r"

[[topic]]
key = "HL1T96"
body_key = "HL1B96"
words = "Aide"
text = "\rYou can aid a fallen player by typing AID <username>\r\rThis will stop their bleeding and give them a chance to heal instead\rof bleed to death.\r"

[[topic]]
key = "HL1T97"
body_key = "HL1B97"
words = "Share"
text = "\rThe SHARE command is used to share a certain amount of a currency\rwith either the members of your party or everyone in the room.  \rThe syntax of the command is:\r\rSHARE <amount> <currency> [WITH <ROOM/PARTY>]\r\rIf you do not specify WITH ROOM or WITH PARTY, then PARTY is assumed.\r\rIf the amount you are sharing does not divide evenly among the people\rin the room/party, then you will be left with the remainder.  In other\rwords, if you SHARE 5 GOLD and there are only 2 people other than yourself\rin your party, each will receive 2 gold and you will be left with 1.\r\rIf you attempt to SHARE with anyone who is hidden or has their RECEIVE\rset off, then they will not be included in the receipts of your sharing.\r"

[[topic]]
key = "HL1T98"
body_key = "HL1B98"
words = "Wealth"
text = "\rWEALTH will display your current monetary situation.  It will also\rdisplay the equivalent value in Copper of all the currency which you\rare carrying.\r"

[[topic]]
key = "HL1T99"
body_key = "HL1B99"
words = "Set Response"
text = "\rThe SET RESPONSE command has the following optional forms:\r\rSET RESPONSE -- Will toggle your talking responses between brief and verbose\rSET RESPONSE BRIEF   -- Will set your talking responses to BRIEF mode\rSET RESPONSE VERBOSE -- Will set your talking responses to VERBOSE mode\r\rBrief mode will only say 'well spoken' when you speak.\rVerbose mode will say 'You said \"...\"' when you speak.\r"

[[topic]]
key = "HL1T100"
body_key = "HL1B100"
words = "Keep Set Keep"
text = "\rThe SET KEEP command has the following optional forms:\r\rSET KEEP -- Will toggle the keeping of some experience after your final death\rSET KEEP OFF -- Will disable the keeping of some experience after final death\rSET KEEP ON  -- Will enable the keeping of some experience after final death\r\rWith KEEP mode 'on', when you reroll or die your final death and create a\rnew character, your new character will start with some of the experience\rwhich you created in your original character.\r"

[[topic]]
key = "HL1T101"
body_key = "HL1B101A"
words = "set statline custom statline full custom"
text = "\rThe custom statline is set by typing SET STATLINE CUSTOM xxx or\rSET STATLINE FULL CUSTOM xxx.  If you choose the FULL option then pressing\rEnter will display the same room information as the FULL statline.  \rThe xxx can be up to 60 characters long and may include spaces, etc.\rYou may include the following variables in xxx:\r      %h - current hit points\r      %H - max hit points\r      %m - current mana\r      %M - max mana\r      %c - current wealth on hand\r      %x - current experience\r      %X - experience to next level\r      %r - resting flag \" (Resting) \" when resting\r      %fn - set foreground colour (n = 0-7)\r      %bn - set background colour (n = 0-7)\r      %B - bold\r      %N - normal\r      %U - underline\r      %L - blink\r      %R - reverse\r      %d - use default colours\r      %n - line-break\r      %w - warning flag\r"

[[topic]]
key = "HL1T102"
body_key = "HL1B102"
words = "Nekojin cats"
text = "\r\u001B[40m\u001B[2J\u001B[0;34m\u2554\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2557\r\u2551 \u001B[0;1;33mNEKOJIN\u001B[58C\u001B[0;1mEXP: \u001B[0m+50% \u001B[0;34m\u2551\r\u2560\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2563\r\u2551 \u001B[0mThe feral folk known as the Nekojin hail from the far east, past the\u001B[7C\u001B[0;34m\u2551\r\u2551 \u001B[0mDwarven stronghold of Khazarad, where the burning desert wastes lay. They  \u001B[0;34m\u2551\r\u2551 \u001B[0mare a cat-like race, with long tufted ears and large oval eyes that\u001B[8C\u001B[0;34m\u2551\r\u2551 \u001B[0mglitter with a predatory intelligence. Nekojin stand about five feet tall  \u001B[0;34m\u2551\r\u2551 \u001B[0mon average, but weigh only slightly more than half a human's weight.\u001B[7C\u001B[0;34m\u2551\r\u2551 \u001B[0mBlindingly quick, they have a natural charm and speed that often over-\u001B[5C\u001B[0;34m\u2551\r\u2551 \u001B[0mwhelms all who meet them. Though they are not well-suited for scholarly    \u001B[0;34m\u2551\r\u2551 \u001B[0mpursuits, they are natural stalkers and excel in any stealthy profession.  \u001B[0;34m\u2551\r\u2560\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2557 \u001B[0mHailing from the desert, they resist  \u001B[0;34m\u2551\r\u2551 \u001B[0;1mStatistics\u001B[9CAbilities\u001B[7C\u001B[0;34m\u2551 \u001B[0mheat and fire, but are vulnerable to  \u001B[0;34m\u2551\r\u2560\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2566\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2563 \u001B[0mcold attacks. Nekojin are ferocious,  \u001B[0;34m\u2551\r\u2551 \u001B[0mStrength  \u001B[0;31m40\u001B[0m-\u001B[0;32m100 \u001B[0;34m\u2551 \u001B[0mRacial Stealth  \u001B[0;34m\u2551 \u001B[0mproud, extravagant, and extremely\u001B[5C\u001B[0;34m\u2551\r\u2551 \u001B[0mAgility   \u001B[0;31m60\u001B[0m-\u001B[0;32m130 \u001B[0;34m\u2551 \u001B[0mNight Vision    \u001B[0;34m\u2551 \u001B[0mcompetitive. They love to show off    \u001B[0;34m\u2551\r\u2551 \u001B[0mHealth    \u001B[0;31m30\u001B[0m-\u001B[0;32m80  \u001B[0;34m\u2551 \u001B[0mTracking(+10)   \u001B[0;34m\u2551 \u001B[0mand are quite friendly when the mood  \u001B[0;34m\u2551\r\u2551 \u001B[0mIntellect \u001B[0;31m40\u001B[0m-\u001B[0;32m100 \u001B[0;34m\u2551 \u001B[0mFireRes(+10%)   \u001B[0;34m\u2551 \u001B[0msuits them. All Nekojin are very\u001B[6C\u001B[0;34m\u2551\r\u2551 \u001B[0mWillpower \u001B[0;31m30\u001B[0m-\u001B[0;32m90  \u001B[0;34m\u2551 \u001B[0mColdRes(-10%)   \u001B[0;34m\u2551 \u001B[0mstealthy, can see well in the dark,   \u001B[0;34m\u2551\r\u2551 \u001B[0mCharm\u001B[5C\u001B[0;31m50\u001B[0m-\u001B[0;32m110 \u001B[0;34m\u2551\u001B[17C\u2551 \u001B[0mand have a natural tracking ability.  \u001B[0;34m\u2551\r\u255A\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2569\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2569\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u255D\r"

[[topic]]
key = "HL1T103"
body_key = "HL1B103"
words = "Gaunts Gaunt Ones"
text = "\r\u001B[40m\u001B[2J\u001B[0;34m\u2554\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2557\r\u2551 \u001B[0;1;33mGAUNT ONES\u001B[55C\u001B[0;1mEXP: \u001B[0m+50% \u001B[0;34m\u2551\r\u2560\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2563\r\u2551 \u001B[0mAlso known simply as 'Gaunts', this mysterious and reclusive folk are by   \u001B[0;34m\u2551\r\u2551 \u001B[0mfar the least fathomable of the known races. Physically, they are\u001B[10C\u001B[0;34m\u2551\r\u2551 \u001B[0mimmediately recognizable-- they stand seven feet tall on average, but are  \u001B[0;34m\u2551\r\u2551 \u001B[0mincredibly thin. They have long limbs and an elongated face, with large    \u001B[0;34m\u2551\r\u2551 \u001B[0meyes that radiate a pale glow. Gaunts dwell in the most remote areas of    \u001B[0;34m\u2551\r\u2551 \u001B[0mthe realm, and rarely mix with other folk. When they do, it is most often  \u001B[0;34m\u2551\r\u2551 \u001B[0mto hire someone to obtain rare materials, which (it is rumored) they use   \u001B[0;34m\u2551\r\u2551 \u001B[0mfor highly magical purposes. As a race they are incredibly brilliant, with \u001B[0;34m\u2551\r\u2551 \u001B[0ma masterful grasp of all things arcane and forgotten. They are also quite  \u001B[0;34m\u2551\r\u2551 \u001B[0mdevious, and show little emotion -- a combination which makes folk fearful \u001B[0;34m\u2551\r\u2560\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2557 \u001B[0mand suspicious of their motives.\u001B[6C\u001B[0;34m\u2551\r\u2551 \u001B[0;1mStatistics\u001B[9CAbilities\u001B[7C\u001B[0;34m\u2551 \u001B[0mOutsiders never see their concealed   \u001B[0;34m\u2551\r\u2560\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2566\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2563 \u001B[0mhomes. Gaunts' eyes are extremely\u001B[5C\u001B[0;34m\u2551\r\u2551 \u001B[0mStrength  \u001B[0;31m40\u001B[0m-\u001B[0;32m100 \u001B[0;34m\u2551 \u001B[0mDark Vision\u001B[5C\u001B[0;34m\u2551 \u001B[0mmagical, allowing them perfect vision \u001B[0;34m\u2551\r\u2551 \u001B[0mAgility   \u001B[0;31m50\u001B[0m-\u001B[0;32m110 \u001B[0;34m\u2551 \u001B[0mPerception+10   \u001B[0;34m\u2551 \u001B[0min total darkness, as well as a\u001B[7C\u001B[0;34m\u2551\r\u2551 \u001B[0mHealth    \u001B[0;31m30\u001B[0m-\u001B[0;32m70  \u001B[0;34m\u2551 \u001B[0mSee Hidden*\u001B[5C\u001B[0;34m\u2551 \u001B[0mheightened perception. Rumours abound \u001B[0;34m\u2551\r\u2551 \u001B[0mIntellect \u001B[0;31m60\u001B[0m-\u001B[0;32m140 \u001B[0;34m\u2551\u001B[17C\u2551 \u001B[0mabout a secret ritual that allows\u001B[5C\u001B[0;34m\u2551\r\u2551 \u001B[0mWillpower \u001B[0;31m50\u001B[0m-\u001B[0;32m100 \u001B[0;34m\u2551\u001B[17C\u2551 \u001B[0mthem, after attaining a certain level \u001B[0;34m\u2551\r\u2551 \u001B[0mCharm\u001B[5C\u001B[0;31m30\u001B[0m-\u001B[0;32m80  \u001B[0;34m\u2551 \u001B[0m*read text\u001B[6C\u001B[0;34m\u2551 \u001B[0mof power, to see hidden people.\u001B[7C\u001B[0;34m\u2551\r\u255A\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2569\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2569\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u255D\r"

[[topic]]
key = "HL1T104"
body_key = "HL1B104"
words = "Spellcasting SC"
text = "\r\u001B[0;1;33mSPELLCASTING (SC)\r\r\u001B[0m\"The\" stat to have for all spellcasters, Spellcasting is a measure of your\rknowledge and skill in casting spells. It is affected by the Magery level of\ryour class-- Mages will have a better Spellcasting than Warlocks. For Mage-\rtypes, Intellect is the main stat that increases SC, while Willpower helps\rsomewhat. For Priest-types, Willpower is the main stat, with Intellect helping\ra bit. Druid-types use both Intellect and Willpower equally, while Bards use\ronly Charm for their spellcasting. Mystics do not use any stat at all-- their\rKai powers automatically succeed when used.\r"

[[topic]]
key = "HL1T105"
body_key = "HL1B105"
words = "Perception Sight"
text = "\r\u001B[0;1;33mPERCEPTION\r\r\u001B[0mThis secondary stat is quite useful, in a variety of ways. Its most common\rfunction is used while searching for secret doors and traps, and while \rsearching rooms for concealed items. It also affects your chances of surviving\ra backstab attempt-- characters with high Perception have a much greater\rprobability of foiling an ambusher's surprise attack.\r"

[[topic]]
key = "HL1T106"
body_key = "HL1B106"
words = "Traps Disarm"
text = "\r\u001B[0;1;33mTRAPS\r\r\u001B[0mAlthough many characters do not commonly encounter traps, this skill can be\rvery useful, as many traps are simply deadly. Characters with the Traps skill\rcan attempt to disarm a trap after it is found with the \u001B[0;1msearch\u001B[0m command, by\rusing \u001B[0;1;33mDISARM TRAP \u001B[0;1;36m<direction>\u001B[0m.\r"

[[topic]]
key = "HL1T107"
body_key = "HL1B107"
words = "Mana"
text = "\r\u001B[0;1;33mMANA\r\r\u001B[0mMana is the energy force that exists in all things, and very strongly so in\rliving, sentient beings. All living beings have Mana, but only a certain, \rtrained few can tap that power to cast spells. Every spell cast has a Mana\rcost, which is deducted from your current total-- when your Mana reaches 0, \ryou cannot cast any more spells. Fortunately, everyone regenerates it naturally\rover time, though a heavily Mana-depleted Mage may have to wait for some time.\r"

[[topic]]
key = "HL1T108"
body_key = "HL1B108"
words = "gender sex"
text = "\rTo change your gender, use the command SET GENDER <male/female>\r\rNote that you may be charged up to 32000 gold to do this action\ror your sysop may have disabled this command.  If you are not\rwilling to spend the 32000 gold then check with your sysop\rbefore entering this command.\r"

[[topic]]
key = "HL1T109"
body_key = "HL1B109"
words = "Changerace changeclass change"
text = "\r\u001B[0;1;33mCHANGERACE\r\r\u001B[0mIf the ChangeRace menu command is enabled on the MajorMUD Main Menu, then you\rhave the option of changing your race for a limited time. To do so, simply\rexit the game to the main menu, select \u001B[1mCHANGERACE\u001B[0m, and follow the instructions.\rYou will be prompted to select a new race, and when you have done so, you will\rbe back at the main menu. Then enter MajorMUD once more to complete the change\rand to change your stats.\r\rThe time you have to change your race wil be displayed on the main menu beside\rthe ChangeRace menu command. The amount shown is the time your have, in\r\u001B[1mGAME MINUTES\u001B[0m, before you no longer have the option of changing your race. You\rmay change race any number of times during that period. Note that the time you\rare allowed does not tick down while you are not in the game-- it only gets\rused up while you are in MajorMUD playing, not while you are at the main menu\ror while logged off. A good use of this time is to try out a new race, test it\rto see if you like it, if its EXP chart is too high for you, and if it just\r\"feels right\". If you don't like it then you can simply change. But keep an eye\ron the time!\r\rAlso note that the race have been carefully balanced in terms of power and EXP\rcost. Some races are more suited for certain roles than others, but ALL of them\rare good. Don't overlook a Human Mage just because he doesn't have any natural\rabilities-- he will be a few levels higher than everyone else!\r"

[[topic]]
key = "HL1T110"
body_key = "HL1B110"
words = "Purge"
text = "\rThe purge command is used to remove a spell or power from your spellbook.\rOnce you have purged the spell it is gone - the only way to get it back is\rin the same manner in which you originally got it (i.e. purchase it or\rtrain for it in the case of powers)\r"

[[topic]]
key = "HL1T111"
body_key = "HL1B111"
words = "Stock  Unstock  Markup"
text = "\rThe Stock command is used to stock items in a House Shop, to stock an item\ryou must be the owner of that House Shop, by Stocking you add that item\rto the list of available items to buy.\r\u001B[0;1;33mStock <item> or\u001B[0m\r\u001B[0;1;33mStock <item> <currency> or\u001B[0m\r\u001B[0;1;33mStock <item> <price> or   \u001B[0m\r\u001B[0;1;33mStock <Item> <Price> <Currency>\rEx: Stock hatchet 1000 Gold \u001B[0m\r\rThe Unstock command is used to unstock items from a House Shop, to unstock\ran item you must be the owner of that House Shop, by Unstocking you remove\rthat item from the list of available items to buy.\r\u001B[0;1;33mUnstock <item>\u001B[0m\rEx: Unstock club\r\rThe Markup command is used to increase the percentage of cost that all items\rin the store. To markup the shop you must be the owner of that House Shop.\r\u001B[0;1;33mMarkup <percent>\u001B[0m\rEx: Markup 900\r"

[[topic]]
key = "HL1T112"
body_key = "HL1B112"
words = "Promote Demote Lieutenant"
text = "\r\u001B[0;1;33mPromote\u001B[0m and \u001B[0;1;33mDemote\u001B[0m are only usable by the gangleader on their gangmembers.\rPromote is used to promote a member to \u001B[0;1;33mLieutenant\u001B[0m. A \u001B[0;1;33mlieutenant\u001B[0m is\rable to invite and uninivte gangmembers when the gangleader is not online to\rdo it. This is useful to recruit more members without gangleader supervision,\ror to kick the player that is too rowdy out of the gang.\rDemote is used to demote a \u001B[0;1;33mLieutenant\u001B[0m to member, this is used if the\rgangleader sees that the \u001B[0;1;33mLieutenant\u001B[0m isn't doing their job!\r"

[[topic]]
key = "HL1T113"
body_key = "HL1B113"
words = "Metro Metropolis"
text = "\r\u001B[0;1;33m\rMetropolis BBS Inc.\rhttp://www.majormud.com\rhttp://www.mudcentral.com\rhttp://www.metrobbs.com/cgi-bin/dcforum/dcboard.cgi\r\u001B[0m\r"

[[topic]]
key = "HL1T114"
body_key = "HL1B114"
words = "ganghouse house guildhouse"
text = "\r\u001B[0;1;33mGanghouses\u001B[0m or \u001B[0;1;33mGuildhouses\u001B[0m are buildings that\rcan be purchased by the leader of a gang at the \u001B[0;1;33mDeed Shoppe\u001B[0m.\rEvery sundown \u001B[0;1;33mtax\u001B[0m is collected on the ganghouse, as is described in the\r\u001B[0;1;33mdeed agreement\u001B[0m. If the \u001B[0;1;33mdeed holder does not contain sufficient funds in\rtheir \u001B[0;1;33mSilvermere bank account\u001B[0m, the house is possessed along with any items\rheld within. All ganghouses contain guardians charged with keeping non-members\routside of the house walls. Some ganghouses, depending on the type, have\rshops, healers, and such. All houses have rubbish rooms for sanitary disposal.\r\u001B[0m\r"

[[topic]]
key = "HL1T9999"
body_key = "HL1B9999"
words = "Help ?"
text = "\u001B[0m\rTo get general help, type \u001B[1;33mHELP\u001B[0m.\r\rTo get a list of topics available, type \u001B[1;33mHELP TOPICS\u001B[0m.\r\rTo get help on a specific topic, type \u001B[1;33mHELP \u001B[36m<topic> \u001B[0mwhere \u001B[1;36m<topic>\r\u001B[0mis whatever\ryou need help on.  There is a large amount of help available, so try a\rvariety of topics here.\r\rIf you are in help mode already (chosen from the main MajorMUD menu), then\ryou do not need to precede each topic with 'HELP' - merely type the topic\rname in.\r\rFor this help message, type \u001B[1;33mHELP HELP\u001B[0m, or just \u001B[1;33mHELP\u001B[0m when in\rhelp mode.\r"
