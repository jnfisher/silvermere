body_key = "HL1B44"
words = "Kang"
text = "\u001B[0m\r\u001B[40m\u001B[2J\u001B[0;34m\u2554\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2557\r\u2551 \u001B[1;33mKANG\u001B[61C\u001B[37mEXP: \u001B[0m+35% \u001B[34m\u2551\r\u2560\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2563\r\u2551 \u001B[37mImagine a cross between a snake and a lizard, standing on two feet like a  \u001B[34m\u2551\r\u2551 \u001B[37mhuman and with predatory intelligence, and what you have is the Kang. They \u001B[34m\u2551\r\u2551 \u001B[37mare a mysterious folk that live in the depths of secluded swamps and\u001B[7C\u001B[34m\u2551\r\u2551 \u001B[37mjungles, and are rarely seen in mannish cities. When they do venture forth \u001B[34m\u2551\r\u2551 \u001B[37mit is to see the odd splendour of the outside world, and so the specimens  \u001B[34m\u2551\r\u2551 \u001B[37mencountered outside of their homes are usually more intelligent and\u001B[8C\u001B[34m\u2551\r\u2551 \u001B[37mfriendly than their exotic swamp neighbours. Kang are tall, many nearing   \u001B[34m\u2551\r\u2551 \u001B[37mseven feet in height, and are broadly muscled. Their scaly skin is much    \u001B[34m\u2551\r\u2551 \u001B[37mthicker than human skin, and is a different colour for each tribe. They    \u001B[34m\u2551\r\u2551 \u001B[37mhave a strange loping walk, and are not very flexible, which is odd since  \u001B[34m\u2551\r\u2560\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2557 \u001B[37mthey are snake-like. Kang apparently  \u001B[34m\u2551\r\u2551 \u001B[1;37mStatistics\u001B[9CAbilities\u001B[7C\u001B[0;34m\u2551 \u001B[37mworship a deity of Peace and Healing, \u001B[34m\u2551\r\u2560\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2566\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2563 \u001B[37mand many of them are Paladins, on\u001B[5C\u001B[34m\u2551\r\u2551 \u001B[37mStrength  \u001B[31m55\u001B[37m-\u001B[32m120 \u001B[34m\u2551 \u001B[37mResist Poisons  \u001B[34m\u2551 \u001B[37msome personal crusade to extinguish   \u001B[34m\u2551\r\u2551 \u001B[37mAgility   \u001B[31m30\u001B[37m-\u001B[32m90  \u001B[34m\u2551 \u001B[37mNatural Armour  \u001B[34m\u2551 \u001B[37mall evil in the land. They are fierce \u001B[34m\u2551\r\u2551 \u001B[37mHealth    \u001B[31m50\u001B[37m-\u001B[32m110 \u001B[34m\u2551\u001B[17C\u2551 \u001B[37mfighters, and excel as Clerics,\u001B[7C\u001B[34m\u2551\r\u2551 \u001B[37mIntellect \u001B[31m30\u001B[37m-\u001B[32m90  \u001B[34m\u2551\u001B[17C\u2551 \u001B[37mWarriors and Witchunters. Kang are    \u001B[34m\u2551\r\u2551 \u001B[37mWillpower \u001B[31m45\u001B[37m-\u001B[32m110 \u001B[34m\u2551\u001B[17C\u2551 \u001B[37mapparently immune to, or at least\u001B[5C\u001B[34m\u2551\r\u2551 \u001B[37mCharm\u001B[5C\u001B[31m30\u001B[37m-\u001B[32m85  \u001B[34m\u2551\u001B[17C\u2551 \u001B[37mresistant to, all known poisons.\u001B[6C\u001B[34m\u2551\r\u255A\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2569\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2569\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u255D\r"

[[topic]]
key = "HL1T45"
body_key = "HL1B45"
words = "Misc1 greet ask train stats"
text = "\u001B[0;1;33mSuicide     Reroll    Train     Train Stats    Greet    Ask    Rest\r\r\u001B[37mSuicide     \u001B[0m- Suicides *1* of your lives. This will have the exact same effects\r              as if you had died normally. Handy command if you are trapped,\r              stuck, or don't want to give another player the pleasure of\r              killing you.\r\u001B[1mReroll      \u001B[0m- Will reroll your current character, and ALL his lives. This will\r              take you to the MajorMUD main menu, and the next time that you\r              enter the game, you will have to create a new character.\r\u001B[1mTrain       \u001B[0m- Will train you to the next level, provided that you have enough\r              experience. You must be in an appropriate training hall to do\r              this. Remember, you get 10 or more extra character points (CPs) \r              every time that you train.  (Max of 20 CP/level after level 20)\r\u001B[1mTrain Stats \u001B[0m- Will put you into the stat editor, where you can allocate unspent\r              character points, change your physical description, etc... (\u001B[1;36mANSI\r              RECOMMENDED\u001B[0m)\r\u001B[1mGreet/Ask   \u001B[0m- Used for communicating with NPCs\r\u001B[1mRest        \u001B[0m- Puts you in rest mode. You will regenerate hit points at a faster\r              rate. You may only perform certain commands or rest mode will be\r              broken.\r\r"

[[topic]]
key = "HL1T46"
body_key = "HL1B46"
words = "Gangs top gangs guilds groups gruops bands topten gangs"
text = "\u001B[0m\r\u001B[1mCreate Gang <gang name>     \u001B[0m- Requires \u001B[1;36m100000 \u001B[0mexperience\r                            [ Max name length of 19 characters ]\r\r\u001B[1mInvite Member <user name>   \u001B[0m- Only the gang leader can invite members\r\r\u001B[1mUninvite Member <user name> \u001B[0m- Only the gang leader can invite members\r\r\u001B[1mBroadgang _or_ BG [<text>]  \u001B[0m- Broadcast will echo to all online gangmembers\r\r\u001B[1mTopten Gangs/Top <n> Gangs  \u001B[0m- A listing of the most noteworth gangs\r\r\u001B[1mDisband Gang                \u001B[0m- Only the gang leader can disband the gang\r\r-- \u001B[1;31mNote that after a gang is disbanded, the name may not be used\r   until the day after all ex gang members have entered the game\r\r\u001B[37mLeave Gang                  \u001B[0m- Leave your gang\r\r"

[[topic]]
key = "HL1T47"
body_key = "HL1B47"
words = "Stash hide"
text = "\u001B[0m\rSTASH or HIDE are used when you want to hide an item in a room out of\rvisible sight.  To recover these items later on, you will have to SEARCH\rfor them prior to GETting them.\r\rHIDE is also used to hide in the shadows.  If you are successful at hiding,\rnobody will see you until you do a noticable action, or until they SEARCH\rand find you.\r\r"

[[topic]]
key = "HL1T48"
body_key = "HL1B48"
words = "Set Warnings set maxpages set interrupts set receive warn on evil"
text = "\u001B[0m\rThe \u001B[1;33mSET \u001B[0mcommand is used to change a number of your profile options:\r\r\u001B[1mSet Suicide       \u001B[0m- Sets your suicide password in case of an accident\r\u001B[1mSet Maxpages \u001B[36m<n>  \u001B[0m- Limits the number of pages or telegrams you want to\r                    receive in each 3 second period\r\u001B[1mSet Interrupt     \u001B[0m- On forces the game to cancel all of your input and\r                    output when you are attacked by another user.  Very\r                    useful for low speed lines.\r\u001B[1mSet Messages      \u001B[0m- [Low/Medium/High] Toggles the extent of messages you will\r                    receive in the game.\r\u001B[1mSet Receive       \u001B[0m- On will prevent other players from giving you items, etc.\r\u001B[1mSet Warning       \u001B[0m- On prevents you from performing evil/unlawful actions\r\u001B[1mSet Telepath      \u001B[0m- [On/Off] To disallow other users from sending you telepaths\r\u001B[1mSet Follow        \u001B[0m- [Blind/Normal] Blind reduces the ammount of messages you\r                    receive while following in a party.\r\u001B[1mSet Entrances     \u001B[0m- [On/Off] Leaving this option on will notify you whenever\r                    an adventurer enters or leaves The Realm.\r\u001B[1mSet Speech        \u001B[0m- [Fast/Slow] Setting this option to slow will require you\r                    to use the appointed character before your message to speak\r                    (\"\u001B[1;33m.\u001B[0m\", \"\u001B[1;33m,\u001B[0m\", etc...). If you leave this option as \"Fast\",\r                    anything that you type which is not a command or action\r                    will be said by yourself to everyone in the room.\r"

[[topic]]
key = "HL1T48A"
body_key = "HL1B48A"
words = "Set2 Set entrances set speech speach set follow"
text = "\rThe SET command is used to change a number of your profile options:\r\rSET FOLLOW (Blind/Normal) -- To reduce the number of messages when following\r\rSET ENTRANCES (On/Off) -- To disable or enable the messages you receive  \r                          whenever someone enters or exits the game\r\rSET SPEECH -- Toggles fast and slow talking on and off\r"

[[topic]]
key = "HL1T48B"
body_key = "HL1B48B"
words = "Messages Set Messages"
text = "Use the Set Messages command to control the level of messages \rwhich you receive in the game:\r\rSET MESSAGES (Low/Medium/High) \r\rIn general: \ra Low message setting will only display high priority messages; \ra Medium message setting will display high and medium priortity messages; \ra High message setting will disply high, medium, and low priority messages.\r\rThe list of messages given at each level is too exhaustive to list here,\rso it is up to you to determine which setting is right for you.  Start at\ra high setting, and if you get too much on your screen then move down to\ra medium setting and then low.\r"

[[topic]]
key = "HL1T49"
body_key = "HL1B49"
words = "Broadcasting broadgang bg"
text = "\rThere are several different ways to broadcast to a group of players.\r\rOne is to type JOIN <n> where n is a number between 1 and 127.  This will\rset your broadcast channel.  To broadcast to all members on this channel,\rjust type BROADCAST <whatever>.  If you have not already got another \rglobal command using the ' symbol, you can type ' <whatever> as well.\rBROADCAST (or BR) by itself will give you a list of all the current people\ron your broadcast channel.\r\rOnce you have formed a gang, you may also use the BROADGANG (BG) command\rto broadcast to all members of your gang.  BG by itself will display a list\rof all the people in your gang, telling you which ones are online currently.\r\r"

[[topic]]
key = "HL1T50"
body_key = "HL1B50"
words = "Borrow repay identity donate loan"
text = "\rThis option not implemented.\r"

[[topic]]
key = "HL1T51"
body_key = "HL1B51"
words = "Kai Powers mystic powers"
text = "\rSee help Mystic\r"

[[topic]]
key = "HL1T52"
body_key = "HL1B52"
words = "Keys"
text = "\rKEYS - This command will display a list of the keys on your keyring\r"

[[topic]]
key = "HL1T53"
body_key = "HL1B53"
words = "Drag"
text = "\rIf another user is unconscious, you may drag them from room to room.\rThis can be used to drag them away from attacking monsters and closer to\rhealers.\r\rThere are two ways to begin dragging someone:\r\r1) Type DRAG USER.  You will go into drag mode for the user.  Each time\r   you move after that, you will be dragging the user.\r2) Type DRAG USER <direction>.  You will drag the user through the exit\r   to <direction>.  You will also go into drag mode after which all moves\r   will drag the user along with you.\r\rNote that you may move slower than normal while dragging someone.\r"

[[topic]]
key = "HL1T54"
body_key = "HL1B54"
words = "Backstab bs"
text = "\rIf you have the ability, BACKSTAB may be used while hiding or sneaking to \rget a chance at a hit which does a lot more damage than normal.\r"

[[topic]]
key = "HL1T55"
body_key = "HL1B55"
words = "Practice Arena colliseum"
text = "\rIf you are in the practice arena, you may fight with other players with\rno fear of evil points or loss of life.  If you are killed in the arena\ryou will revive in the Halls Of The Dead with as many HP as you had the\rlast time you entered the arena.\r"

[[topic]]
key = "HL1T56"
body_key = "HL1B56"
words = "Actions"
text = "\rType \u001B[37mACTION LIST\u001B[33m to list the actions available.\r\rType \u001B[37mACTION ON\u001B[33m to turn on the use of actions.\r\rType \u001B[37mACTION OFF\u001B[33m to turn off the use of actions.\r\rIf actions are turned off, you will not be able to do use any action\rcommands.\r"

[[topic]]
key = "HL1T57"
body_key = "HL1B57"
words = "Weapons armour class armor class AC DR glance glancing blows"
text = "\r\u001B[0;1;33mWEAPONS AND ARMOUR\r\r\u001B[0mThe realm is a dangerous place, and no character will survive long without\rprotection. Most character will need a good weapon-- usually the more \rexpensive, the better, but try out many different ones until you find one that\rseems right for you. One factor you must keep in mind is that all weapons have\ra minimum strength, and anyone with a lower strength will suffer from slower\rattacks. When you ready the weapon, if it says \"This weapon feels heavy in your\rhands.\", then you need more strength to wield it effectively.\r\rArmour is important for everyone. The best armours are the heavier ones, but\roften force your \u001B[0;1mencumbrance\u001B[0m up to uncomfortable levels. You should never \rneglect to wear armour, and make sure you are wearing a piece of armour on\revery location you can! Your AC/DR stat is a measure of how protected you are:\rAC stands for Armour Class, and DR stands for Damage Reduction. AC makes you \rharder to hit, as your armour deflects blows. DR absorbs the damage of\rthe attack when you do get hit. If you have high DR, the attack may do no damage at\rall! Note that your AC and DR do not affect the damage you take from spells-- \rincrease your \u001B[0;1mMagic Resistance\u001B[0m for that!\r"

[[topic]]
key = "HL1T58"
body_key = "HL1B58"
words = "Look read scrolls"
text = "\rThe look command may be used to look at a variety of things.  Just type LOOK\rfollowed by what you want to look at.  The following are a few of the things\rwhich you may look at:\r - Rooms\r - Users\r - Monsters\r - NPCs\r - Weapons\r - Armour\r - Spells\r - Scrolls\r - Items\r"

[[topic]]
key = "HL1T59"
body_key = "HL1B59"
words = "Healer temple store monsters healing rope lantern"
text = "\rYou will have to look around and speak to the NPCs to find out more \rinformation about this topic.\r"

[[topic]]
key = "HL1T60"
body_key = "HL1B61"
words = "HP Hitpoints Hits"
text = "\r\u001B[0;1;33mHIT POINTS (HP)\r\r\u001B[0mHit points are a measure of how much physical punishment you can take. Every\rtime you are hit in combat with a weapon or damage spell, your hit points will\rdrop. Naturally, you will want to have the most hit points possible! Once you\rreach 0 HP, you will drop to the ground, mortally wounded, and slowly lose\rfurther as you bleed. Once your HP reaches a certain negative number, usually\r-15, you will die. Another character may \u001B[0;1m aid \u001B[0myou to prevent further loss of\rblood and allow you to begin to slowly regain HP until you reach 1 HP once \rmore. \r\rHP may be regained through magical healing, or by natural healing which \reveryone has to some degree. Using the \u001B[0;1m rest \u001B[0mcommand will increase your natural\rhealing, but only while you remain still and out of combat.\r\r"

[[topic]]
key = "HL1T62"
body_key = "HL1B62"
words = "Follow Mode"
text = "\rTo join a party, first you must be invited by the leader (with the INVITE \rcommand).  Once you have been invited, you may type FOLLOW <username> to\rstart following that person.  While following you will move where they move\rand will show up in their PARTY command.\r\rTo stop following, you may type LEAVE, your leader may type UNINVITE <you>,\ror you may exit the game.\r"

[[topic]]
key = "HL1T63"
body_key = "HL1B63"
words = "Reroll Suicide password die"
text = "\rWhen you type REROLL, your current character will die and you will return \rto the main MMUD menu.\r\rIf you have previously set a suicide password (with the SET SUICIDE command)\rthen you will have to enter the correct password to perform this command.\r\rThe SUICIDE command will kill your current character and you will lose 1\rlife.  If this is your last life, then it will be the same as typing REROLL.\rIf you type SUICIDE NOW, this will also be the same as typing REROLL.\r"

[[topic]]
key = "HL1T64"
body_key = "HL1B64"
words = "Title"
text = "\rYour title will depend on a combination of your level and your class.  As\ryou progress through the game you will learn the meanings of each title.\r"

[[topic]]
key = "HL1T65"
body_key = "HL1B65"
words = "Follow set follow blind set follow normal"
text = "\rThere are two types of following, BLIND and NORMAL.  If you are following \r'BLIND', then you will not see any room descriptions as you move with\ryour party.  If you are following 'NORMAL', then you will see all the \rroom descriptions normally as you move.\r\rSyntax:\r\rSET FOLLOW BLIND\rSET FOLLOW NORMAL\r"

[[topic]]
key = "HL1T66"
body_key = "HL1B66"
words = "Forgive"
text = "\rIf you are attacked by accident, you may use the forgive command to \rcounter the evil points which they gained when attacking you.  You have\rapproximately 5 minutes in which to do this.\r\rSyntax:\r\rFORGIVE <user>\r"

[[topic]]
key = "HL1T67"
body_key = "HL1B67A"
words = "Join"
text = "\rThe JOIN command does one of three things:  Join a broadcast group, Join\ra party, or join a gang.  \r\rTo join a broadcast group, type JOIN <n> where <n> is a number \rbetween 1 and 126.  (You can type JOIN 0 to go back to the default\rbroadcast group)\r\rTo join a party, wait until you are invited, and type JOIN <username>.\r\rTo join a gang, wait until you are invited and type JOIN GANG <gangname>.\r\r"

[[topic]]
key = "HL1T68"
body_key = "HL1B68"
words = "Drink eat"
text = "\rSome items in the game need to be either eaten or drunk.  To do so, use the\rcommands EAT and DRINK.\r"

[[topic]]
key = "HL1T69"
body_key = "HL1B69"
words = "Stealth sneaking sneeking hiding"
text = "\r\u001B[0;1;33mSTEALTH\r\r\u001B[0mThe art of stealth manifests itself in many forms, providing additional\roffensive and defensive options the stealthy character. Using the sneak and\rhide commands, a character is able to move unseen throughout the realm. A\rsneaking character will not be seen when entering a room (provided he makes his\rstealth check), but may be seen by anyone actively looking around. It is harder\rto sneak into a well-lit or heavily populated room. A hiding character lurks in\rthe shadows, and cannot be seen at all provided a stealth check is passed. Only\rwhen someone uses the \u001B[0;1msearch\u001B[0m command will the hider be found. Neither sneak nor\rhide may be used while in combat. These two commands provide effective ways to\ravoid combat, but when used in conjunction with the \u001B[0;1mbackstab\u001B[0m command, allow\rthe stealthy character to attempt devastating surprise attacks. Backstabs may\rbe attempted after a successful sneak roll, or while hidden, and if successful\rwill do massive damage to the target. Not all weapons may be used to backstab\rwith, as some are either too big or heavy, or both. A target with high \r\u001B[0;1mperception\u001B[0m or \u001B[0;1mAC\u001B[0m will prove to be a difficult target.\r"

[[topic]]
key = "HL1T70"
body_key = "HL1B70"
words = "Brief quiet mode verbose silent"
text = "\rPlease see help for PROFILE\r"

[[topic]]
key = "HL1T71"
body_key = "HL1B71"
words = "Rob steal thievery robbing stealing"
text = "\r\u001B[0;1;33mTHIEVERY\r\r\u001B[0mCharacters with this ability may attempt to rob other users of their hard-\rearned items and currency. The following commands may be used:\r\r\u001B[0;1;33mROB <user>\r or\rROB <user> OF <item/currency>\r"

[[topic]]
key = "HL1T72"
body_key = "HL1B72"
words = "Tracking"
text = "\r\u001B[0;1;33mTRACKING\r\r\u001B[0mThis useful skill allows you to follow the trail of another character. When \rused, the tracking skill will tell you whether or not the character has passed\rthrough the room you are in, and what direction he was headed-- useful if you\rare hunting someone, or to find out where someone has been so you can run in\rthe opposite direction!\r"

[[topic]]
key = "HL1T73"
body_key = "HL1B73"
words = "Lives life"
text = "\r\u001B[0;1;33mLIVES\r\r\u001B[0mEach player starts the game with 9 lives.  Every time your train to the \rnext level, you will gain additional lives, up to the maximum. Each time you\rdie, you will lose one life and be re-incarnated somewhere in the realm.\r\rWhen you run out of lives, your character will die permanently-- it is a wise\ridea to keep careful track of how many lives you have left!\r"

[[topic]]
key = "HL1T74"
body_key = "HL1B74"
words = "Currency Silver copper gold platinum runic money $ cash mony coins"
text = "\rThe currency of the realm consists of silver, copper, gold, and platinum\rcoins.  Every once in a while you will encounter a runic coin as well.\r\rGo to one of the banks in the land to find the conversion rates between\reach of the currencies.\r"

[[topic]]
key = "HL1T75"
body_key = "HL1B75"
words = "Fire throw"
text = "\rRanged combat is not implemented yet.\r"

[[topic]]
key = "HL1T76"
body_key = "HL1B76"
words = "Gossip"
text = "\rUse the GOSSIP command to send messages to everyone in the game.  You\rcan turn off the receipt of GOSSIP messages by either typing \r\rSET GOSSIP OFF \r\ror by typing\r\rSET GOSSIP   (to toggle it on/off)   or\rGOSSIP       (by itself, to toggle it on and off)\r\rYou may turn on the receipt of gossip messages with\r\rSET GOSSIP ON\r"

[[topic]]
key = "HL1T76A"
body_key = "HL1B76A"
words = "Auction"
text = "\rUse the AUCTION command to send messages to everyone in the game.  You\rcan turn off the receipt of AUCTION messages by either typing \r\rSET AUCTION OFF \r\ror by typing\r\rSET AUCTION  (to toggle it on/off)   or\rAUCTION      (by itself, to toggle it on and off)\r\rYou may turn on the receipt of auction messages with\r\rSET AUCTION ON\r"

[[topic]]
key = "HL1T77"
body_key = "HL1B77"
words = "Encumbrance encumberance weight heavy"
text = "\r\u001B[0;1;33mENCUMBRANCE\r\r\u001B[0mEvery character has a certain amount of weight that he can carry, based on his\rstrength. The number shown on your inventory sheet is the absolute maximum that\ryou can carry-- most people will not have this much stuff in their possession!\rThere are four levels of encumbrance, each with its own modifiers:\r\r    \u001B[0;1mNo Encumbrance: \u001B[0mthe character receives a small increase to attack speed.\r \u001B[0;1mLight Encumbrance: \u001B[0mthe standard-- no penalties or benefits.\r\u001B[0;1mMedium Encumbrance: \u001B[0myou receive a penalty to attack speed and accuracy.\r \u001B[0;1mHeavy Encumbrance: \u001B[0myou receive a larger penalty to attack speed and accuracy,\r                    and the time to move between rooms is doubled!\r"

[[topic]]
key = "HL1T78"
body_key = "HL1B78"
words = "Doors open close locks picklocks unlock"
text = "\r\u001B[0;1;33mPICKLOCKS\r\r\u001B[0mThis useful ability allows you to pick the lock on a door or gate. Though some\rlocked doors may be bashed open, picking the lock will always be much easier,\rand some doors may ONLY be picked. Be aware that occasionally locks are trapped\ras well!\r"

[[topic]]
key = "HL1T78A"
body_key = "HL1B78A"
words = "Train training Levels lvls"
text = "\r\u001B[0;1;33mTRAINING\r\r\u001B[0mCharacters may train to increase their levels when they have the appropriate\ramount of experience (by typing Train), or to adjust their primary stats (by\rtyping Train Stats), when in a Training Room. Please see \u001B[0;1mStats1\u001B[0m for more\rinformation.\r"

