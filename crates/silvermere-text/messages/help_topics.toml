body_key = "HL1B21"
words = "Paladins Paladines"
text = "\u001B[0m\r\u001B[40m\u001B[2J\u001B[0;34m\u2554\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2557\r\u2551 \u001B[0;1;33mPALADINS\u001B[56C\u001B[0;1mEXP: \u001B[0m220% \u001B[0;34m\u2551\r\u2560\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2563\r\u2551 \u001B[0mThese are the holy warriors of the realm. Dedicated to fighting for their \u001B[0;34m\u2551\r\u2551 \u001B[0mdeity (which can be good OR evil, take note!), they are serious fighters  \u001B[0;34m\u2551\r\u2551 \u001B[0mwith minor priestly powers. They can use any weapon or armour, but prefer \u001B[0;34m\u2551\r\u2551 \u001B[0mswords. The Knights of the King are Paladins, as are many of the\u001B[10C\u001B[0;34m\u2551\r\u2551 \u001B[0mwandering warriors you see patrolling the roads. Most Paladins will\u001B[7C\u001B[0;34m\u2551\r\u2551 \u001B[0mactively help anyone in need, even risking their own lives to save the    \u001B[0;34m\u2551\r\u2551 \u001B[0mones they aid. Evil Paladins, of course, further their deity's will by    \u001B[0;34m\u2551\r\u2551 \u001B[0mslaying all people not of their own faith, so be wary when meeting a\u001B[6C\u001B[0;34m\u2551\r\u2551 \u001B[0mstranger offering help.\u001B[51C\u001B[0;34m\u2551\r\u2560\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2563\r\u2551 \u001B[0mHP/Level: \u001B[0;1m5-9   \u001B[0mMagic: \u001B[0;1mPriest-1  \u001B[0mCombat: \u001B[0;1mGood  \u001B[0mWeapons: \u001B[0;1mAny   \u001B[0mArmour: \u001B[0;1mAny \u001B[0;34m\u2551\r\u2560\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2563\r\u2551 \u001B[0mAbilities: \u001B[0;1mNone.\u001B[58C\u001B[0;34m\u2551\r\u255A\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u255D\r"

[[topic]]
key = "HL1T22"
body_key = "HL1B22"
words = "Witchunters witchhunters witch hunters"
text = "\u001B[0m\r\u001B[40m\u001B[2J\u001B[0;34m\u2554\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2557\r\u2551 \u001B[0;1;33mWITCHUNTERS\u001B[53C\u001B[0;1mEXP: \u001B[0m130% \u001B[0;34m\u2551\r\u2560\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2563\r\u2551 \u001B[0mWitchunters are a breed of elite warriors who have taken a vow to destroy \u001B[0;34m\u2551\r\u2551 \u001B[0mall magical enemies. They will use no magical weapons, armour or items,   \u001B[0;34m\u2551\r\u2551 \u001B[0mand will only grudgingly accept beneficial spells being cast on them.\u001B[5C\u001B[0;34m\u2551\r\u2551 \u001B[0mThey are trained from birth to be ferocious and efficient fighters, and   \u001B[0;34m\u2551\r\u2551 \u001B[0mwill give no quarter when faced with an enemy spell-caster. During their  \u001B[0;34m\u2551\r\u2551 \u001B[0mtraining to become Witchunters they develop a strong anti-magic aura,\u001B[5C\u001B[0;34m\u2551\r\u2551 \u001B[0mwhich interferes with spells being cast on them. This is due to their\u001B[5C\u001B[0;34m\u2551\r\u2551 \u001B[0mnear-fanatical focus and their strong willpower. They will use any non-   \u001B[0;34m\u2551\r\u2551 \u001B[0mmagical weapon, but will wear no armour heavier than Scale because they   \u001B[0;34m\u2551\r\u2551 \u001B[0mfavour quick, complex attacks that heavy armour will not permit.\u001B[10C\u001B[0;34m\u2551\r\u2560\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2563\r\u2551 \u001B[0mHP/Level: \u001B[0;1m6-10  \u001B[0mMagic: \u001B[0;1mn/a \u001B[0mCombat: \u001B[0;1mExcellent  \u001B[0mWeapons: \u001B[0;1mAny  \u001B[0mArmour: \u001B[0;1mScale \u001B[0;34m\u2551\r\u2560\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2563\r\u2551 \u001B[0mAbilities: No Magic Items, Anti-Magic.\u001B[12C\u001B[0;34m\u2551\r\u255A\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u255D\r"

[[topic]]
key = "HL1T23"
body_key = "HL1B23"
words = "Bards"
text = "\u001B[0m\r\u001B[40m\u001B[2J\u001B[0;34m\u2554\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2557\r\u2551 \u001B[0;1;33mBARDS\u001B[59C\u001B[0;1mEXP: \u001B[0m210% \u001B[0;34m\u2551\r\u2560\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2563\r\u2551 \u001B[0mBards are the wandering entertainers of the realm, travelling from city   \u001B[0;34m\u2551\r\u2551 \u001B[0mto city while playing songs of merriment and bringing information. In\u001B[5C\u001B[0;34m\u2551\r\u2551 \u001B[0mthat last respect, Bards are very important: few people travel far, and   \u001B[0;34m\u2551\r\u2551 \u001B[0mfor some places Bards are the only source of outside information. Thus,   \u001B[0;34m\u2551\r\u2551 \u001B[0mthey are often warmly greeted and usually stay free of charge at any\u001B[6C\u001B[0;34m\u2551\r\u2551 \u001B[0mplace they frequent. Bards are trained in exclusive colleges, where they  \u001B[0;34m\u2551\r\u2551 \u001B[0mare taught a multitude of things, from swordplay, to stealth, to magic.   \u001B[0;34m\u2551\r\u2551 \u001B[0mBards practise a unique form of magic by using their considerable musical \u001B[0;34m\u2551\r\u2551 \u001B[0mtalents to weave spells. These spells usually take the form of charming   \u001B[0;34m\u2551\r\u2551 \u001B[0mmagic. They can only use one-handed weapons, as they disdain heavy, slow  \u001B[0;34m\u2551\r\u2551 \u001B[0mweapons, and will wear only leather armour.\u001B[31C\u001B[0;34m\u2551\r\u2560\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2563\r\u2551 \u001B[0mHP/Level: \u001B[0;1m4-7 \u001B[0mMagic: \u001B[0;1mBardic  \u001B[0mCombat: \u001B[0;1mAverage \u001B[0mWeapons: \u001B[0;1m1-H \u001B[0mArmour: \u001B[0;1mLeather \u001B[0;34m\u2551\r\u2560\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2563\r\u2551 \u001B[0mAbilities: \u001B[0;1mStealth, Traps, Thievery, Lockpicking.\u001B[25C\u001B[0;34m\u2551\r\u255A\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u255D\r"

[[topic]]
key = "HL1T24"
body_key = "HL1B24"
words = "Gypsy gypsies gyspy"
text = "\u001B[0m\r\u001B[40m\u001B[2J\u001B[0;34m\u2554\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2557\r\u2551 \u001B[0;1;33mGYPSIES\u001B[57C\u001B[0;1mEXP: \u001B[0m220% \u001B[0;34m\u2551\r\u2560\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2563\r\u2551 \u001B[0mGypsies, if it is at all possible, travel even more than the Bards. In    \u001B[0;34m\u2551\r\u2551 \u001B[0mmany respects, the two classes are quite similar: they both have the same \u001B[0;34m\u2551\r\u2551 \u001B[0massortment of weapons, armour and skills. There is a profound difference, \u001B[0;34m\u2551\r\u2551 \u001B[0mthough, and that is the fact that Gypsies are not nearly as welcome as    \u001B[0;34m\u2551\r\u2551 \u001B[0mBards. This is because when a Gypsy band comes through town, things\u001B[7C\u001B[0;34m\u2551\r\u2551 \u001B[0malways disappear. They are almost compulsive thieves -- but they are not  \u001B[0;34m\u2551\r\u2551 \u001B[0mevil. Gypsies just make their money by 'alternate means', as they say.    \u001B[0;34m\u2551\r\u2551 \u001B[0mThey also command respectable magics, and this has saved many a Gypsy\u001B[5C\u001B[0;34m\u2551\r\u2551 \u001B[0mskin when the authorities have come to get them. Gypsies use the same\u001B[5C\u001B[0;34m\u2551\r\u2551 \u001B[0mweapons as thieves, for they need stealth to use their abilites, and\u001B[6C\u001B[0;34m\u2551\r\u2551 \u001B[0mbecause they need freedom in all things they do.\u001B[26C\u001B[0;34m\u2551\r\u2560\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2563\r\u2551 \u001B[0mHP/Level: \u001B[0;1m4-7  \u001B[0mMagic: \u001B[0;1mMage-2  \u001B[0mCombat: \u001B[0;1mFair  \u001B[0mWeapons: \u001B[0;1m1-H  \u001B[0mArmour: \u001B[0;1mLeather \u001B[0;34m\u2551\r\u2560\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2563\r\u2551 \u001B[0mAbilities: \u001B[0;1mStealth, Traps, Thievery, Lockpicking.\u001B[25C\u001B[0;34m\u2551\r\u255A\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u255D\r"

[[topic]]
key = "HL1T25"
body_key = "HL1B25"
words = "Mages"
text = "\u001B[0m\r\u001B[40m\u001B[2J\u001B[0;34m\u2554\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2557\r\u2551 \u001B[0;1;33mMAGES\u001B[59C\u001B[0;1mEXP: \u001B[0m140% \u001B[0;34m\u2551\r\u2560\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2563\r\u2551 \u001B[0mThere are as many kinds of Mages as there are other classes: Wizards,\u001B[5C\u001B[0;34m\u2551\r\u2551 \u001B[0mSorcerors, Necromancers, Summoners, Transmuters, Elementalists, and a\u001B[5C\u001B[0;34m\u2551\r\u2551 \u001B[0mdozen more. Most of these specialists, though, never venture forth from   \u001B[0;34m\u2551\r\u2551 \u001B[0mtheir respective towers as they are not very well suited to adventuring.  \u001B[0;34m\u2551\r\u2551 \u001B[0mFor this reason, most magic-users you meet in cities will be general\u001B[6C\u001B[0;34m\u2551\r\u2551 \u001B[0mMages. These people are quite powerful, and wield a potent magical\u001B[8C\u001B[0;34m\u2551\r\u2551 \u001B[0marsenal. Mages have at their command mostly combat and defense spells, as \u001B[0;34m\u2551\r\u2551 \u001B[0mthey are either adventurers, searching for fortune, or are the emissaries \u001B[0;34m\u2551\r\u2551 \u001B[0mof other Wizards, who need them to search out lost artifacts or spell\u001B[5C\u001B[0;34m\u2551\r\u2551 \u001B[0mcomponents. Either way, they are formidable and unpredictable foes. Mages \u001B[0;34m\u2551\r\u2551 \u001B[0muse only staves (including the staff-sling) and daggers in combat, as\u001B[5C\u001B[0;34m\u2551\r\u2551 \u001B[0mthey need as much mobility as possible. For this reason also, they will   \u001B[0;34m\u2551\r\u2551 \u001B[0monly wear robes for protection, and thus rely on their magic for\u001B[10C\u001B[0;34m\u2551\r\u2551 \u001B[0mprotection.\u001B[63C\u001B[0;34m\u2551\r\u2560\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2563\r\u2551 \u001B[0mHP/Level: \u001B[0;1m3-6  \u001B[0mMagic: \u001B[0;1mMage-3  \u001B[0mCombat: \u001B[0;1mPoor  \u001B[0mWeapons: \u001B[0;1mStaff  \u001B[0mArmour: \u001B[0;1mRobes \u001B[0;34m\u2551\r\u2560\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2563\r\u2551 \u001B[0mAbilities: \u001B[0;1mNone.\u001B[58C\u001B[0;34m\u2551\r\u255A\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u255D\r"

[[topic]]
key = "HL1T26"
body_key = "HL1B26"
words = "Warlocks"
text = "\u001B[0m\r\u001B[40m\u001B[2J\u001B[0;34m\u2554\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2557\r\u2551 \u001B[0;1;33mWARLOCKS\u001B[56C\u001B[0;1mEXP: \u001B[0m185% \u001B[0;34m\u2551\r\u2560\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2563\r\u2551 \u001B[0mWarlocks are the front-line fighters in any magical conflict. They\u001B[8C\u001B[0;34m\u2551\r\u2551 \u001B[0mcombine the best abilites of both the Warrior and Mage classes, but as a  \u001B[0;34m\u2551\r\u2551 \u001B[0mresult are not quite as effective as either of those 'pure' classes.\u001B[6C\u001B[0;34m\u2551\r\u2551 \u001B[0mThe Warlock class is quite a powerful one, though, when you think of what \u001B[0;34m\u2551\r\u2551 \u001B[0ma good fighter could do with potent magical spells! The King's Battle-    \u001B[0;34m\u2551\r\u2551 \u001B[0mMage corps is comprised almost exclusively of Warlocks. They eschew the   \u001B[0;34m\u2551\r\u2551 \u001B[0mheavier armour in favour of lighter armour, as speed is a necessity when  \u001B[0;34m\u2551\r\u2551 \u001B[0mcasting spells. They need one hand free to direct their ranged spells, so \u001B[0;34m\u2551\r\u2551 \u001B[0mthey may only use one-handed weapons.\u001B[37C\u001B[0;34m\u2551\r\u2560\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2563\r\u2551 \u001B[0mHP/Level: \u001B[0;1m4-8  \u001B[0mMagic: \u001B[0;1mMage-2 \u001B[0mCombat: \u001B[0;1mAverage \u001B[0mWeapons: \u001B[0;1m1-H \u001B[0mArmour: \u001B[0;1mChain   \u001B[0;34m\u2551\r\u2560\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2563\r\u2551 \u001B[0mAbilities: \u001B[0;1mNone.\u001B[58C\u001B[0;34m\u2551\r\u255A\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u255D\r"

[[topic]]
key = "HL1T27"
body_key = "HL1B27"
words = "Priests"
text = "\u001B[0m\r\u001B[40m\u001B[2J\u001B[0;34m\u2554\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2557\r\u2551 \u001B[0;1;33mPRIESTS\u001B[57C\u001B[0;1mEXP: \u001B[0m140% \u001B[0;34m\u2551\r\u2560\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2563\r\u2551 \u001B[0mPriests embody the virtue of their deities, be they good or evil. They    \u001B[0;34m\u2551\r\u2551 \u001B[0mchannel the power of the gods to cast their spells and are notably\u001B[8C\u001B[0;34m\u2551\r\u2551 \u001B[0mintolerant of Priests of a different faith. Good Priests are welcome in   \u001B[0;34m\u2551\r\u2551 \u001B[0mall cities for their invaluable healing services, and for their spiritual \u001B[0;34m\u2551\r\u2551 \u001B[0mguidance. Evil Priests are universally shunned, for their magical\u001B[9C\u001B[0;34m\u2551\r\u2551 \u001B[0mpractices often require human sacrifice. In fact, evil Priest seems to    \u001B[0;34m\u2551\r\u2551 \u001B[0menjoy these disgusting rites, which only perpetuates the disgust felt for \u001B[0;34m\u2551\r\u2551 \u001B[0mthem. Priests wear only robes and use blunt weapons, for good priests do  \u001B[0;34m\u2551\r\u2551 \u001B[0mnot wish to kill needlessly, and evil priests do not want the victims to  \u001B[0;34m\u2551\r\u2551 \u001B[0mbleed to death before they can use them.\u001B[34C\u001B[0;34m\u2551\r\u2560\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2563\r\u2551 \u001B[0mHP/Level: \u001B[0;1m3-6  \u001B[0mMagic: \u001B[0;1mPriest-3 \u001B[0mCombat: \u001B[0;1mPoor \u001B[0mWeapons: \u001B[0;1mBlunt  \u001B[0mArmour: \u001B[0;1mRobes \u001B[0;34m\u2551\r\u2560\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2563\r\u2551 \u001B[0mAbilities: \u001B[0;1mNone.\u001B[58C\u001B[0;34m\u2551\r\u255A\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u255D\r"

[[topic]]
key = "HL1T28"
body_key = "HL1B28"
words = "Clerics cleriks"
text = "\u001B[0m\r\u001B[40m\u001B[2J\u001B[0;34m\u2554\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2557\r\u2551 \u001B[0;1;33mCLERICS\u001B[57C\u001B[0;1mEXP: \u001B[0m220% \u001B[0;34m\u2551\r\u2560\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2563\r\u2551 \u001B[0mClerics are martial Priests. While Priests prefer using spells, Clerics   \u001B[0;34m\u2551\r\u2551 \u001B[0mprefer to fight. And they are quite good at it, too. Like Priests, they   \u001B[0;34m\u2551\r\u2551 \u001B[0mdo not enjoy bloodshed (although a little maiming is just fine), and will \u001B[0;34m\u2551\r\u2551 \u001B[0monly use blunt weapons. They will wear any armour in the fight against    \u001B[0;34m\u2551\r\u2551 \u001B[0mtheir foes, and quite a few wear the most armour they can get. Clerics    \u001B[0;34m\u2551\r\u2551 \u001B[0mare an effective class, and have a strong survival rate due to their good \u001B[0;34m\u2551\r\u2551 \u001B[0marmour and healing spells. They are a valuable addition to any party.\u001B[5C\u001B[0;34m\u2551\r\u2560\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2563\r\u2551 \u001B[0mHP/Level: \u001B[0;1m4-8  \u001B[0mMagic: \u001B[0;1mPriest-2 \u001B[0mCombat: \u001B[0;1mAverage \u001B[0mWeapons: \u001B[0;1mBlunt \u001B[0mArmour: \u001B[0;1mAny \u001B[0;34m\u2551\r\u2560\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2563\r\u2551 \u001B[0mAbilities: \u001B[0;1mNone.\u001B[58C\u001B[0;34m\u2551\r\u255A\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u255D\r"

[[topic]]
key = "HL1T29"
body_key = "HL1B29"
words = "Druids"
text = "\u001B[0m\r\u001B[40m\u001B[2J\u001B[0;34m\u2554\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2557\r\u2551 \u001B[0;1;33mDRUIDS\u001B[58C\u001B[0;1mEXP: \u001B[0m190% \u001B[0;34m\u2551\r\u2560\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2563\r\u2551 \u001B[0mDruids are the traditional protectors of the forest. They worship and\u001B[5C\u001B[0;34m\u2551\r\u2551 \u001B[0mrevere all forms of wildlife and nature. They are usually solitary folk,  \u001B[0;34m\u2551\r\u2551 \u001B[0meach keeping watch of a different part of the wilderness, but in times of \u001B[0;34m\u2551\r\u2551 \u001B[0mneed they come forth to preserve the balance of nature. Normally they are \u001B[0;34m\u2551\r\u2551 \u001B[0mquite pacifistic, and avoid combat, but when the balance of things is in  \u001B[0;34m\u2551\r\u2551 \u001B[0mdanger or their wilderness is threatened, they will retaliate with force. \u001B[0;34m\u2551\r\u2551 \u001B[0mDruids command substantial magics, and will not hesitate to use them in   \u001B[0;34m\u2551\r\u2551 \u001B[0mthe process of cleansing their lands from intruders. Druids use only\u001B[6C\u001B[0;34m\u2551\r\u2551 \u001B[0mblunt weapons as they find bloodshed distasteful, but if they are caught  \u001B[0;34m\u2551\r\u2551 \u001B[0munaware they will use their sickles to defend themselves. They will wear  \u001B[0;34m\u2551\r\u2551 \u001B[0monly natural armour. The Druids and the Rangers are very close, and they  \u001B[0;34m\u2551\r\u2551 \u001B[0moften consult each other on the ways of the world.\u001B[24C\u001B[0;34m\u2551\r\u2560\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2563\r\u2551 \u001B[0mHP/Level: \u001B[0;1m4-7 \u001B[0mMagic: \u001B[0;1mDruid-3 \u001B[0mCombat: \u001B[0;1mFair  \u001B[0mWeapons: \u001B[0;1mBlunt \u001B[0mArmour: \u001B[0;1mLeather \u001B[0;34m\u2551\r\u2560\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2563\r\u2551 \u001B[0mAbilities: \u001B[0;1mNone.\u001B[58C\u001B[0;34m\u2551\r\u255A\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u255D\r"

[[topic]]
key = "HL1T30"
body_key = "HL1B30"
words = "Rangers"
text = "\u001B[0m\r\u001B[40m\u001B[2J\u001B[0;34m\u2554\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2557\r\u2551 \u001B[0;1;33mRANGERS\u001B[57C\u001B[0;1mEXP: \u001B[0m250% \u001B[0;34m\u2551\r\u2560\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2563\r\u2551 \u001B[0mRangers are the hunters and protectors of the wilderness, along with the  \u001B[0;34m\u2551\r\u2551 \u001B[0mDruids. They will never wilingly harm an animal, but will fight in self-  \u001B[0;34m\u2551\r\u2551 \u001B[0mdefense if necessary. Rangers share the same attitudes as the Druids in   \u001B[0;34m\u2551\r\u2551 \u001B[0mrespect to what they believe in, and in fact, Rangers are just more\u001B[7C\u001B[0;34m\u2551\r\u2551 \u001B[0madventurous and militant Druids. Some unscrupulous Rangers use their\u001B[6C\u001B[0;34m\u2551\r\u2551 \u001B[0mabilities for man-hunting, at which they excel. All of them practice some \u001B[0;34m\u2551\r\u2551 \u001B[0mform of druidic magic, and this combined with their formidable combat\u001B[5C\u001B[0;34m\u2551\r\u2551 \u001B[0mabilities and their stealth makes them powerful characters. Rangers are   \u001B[0;34m\u2551\r\u2551 \u001B[0mexcellent sneakers and can plan an ambush quite well if it is necessary.  \u001B[0;34m\u2551\r\u2551 \u001B[0mThey wear only leather armour, for they need stealth and mobility to\u001B[6C\u001B[0;34m\u2551\r\u2551 \u001B[0memploy their powers, but they will use any weapon. Overall, Rangers are   \u001B[0;34m\u2551\r\u2551 \u001B[0ma powerful and expensive class.\u001B[43C\u001B[0;34m\u2551\r\u2560\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2563\r\u2551 \u001B[0mHP/Level: \u001B[0;1m5-9  \u001B[0mMagic: \u001B[0;1mDruid-1 \u001B[0mCombat: \u001B[0;1mGood  \u001B[0mWeapons: \u001B[0;1mAny  \u001B[0mArmour: \u001B[0;1mLeather \u001B[0;34m\u2551\r\u2560\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2563\r\u2551 \u001B[0mAbilities: \u001B[0;1mTracking, Stealth.\u001B[45C\u001B[0;34m\u2551\r\u255A\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u255D\r"

[[topic]]
key = "HL1T31"
body_key = "HL1B31"
words = "Mystic mystics"
text = "\u001B[0m\r\u001B[40m\u001B[2J\u001B[0;34m\u2554\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2557\r\u2551 \u001B[0;1;33mMYSTICS\u001B[57C\u001B[0;1mEXP: \u001B[0m250% \u001B[0;34m\u2551\r\u2560\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2563\r\u2551 \u001B[0mMystics are a rare and unusual class. They are the students of ancient    \u001B[0;34m\u2551\r\u2551 \u001B[0munarmed combat arts, and develop considerable mental powers (called Kai   \u001B[0;34m\u2551\r\u2551 \u001B[0mpowers) in the course of their training. The source of these Mystics is   \u001B[0;34m\u2551\r\u2551 \u001B[0mnot well known, but it is generally assumed to be an ancient teacher in   \u001B[0;34m\u2551\r\u2551 \u001B[0msome secluded cave. Of course, this Mystic teacher could live right in a  \u001B[0;34m\u2551\r\u2551 \u001B[0mcity for all that is known. There are fairly advanced disciples in most   \u001B[0;34m\u2551\r\u2551 \u001B[0mcities, and they teach these exotic skills to any they deem worthy. They  \u001B[0;34m\u2551\r\u2551 \u001B[0mhave yet to divulge the location of their master, however. Mystics'\u001B[7C\u001B[0;34m\u2551\r\u2551 \u001B[0munarmed combat is effective against weapons and armour due to their\u001B[7C\u001B[0;34m\u2551\r\u2551 \u001B[0mknowledge of critical points. Usually use no weapons at all, but some\u001B[5C\u001B[0;34m\u2551\r\u2551 \u001B[0mhave become proficient in the staff. They will wear no armour except for  \u001B[0;34m\u2551\r\u2551 \u001B[0mrobes, as speed is the main element of their art.\u001B[25C\u001B[0;34m\u2551\r\u2560\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2563\r\u2551 \u001B[0mHP/Level: \u001B[0;1m4-8  \u001B[0mMagic: \u001B[0;1mKai  \u001B[0mCombat: \u001B[0;1mAverage  \u001B[0mWeapons: \u001B[0;1mStaff  \u001B[0mArmour: \u001B[0;1mRobes \u001B[0;34m\u2551\r\u2560\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2563\r\u2551 \u001B[0mAbilities: \u001B[0;1mMartial Arts, Dodge, Stealth, Enhanced Criticals, Kai Powers.  \u001B[0;34m\u2551\r\u255A\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u255D\r"

[[topic]]
key = "HL1T32"
body_key = "HL1B32"
words = "Missionary"
text = "\u001B[0m\r\u001B[40m\u001B[2J\u001B[0;34m\u2554\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2557\r\u2551 \u001B[0;1;33mMISSIONARIES\u001B[52C\u001B[0;1mEXP: \u001B[0m220% \u001B[0;34m\u2551\r\u2560\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2563\r\u2551 \u001B[0mMissionaries are almost a contradictory class -- they essentially are\u001B[5C\u001B[0;34m\u2551\r\u2551 \u001B[0mThieves with Priestly powers. This may seem an odd combination, but the   \u001B[0;34m\u2551\r\u2551 \u001B[0mneed is there -- Missionaries need some stealth when voyaging into\u001B[8C\u001B[0;34m\u2551\r\u2551 \u001B[0mheathen lands to convert others to their faith. They have good Priest\u001B[5C\u001B[0;34m\u2551\r\u2551 \u001B[0mmagic and knowledge, and also the trouble-solving thief skills. Overall,  \u001B[0;34m\u2551\r\u2551 \u001B[0mthey are more skulkers than fighters, but can fight well when the need    \u001B[0;34m\u2551\r\u2551 \u001B[0marises. Often they make good spies, as they already have good stealth\u001B[5C\u001B[0;34m\u2551\r\u2551 \u001B[0mand evasion skills. Missionaries will use any one-handed weapon, and can  \u001B[0;34m\u2551\r\u2551 \u001B[0mwear only leather armour.\u001B[49C\u001B[0;34m\u2551\r\u2560\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2563\r\u2551 \u001B[0mHP/Level: \u001B[0;1m4-7  \u001B[0mMagic: \u001B[0;1mPriest-2 \u001B[0mCombat: \u001B[0;1mFair  \u001B[0mWeapons: \u001B[0;1m1-H \u001B[0mArmour: \u001B[0;1mLeather \u001B[0;34m\u2551\r\u2560\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2563\r\u2551 \u001B[0mAbilities: \u001B[0;1mStealth, Traps, Lockpicking.\u001B[35C\u001B[0;34m\u2551\r\u255A\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u255D\r"

[[topic]]
key = "HL1T34"
body_key = "HL1B34"
words = "Humans"
text = "\r\u001B[40m\u001B[2J\u001B[0;34m\u2554\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2557\r\u2551 \u001B[0;1;33mHUMANS\u001B[59C\u001B[0;1mEXP: \u001B[0m+0%  \u001B[0;34m\u2551\r\u2560\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2563\r\u2551 \u001B[0mThe origins of humanity are shrouded in obscurity. This may seem a\u001B[9C\u001B[0;34m\u2551\r\u2551 \u001B[0mludicrous statement, but the fact is there -- humans just mysteriously\u001B[5C\u001B[0;34m\u2551\r\u2551 \u001B[0mappeared one day. Theories on this event are numerous. Some say the Elves  \u001B[0;34m\u2551\r\u2551 \u001B[0mfound humanity's ancestors roaming in the woods, and nurtured them over    \u001B[0;34m\u2551\r\u2551 \u001B[0mthe ages until they were mature enough to survive as a sentient species.   \u001B[0;34m\u2551\r\u2551 \u001B[0mAnother hypothesis is that humans are from a distant star, and that one    \u001B[0;34m\u2551\r\u2551 \u001B[0mday a great sky-craft collided with this land and created the barren\u001B[7C\u001B[0;34m\u2551\r\u2551 \u001B[0mwasteland to the east. Whatever the solution is, the Elves will not, or    \u001B[0;34m\u2551\r\u2551 \u001B[0mcannot say. In any case humans have flourished in the past four hundred    \u001B[0;34m\u2551\r\u2551 \u001B[0myears, and now their domain is such that they are the most numerous people \u001B[0;34m\u2551\r\u2560\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2557 \u001B[0min the realm. Human males average\u001B[5C\u001B[0;34m\u2551\r\u2551 \u001B[0;1mStatistics\u001B[9CAbilities\u001B[7C\u001B[0;34m\u2551 \u001B[0mjust under six feet tall, and females \u001B[0;34m\u2551\r\u2560\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2566\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2563 \u001B[0mabout five and a half. They have no   \u001B[0;34m\u2551\r\u2551 \u001B[0mStrength  \u001B[0;31m40\u001B[0m-\u001B[0;32m100 \u001B[0;34m\u2551 \u001B[0mNone.\u001B[11C\u001B[0;34m\u2551 \u001B[0mextra special abilities or aptitudes  \u001B[0;34m\u2551\r\u2551 \u001B[0mAgility   \u001B[0;31m40\u001B[0m-\u001B[0;32m100 \u001B[0;34m\u2551\u001B[17C\u2551 \u001B[0msave for their versatility and drive. \u001B[0;34m\u2551\r\u2551 \u001B[0mHealth    \u001B[0;31m40\u001B[0m-\u001B[0;32m100 \u001B[0;34m\u2551\u001B[17C\u2551 \u001B[0mThey do equally well in any class,    \u001B[0;34m\u2551\r\u2551 \u001B[0mIntellect \u001B[0;31m40\u001B[0m-\u001B[0;32m100 \u001B[0;34m\u2551\u001B[17C\u2551 \u001B[0mbut are nicely suited for the Ranger  \u001B[0;34m\u2551\r\u2551 \u001B[0mWillpower \u001B[0;31m40\u001B[0m-\u001B[0;32m100 \u001B[0;34m\u2551\u001B[17C\u2551 \u001B[0mand Druid classes, which require well \u001B[0;34m\u2551\r\u2551 \u001B[0mCharm\u001B[5C\u001B[0;31m40\u001B[0m-\u001B[0;32m100 \u001B[0;34m\u2551\u001B[17C\u2551 \u001B[0mdeveloped statistics all around.\u001B[6C\u001B[0;34m\u2551\r\u255A\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2569\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2569\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u255D\r"

