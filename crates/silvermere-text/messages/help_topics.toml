text = "\u001B[0m\r\u001B[40m\u001B[2J\u001B[0;34m\u2554\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2557\r\u2551 \u001B[0;1;33mDWARVES\u001B[58C\u001B[0;1mEXP: \u001B[0m+30% \u001B[0;34m\u2551\r\u2560\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2563\r\u2551 \u001B[0mDwarves are the second oldest race known today. The Elves, of course, are  \u001B[0;34m\u2551\r\u2551 \u001B[0mthe first. Dwarves average about four and a half feet in height, and tip   \u001B[0;34m\u2551\r\u2551 \u001B[0mthe scales at around two hundred pounds each. They are a solitary folk,    \u001B[0;34m\u2551\r\u2551 \u001B[0mand do not easily welcome strange people -- but do not mistake this for    \u001B[0;34m\u2551\r\u2551 \u001B[0mhostility. Once you have gained a Dwarf's friendship, that bond will last  \u001B[0;34m\u2551\r\u2551 \u001B[0mto the death (or betrayal). They are cautious and slow to anger, but once  \u001B[0;34m\u2551\r\u2551 \u001B[0mtheir wrath is roused they are terrible enemies. Dwarves love and craft    \u001B[0;34m\u2551\r\u2551 \u001B[0mprecious gems and metals of all sorts, and are great worksmiths. They\u001B[6C\u001B[0;34m\u2551\r\u2551 \u001B[0mmanufacture worthy and elaborate suits of mail, and craft gleaming axes    \u001B[0;34m\u2551\r\u2551 \u001B[0mwith blades of true-silver. These items seldom leave the underground homes \u001B[0;34m\u2551\r\u2560\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2557 \u001B[0mof the Dwarves, but there are stories \u001B[0;34m\u2551\r\u2551 \u001B[0;1mStatistics\u001B[9CAbilities\u001B[7C\u001B[0;34m\u2551 \u001B[0mof heroes who have done some great    \u001B[0;34m\u2551\r\u2560\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2566\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2563 \u001B[0mservice and have received such a\u001B[6C\u001B[0;34m\u2551\r\u2551 \u001B[0mStrength  \u001B[0;31m50\u001B[0m-\u001B[0;32m110 \u001B[0;34m\u2551 \u001B[0mNight Vision    \u001B[0;34m\u2551 \u001B[0mgift. Dwarves make excellent Clerics, \u001B[0;34m\u2551\r\u2551 \u001B[0mAgility   \u001B[0;31m30\u001B[0m-\u001B[0;32m90  \u001B[0;34m\u2551 \u001B[0mMagicRes+10\u001B[5C\u001B[0;34m\u2551 \u001B[0mPaladins and Warriors. Their stubborn \u001B[0;34m\u2551\r\u2551 \u001B[0mHealth    \u001B[0;31m50\u001B[0m-\u001B[0;32m120 \u001B[0;34m\u2551 \u001B[0mEncumbrance+20% \u001B[0;34m\u2551 \u001B[0mnature and strong willpower give them \u001B[0;34m\u2551\r\u2551 \u001B[0mIntellect \u001B[0;31m30\u001B[0m-\u001B[0;32m90  \u001B[0;34m\u2551\u001B[17C\u2551 \u001B[0mgood defense against magic. Overall,  \u001B[0;34m\u2551\r\u2551 \u001B[0mWillpower \u001B[0;31m50\u001B[0m-\u001B[0;32m120 \u001B[0;34m\u2551\u001B[17C\u2551 \u001B[0mDwarves are a resilient folk who\u001B[6C\u001B[0;34m\u2551\r\u2551 \u001B[0mCharm\u001B[5C\u001B[0;31m30\u001B[0m-\u001B[0;32m85  \u001B[0;34m\u2551\u001B[17C\u2551 \u001B[0mshould not lightly be trifled with.   \u001B[0;34m\u2551\r\u255A\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2569\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2569\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u255D\r"

[[topic]]
key = "HL1T36"
body_key = "HL1B36"
words = "Gnomes"
text = "\u001B[0m\r\u001B[40m\u001B[2J\u001B[0;34m\u2554\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2557\r\u2551 \u001B[0;1;33mGNOMES\u001B[59C\u001B[0;1mEXP: \u001B[0m+20% \u001B[0;34m\u2551\r\u2560\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2563\r\u2551 \u001B[0mGnomes are distant cousins of the Dwarves. They are about the same height  \u001B[0;34m\u2551\r\u2551 \u001B[0mas Dwarves, but are considerably slimmer. Long ago a tribe of Dwarves made \u001B[0;34m\u2551\r\u2551 \u001B[0mits home on the surface, far from the ancient homeland. Over the centuries \u001B[0;34m\u2551\r\u2551 \u001B[0mthis tribe changed, becoming less dependent on their muscles and more on   \u001B[0;34m\u2551\r\u2551 \u001B[0mtheir wits. As this progressed, the natural technological ability of the   \u001B[0;34m\u2551\r\u2551 \u001B[0mDwarves was changed into something more refined than metallurgy or mining: \u001B[0;34m\u2551\r\u2551 \u001B[0mmachinery. Where an Elf sees a waterfall and reflects on its natural\u001B[7C\u001B[0;34m\u2551\r\u2551 \u001B[0mbeauty, and a Dwarf sees only the precious stones being smoothed in its    \u001B[0;34m\u2551\r\u2551 \u001B[0mwaters, a Gnome plots water-wheels and dams. Gnomes are cunning and\u001B[8C\u001B[0;34m\u2551\r\u2551 \u001B[0minventive, always thinking up new plots and trying to devise more and more \u001B[0;34m\u2551\r\u2560\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2557 \u001B[0mefficient ways to do things. They\u001B[5C\u001B[0;34m\u2551\r\u2551 \u001B[0;1mStatistics\u001B[9CAbilities\u001B[7C\u001B[0;34m\u2551 \u001B[0mmake proficient Mages and Thieves,    \u001B[0;34m\u2551\r\u2560\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2566\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2563 \u001B[0mbecause they have natural cunning and \u001B[0;34m\u2551\r\u2551 \u001B[0mStrength  \u001B[0;31m35\u001B[0m-\u001B[0;32m90  \u001B[0;34m\u2551 \u001B[0mNight Vision    \u001B[0;34m\u2551 \u001B[0mcuriosity. Gnomes can see well in the \u001B[0;34m\u2551\r\u2551 \u001B[0mAgility   \u001B[0;31m45\u001B[0m-\u001B[0;32m110 \u001B[0;34m\u2551 \u001B[0mMagicRes+5      \u001B[0;34m\u2551 \u001B[0mdark due to their Dwarven ancestry,   \u001B[0;34m\u2551\r\u2551 \u001B[0mHealth    \u001B[0;31m40\u001B[0m-\u001B[0;32m100 \u001B[0;34m\u2551 \u001B[0mPicklocks(+10)  \u001B[0;34m\u2551 \u001B[0mas well as having an inborn facility  \u001B[0;34m\u2551\r\u2551 \u001B[0mIntellect \u001B[0;31m45\u001B[0m-\u001B[0;32m110 \u001B[0;34m\u2551\u001B[17C\u2551 \u001B[0mwith locks and a slightly increased   \u001B[0;34m\u2551\r\u2551 \u001B[0mWillpower \u001B[0;31m40\u001B[0m-\u001B[0;32m100 \u001B[0;34m\u2551\u001B[17C\u2551 \u001B[0mresistance to hostile magics.\u001B[9C\u001B[0;34m\u2551\r\u2551 \u001B[0mCharm\u001B[5C\u001B[0;31m35\u001B[0m-\u001B[0;32m90  \u001B[0;34m\u2551\u001B[17C\u2551\u001B[39C\u2551\r\u255A\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2569\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2569\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u255D\r"

[[topic]]
key = "HL1T37"
body_key = "HL1B37"
words = "Halflings haflings"
text = "\r\u001B[40m\u001B[2J\u001B[0;34m\u2554\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2557\r\u2551 \u001B[0;1;33mHALFLINGS\u001B[56C\u001B[0;1mEXP: \u001B[0m+25% \u001B[0;34m\u2551\r\u2560\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2563\r\u2551 \u001B[0mLittle is known about this shy, reclusive folk. Physically, they average   \u001B[0;34m\u2551\r\u2551 \u001B[0maround three feet high, about half the height of a human (hence the name)  \u001B[0;34m\u2551\r\u2551 \u001B[0mand are therefore quite weak. They are surprisingly tough and incredibly   \u001B[0;34m\u2551\r\u2551 \u001B[0magile -- halfling quickness is deceptive, and some adventurers get more    \u001B[0;34m\u2551\r\u2551 \u001B[0mthan they bargain for when they tangle with a Halfling. They are fond of   \u001B[0;34m\u2551\r\u2551 \u001B[0mgood company and good drink, and are very soft-hearted overall. But when a \u001B[0;34m\u2551\r\u2551 \u001B[0mHalfling is cornered, or his home (or food and drink!) is threatened, they \u001B[0;34m\u2551\r\u2551 \u001B[0mwill fight with a ferocity that would startle any but the most seasoned of \u001B[0;34m\u2551\r\u2560\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2557 \u001B[0madventurers. Halflings do not take    \u001B[0;34m\u2551\r\u2551 \u001B[0;1mStatistics\u001B[9CAbilities\u001B[7C\u001B[0;34m\u2551 \u001B[0mtoo well to magic, and seldom is a    \u001B[0;34m\u2551\r\u2560\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2566\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2563 \u001B[0mHalfling seen who can demonstrate\u001B[5C\u001B[0;34m\u2551\r\u2551 \u001B[0mStrength  \u001B[0;31m20\u001B[0m-\u001B[0;32m60  \u001B[0;34m\u2551 \u001B[0mRacial Stealth  \u001B[0;34m\u2551 \u001B[0mmagical powers of any sort. Show a    \u001B[0;34m\u2551\r\u2551 \u001B[0mAgility   \u001B[0;31m60\u001B[0m-\u001B[0;32m150 \u001B[0;34m\u2551 \u001B[0mDodge+10\u001B[8C\u001B[0;34m\u2551 \u001B[0mHalfling a good beer, a comfortable   \u001B[0;34m\u2551\r\u2551 \u001B[0mHealth    \u001B[0;31m40\u001B[0m-\u001B[0;32m100 \u001B[0;34m\u2551 \u001B[0mHP/Level-1\u001B[6C\u001B[0;34m\u2551 \u001B[0mseat, and pleasant company, and you   \u001B[0;34m\u2551\r\u2551 \u001B[0mIntellect \u001B[0;31m30\u001B[0m-\u001B[0;32m90  \u001B[0;34m\u2551\u001B[17C\u2551 \u001B[0mwill have a friend for life! They\u001B[5C\u001B[0;34m\u2551\r\u2551 \u001B[0mWillpower \u001B[0;31m40\u001B[0m-\u001B[0;32m100 \u001B[0;34m\u2551\u001B[17C\u2551 \u001B[0mmake incredible Thieves, due to their \u001B[0;34m\u2551\r\u2551 \u001B[0mCharm\u001B[5C\u001B[0;31m40\u001B[0m-\u001B[0;32m100 \u001B[0;34m\u2551\u001B[17C\u2551 \u001B[0minnate agility and stealth.\u001B[11C\u001B[0;34m\u2551\r\u255A\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2569\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2569\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u255D\r"

