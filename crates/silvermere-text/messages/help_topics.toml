text = "\u001B[0m\r\u001B[40m\u001B[2J\u001B[0;34m\u2554\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2557\r\u2551 \u001B[1;33mELVES\u001B[60C\u001B[37mEXP: \u001B[0m+45% \u001B[34m\u2551\r\u2560\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2563\r\u2551 \u001B[37mElves are the Elder race. They are as old as the trees and the rivers they \u001B[34m\u2551\r\u2551 \u001B[37mlove so dearly. Ever since time has been recorded, the Elves have been\u001B[5C\u001B[34m\u2551\r\u2551 \u001B[37mthere, singing and tending to the forest animals. Nowadays the Elves are   \u001B[34m\u2551\r\u2551 \u001B[37mfew in number, their folk slowly dwindling as the groves they live in are  \u001B[34m\u2551\r\u2551 \u001B[37mhewn down. They do not begrudge this, though, but see it as the passing of \u001B[34m\u2551\r\u2551 \u001B[37man age, the time of Humans. The Elves seen in cities are the very young,   \u001B[34m\u2551\r\u2551 \u001B[37mhigh-spirited and short on experience. They seem almost like children --   \u001B[34m\u2551\r\u2551 \u001B[37mexcitable and inquisitive, even though some of them may be older than\u001B[6C\u001B[34m\u2551\r\u2551 \u001B[37mentire human lineages. Physically, Elves are quite tall, the same height   \u001B[34m\u2551\r\u2551 \u001B[37mas humans, but seem much taller due to their slimness. They are extremely  \u001B[34m\u2551\r\u2560\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2557 \u001B[37mmagical creatures, and many are\u001B[7C\u001B[34m\u2551\r\u2551 \u001B[1;37mStatistics\u001B[9CAbilities\u001B[7C\u001B[0;34m\u2551 \u001B[37mpacifistic -- unless there is some    \u001B[34m\u2551\r\u2560\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2566\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2563 \u001B[37mcause for action. In that case, they  \u001B[34m\u2551\r\u2551 \u001B[37mStrength  \u001B[31m35\u001B[37m-\u001B[32m90  \u001B[34m\u2551 \u001B[37mRacial Stealth  \u001B[34m\u2551 \u001B[37mmake savage fighters, both with spell \u001B[34m\u2551\r\u2551 \u001B[37mAgility   \u001B[31m50\u001B[37m-\u001B[32m120 \u001B[34m\u2551 \u001B[37mNight Vision    \u001B[34m\u2551 \u001B[37mand sword. Elves make great Mages,    \u001B[34m\u2551\r\u2551 \u001B[37mHealth    \u001B[31m30\u001B[37m-\u001B[32m80  \u001B[34m\u2551 \u001B[37mMana+10\u001B[9C\u001B[34m\u2551 \u001B[37mWarlocks and Gypsies, due to their    \u001B[34m\u2551\r\u2551 \u001B[37mIntellect \u001B[31m50\u001B[37m-\u001B[32m120 \u001B[34m\u2551\u001B[17C\u2551 \u001B[37mquick wits and grace. They can see    \u001B[34m\u2551\r\u2551 \u001B[37mWillpower \u001B[31m40\u001B[37m-\u001B[32m100 \u001B[34m\u2551\u001B[17C\u2551 \u001B[37mwell in the dark, and have increased  \u001B[34m\u2551\r\u2551 \u001B[37mCharm\u001B[5C\u001B[31m50\u001B[37m-\u001B[32m120 \u001B[34m\u2551\u001B[17C\u2551 \u001B[37mpower in spellcasting professions.    \u001B[34m\u2551\r\u255A\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2569\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2569\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u255D\r"

