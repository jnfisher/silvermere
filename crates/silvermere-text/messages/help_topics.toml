words = "Half-Orcs halforcs half orcs"
text = "\u001B[0m\r\u001B[40m\u001B[2J\u001B[0;34m\u2554\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2557\r\u2551 \u001B[0;1;33mHALF-ORCS\u001B[56C\u001B[0;1mEXP: \u001B[0m+0%  \u001B[0;34m\u2551\r\u2560\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2563\r\u2551 \u001B[0mHalf-Orcs are almost exclusively the result of an Orc raid on a Human\u001B[6C\u001B[0;34m\u2551\r\u2551 \u001B[0mvillage. They are not terrible-looking, having only the squinty eyes,\u001B[6C\u001B[0;34m\u2551\r\u2551 \u001B[0mpronounced canines and coarse hair of an orc, but the innate Orcish poor   \u001B[0;34m\u2551\r\u2551 \u001B[0mtemper is passed on to these offspring. They are much better behaved than  \u001B[0;34m\u2551\r\u2551 \u001B[0mOrcs, and do not have the homicidal hatred for the other races that Orcs   \u001B[0;34m\u2551\r\u2551 \u001B[0mdo (unless they have been raised by Orcs, and then you will see them only  \u001B[0;34m\u2551\r\u2551 \u001B[0mas your foes). They are somewhat dull-witted, and are not terribly patient \u001B[0;34m\u2551\r\u2551 \u001B[0mbut they are tough as nails and are relentless in battle. Having a\u001B[9C\u001B[0;34m\u2551\r\u2551 \u001B[0mtrustworthy Half-Orc companion is like having your own personal army. They \u001B[0;34m\u2551\r\u2551 \u001B[0mexcel in all things martial, especially in the Witchunter class, where\u001B[5C\u001B[0;34m\u2551\r\u2560\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2557 \u001B[0mtheir instinctive fear of magic can   \u001B[0;34m\u2551\r\u2551 \u001B[0;1mStatistics\u001B[9CAbilities\u001B[7C\u001B[0;34m\u2551 \u001B[0mbe used to advantage. Half-Orcs are   \u001B[0;34m\u2551\r\u2560\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2566\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2563 \u001B[0malmost universally mistrusted, which  \u001B[0;34m\u2551\r\u2551 \u001B[0mStrength  \u001B[0;31m45\u001B[0m-\u001B[0;32m110 \u001B[0;34m\u2551 \u001B[0mNone.\u001B[11C\u001B[0;34m\u2551 \u001B[0mis quite unfortunate since they are   \u001B[0;34m\u2551\r\u2551 \u001B[0mAgility   \u001B[0;31m40\u001B[0m-\u001B[0;32m100 \u001B[0;34m\u2551\u001B[17C\u2551 \u001B[0mnot horrible by nature, and so must   \u001B[0;34m\u2551\r\u2551 \u001B[0mHealth    \u001B[0;31m50\u001B[0m-\u001B[0;32m120 \u001B[0;34m\u2551\u001B[17C\u2551 \u001B[0mcontinually prove their worth. Many   \u001B[0;34m\u2551\r\u2551 \u001B[0mIntellect \u001B[0;31m30\u001B[0m-\u001B[0;32m90  \u001B[0;34m\u2551\u001B[17C\u2551 \u001B[0mHalf-Orcs seek mercenary service,\u001B[5C\u001B[0;34m\u2551\r\u2551 \u001B[0mWillpower \u001B[0;31m30\u001B[0m-\u001B[0;32m95  \u001B[0;34m\u2551\u001B[17C\u2551 \u001B[0mwhere no questions are asked and\u001B[6C\u001B[0;34m\u2551\r\u2551 \u001B[0mCharm\u001B[5C\u001B[0;31m30\u001B[0m-\u001B[0;32m80  \u001B[0;34m\u2551\u001B[17C\u2551 \u001B[0mwhere their strength is in demand.    \u001B[0;34m\u2551\r\u255A\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2569\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2569\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u255D\r"

[[topic]]
key = "HL1T42"
body_key = "HL1B42"
words = "Goblins"
text = "\u001B[0m\r\u001B[40m\u001B[2J\u001B[0;34m\u2554\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2557\r\u2551 \u001B[0;1;33mGOBLINS\u001B[58C\u001B[0;1mEXP: \u001B[0m+35% \u001B[0;34m\u2551\r\u2560\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2563\r\u2551 \u001B[0mGoblins have a decidedly mixed reputation. First off, they average about   \u001B[0;34m\u2551\r\u2551 \u001B[0mfive feet tall, have pale green or grey skin, and save for the fine,\u001B[7C\u001B[0;34m\u2551\r\u2551 \u001B[0mluxuriant hair on their heads they have little or no body hair. They are   \u001B[0;34m\u2551\r\u2551 \u001B[0malmost always smiling, in that white, sharp-toothed grin of theirs, and    \u001B[0;34m\u2551\r\u2551 \u001B[0mmore often than not you cannot tell whether or not they are eyeing you\u001B[5C\u001B[0;34m\u2551\r\u2551 \u001B[0mlike a side of meat. Despite their unsettling near-savagery they have a    \u001B[0;34m\u2551\r\u2551 \u001B[0mdisarming charm which almost offsets their strange appearance. Almost.\u001B[5C\u001B[0;34m\u2551\r\u2551 \u001B[0mGoblins are thin and wiry, small and compact but very tough for their\u001B[6C\u001B[0;34m\u2551\r\u2551 \u001B[0msize. They are extremely intelligent, and are exceedingly agile -- they    \u001B[0;34m\u2551\r\u2551 \u001B[0mare well-suited for any Mage or Thief class, though are in their element   \u001B[0;34m\u2551\r\u2560\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2557 \u001B[0min the Gypsy class. Goblins are fond  \u001B[0;34m\u2551\r\u2551 \u001B[0;1mStatistics\u001B[9CAbilities\u001B[7C\u001B[0;34m\u2551 \u001B[0mof bartering, and will sit for hours  \u001B[0;34m\u2551\r\u2560\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2566\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2563 \u001B[0mto haggle down the price of a loaf of \u001B[0;34m\u2551\r\u2551 \u001B[0mStrength  \u001B[0;31m30\u001B[0m-\u001B[0;32m70  \u001B[0;34m\u2551 \u001B[0mRacial Stealth  \u001B[0;34m\u2551 \u001B[0mbread by one copper coin. Many\u001B[8C\u001B[0;34m\u2551\r\u2551 \u001B[0mAgility   \u001B[0;31m55\u001B[0m-\u001B[0;32m125 \u001B[0;34m\u2551 \u001B[0mNight Vision    \u001B[0;34m\u2551 \u001B[0mwealthy merchants hire a Goblin to    \u001B[0;34m\u2551\r\u2551 \u001B[0mHealth    \u001B[0;31m40\u001B[0m-\u001B[0;32m100 \u001B[0;34m\u2551\u001B[17C\u2551 \u001B[0mdeal with others of his kind, and the \u001B[0;34m\u2551\r\u2551 \u001B[0mIntellect \u001B[0;31m45\u001B[0m-\u001B[0;32m115 \u001B[0;34m\u2551\u001B[17C\u2551 \u001B[0msight of two goblins in a haggling    \u001B[0;34m\u2551\r\u2551 \u001B[0mWillpower \u001B[0;31m40\u001B[0m-\u001B[0;32m100 \u001B[0;34m\u2551\u001B[17C\u2551 \u001B[0mcontest is a sight to see! They are   \u001B[0;34m\u2551\r\u2551 \u001B[0mCharm\u001B[5C\u001B[0;31m40\u001B[0m-\u001B[0;32m100 \u001B[0;34m\u2551\u001B[17C\u2551 \u001B[0mstealthy, and have night vision.\u001B[6C\u001B[0;34m\u2551\r\u255A\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2569\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2569\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u255D\r"

[[topic]]
key = "HL1T43"
body_key = "HL1B43"
words = "Half-Ogres halfogres half ogre"
text = "\u001B[0m\r\u001B[40m\u001B[2J\u001B[0;34m\u2554\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2557\r\u2551 \u001B[0;1;33mHALF-OGRES\u001B[55C\u001B[0;1mEXP: \u001B[0m+30% \u001B[0;34m\u2551\r\u2560\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2563\r\u2551 \u001B[0mHalf-Ogres are the offspring of an Orc and an Ogre. No-one really knows,   \u001B[0;34m\u2551\r\u2551 \u001B[0mor wants to know how this comes about. They are about seven feet tall,\u001B[5C\u001B[0;34m\u2551\r\u2551 \u001B[0mand are quite hairless. Their bodies are nearly all muscle, and their\u001B[6C\u001B[0;34m\u2551\r\u2551 \u001B[0mstrength is unmatched for creatures their size. Unfortunately, they have   \u001B[0;34m\u2551\r\u2551 \u001B[0mall the cunning and tact of a six-year-old-human, and the coordination of  \u001B[0;34m\u2551\r\u2551 \u001B[0ma drunk. Half-Ogres have a rash temper, but are easily distracted, and so  \u001B[0;34m\u2551\r\u2551 \u001B[0mif you are careful it is possible to avoid conflict with one. Many store-  \u001B[0;34m\u2551\r\u2551 \u001B[0mowners have Half-Ogre workers, for they can work tirelessly and can lift   \u001B[0;34m\u2551\r\u2551 \u001B[0mhundred-pound barrels with ease. They have neither the near-berserk fury   \u001B[0;34m\u2551\r\u2551 \u001B[0mof Ogres, nor the animal intelligence of Orcs, but have a simple kind of   \u001B[0;34m\u2551\r\u2560\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2557 \u001B[0mpersonality which is almost pitiable. \u001B[0;34m\u2551\r\u2551 \u001B[0;1mStatistics\u001B[9CAbilities\u001B[7C\u001B[0;34m\u2551 \u001B[0mThey are not truly evil, but are\u001B[6C\u001B[0;34m\u2551\r\u2560\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2566\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2563 \u001B[0mfrequently exploited due to their\u001B[5C\u001B[0;34m\u2551\r\u2551 \u001B[0mStrength  \u001B[0;31m70\u001B[0m-\u001B[0;32m150 \u001B[0;34m\u2551 \u001B[0mToughness+2\u001B[5C\u001B[0;34m\u2551 \u001B[0mstupidity. Half-Ogres are almost\u001B[6C\u001B[0;34m\u2551\r\u2551 \u001B[0mAgility   \u001B[0;31m20\u001B[0m-\u001B[0;32m60  \u001B[0;34m\u2551 \u001B[0mHP/Level+1\u001B[6C\u001B[0;34m\u2551 \u001B[0mexclusively Warriors. Due to their    \u001B[0;34m\u2551\r\u2551 \u001B[0mHealth    \u001B[0;31m60\u001B[0m-\u001B[0;32m150 \u001B[0;34m\u2551 \u001B[0mMagicRes+15\u001B[5C\u001B[0;34m\u2551 \u001B[0mlack of focus, they cannot learn Kai  \u001B[0;34m\u2551\r\u2551 \u001B[0mIntellect \u001B[0;31m20\u001B[0m-\u001B[0;32m60  \u001B[0;34m\u2551 \u001B[0mNo Kai Forms    \u001B[0;34m\u2551 \u001B[0mskills, but can learn powers. All     \u001B[0;34m\u2551\r\u2551 \u001B[0mWillpower \u001B[0;31m25\u001B[0m-\u001B[0;32m70  \u001B[0;34m\u2551\u001B[17C\u2551 \u001B[0mare quite resistant to hostile magic. \u001B[0;34m\u2551\r\u2551 \u001B[0mCharm\u001B[5C\u001B[0;31m25\u001B[0m-\u001B[0;32m60  \u001B[0;34m\u2551\u001B[17C\u2551 \u001B[0mA powerful, but extremely slow race.  \u001B[0;34m\u2551\r\u255A\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2569\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2569\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u255D\r"

