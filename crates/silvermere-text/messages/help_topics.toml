[[topic]]
key = "HL1T17"
body_key = "HL1B17"
words = "Ninjas"
text = "\r\u001B[40m\u001B[2J\u001B[0;34m\u2554\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2557\r\u2551 \u001B[0;1;33mNINJAS\u001B[58C\u001B[0;1mEXP: \u001B[0m185% \u001B[0;34m\u2551\r\u2560\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2563\r\u2551 \u001B[0mThe origins of the ninja are basically unknown, save for the fact that    \u001B[0;34m\u2551\r\u2551 \u001B[0mthey come from a distant and exotic land. They seem to have an animosity  \u001B[0;34m\u2551\r\u2551 \u001B[0magainst mystics, so they probably originate from the same area. Ninjas    \u001B[0;34m\u2551\r\u2551 \u001B[0mexcel in the art of stealth and subterfuge. While they can fight fairly   \u001B[0;34m\u2551\r\u2551 \u001B[0mwell in hand to hand combat, they prefer to immobilize their opponent\u001B[5C\u001B[0;34m\u2551\r\u2551 \u001B[0mbefore he would have time to react. After a deadly attack from the\u001B[8C\u001B[0;34m\u2551\r\u2551 \u001B[0mshadows, they will usually finish off their victim with their mastery of  \u001B[0;34m\u2551\r\u2551 \u001B[0mpressure point attacks. The ninjas of Silvermere have been rumoured to be \u001B[0;34m\u2551\r\u2551 \u001B[0min league with the thieves guild, and are usually hired by them to do the \u001B[0;34m\u2551\r\u2551 \u001B[0mbulk of their dirty work.\u001B[49C\u001B[0;34m\u2551\r\u2560\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2563\r\u2551 \u001B[0mHP/Level: \u001B[0;1m4-8  \u001B[0mMagic: \u001B[0;1mNone  \u001B[0mCombat: \u001B[0;1mAverage   \u001B[0mWeapons: \u001B[0;1mAny  \u001B[0mArmour: \u001B[0;1mNinja \u001B[0;34m\u2551\r\u2560\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2563\r\u2551 \u001B[0mAbilities: \u001B[0;1mStealth, Dodge, Enhanced Crits, Traps, Lockpicking, Tracking.  \u001B[0;34m\u2551\r\u255A\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u255D\r"

[[topic]]
key = "HL1T18"
body_key = "HL1B18"
words = "Stats1 stats 1 stat1 statname"
text = "\u001B[0m\u001B[2J\r\u001B[0;1;33mPrimary Statistics\r\r\u001B[0mEvery character has six basic attributes, which govern the strengths and\rweaknesses of each particular character. The six stats are Strength, Agility,\rHealth, Intellect, Willpower and Charm. Each race starts out with a \u001B[0;1mbase \u001B[0mvalue\rand a \u001B[0;1mmaximum \u001B[0mvalue in each of the six stats. A character cannot have a stat\rlower than the Base value, and cannot increase a stat beyond the Maximum value.\rFor example, Elves are slim but graceful, and for \u001B[0;1mAgility \u001B[0mhave a base value of\r\u001B[0;31m50 \u001B[0mand a maximum value of \u001B[0;32m120\u001B[0m. In the \u001B[0;1;33mhelp \u001B[0mfiles, the base value in each stat\ris coloured \u001B[0;31mred\u001B[0m, and the maximum is coloured \u001B[0;32mgreen\u001B[0m. \u001B[0;1mHumans \u001B[0mform the \"benchmark\"\rfor all other races, and have a base value of \u001B[0;31m40 \u001B[0mand a maximum value of \u001B[0;32m100 \u001B[0min\revery stat. A value of \u001B[0;1m50 \u001B[0mindicates an average value, giving no bonuses or\rpenalties, while values above and below 50 give penalties or bonuses as\rapplicable.\r\rStats can be changed by spending \u001B[0;1mCP \u001B[0m(character points) in character creation or\rafter Training. Since every character receives CP after increasing in level, it\ris generally a wise idea to use these gained CP in a \u001B[0;1mTraining Hall\u001B[0m, by typing\r'\u001B[0;1;33mTRAIN STATS\u001B[0m'. This will place you in the character editor (ANSI\rrecommended).\r\rType '\u001B[0;1;33mHELP STATS2\u001B[0m' for more information on allocating your stats and how to\ruse the character editor. There is also a seperate help topic for each stat,\rwhich will give information on what the stat does and what parts of the\rcharacter it affects. For example, you would type '\u001B[0;1;33mHELP STRENGTH\u001B[0m' to get info\ron Strength.\r\u001B[0m\u001B[255D\r\r"

[[topic]]
key = "HL1T18A"
body_key = "HL1B18A"
words = "Stats2 stats 2 stat2"
text = "\u001B[0m\u001B[2J\r\u001B[0;1;33mPrimary Statistics, continued\r\r\u001B[0mThe cost to increase stats is as follows:\r\rThe first 1 to 10 points above your race's base stat:  1 CP each.\rThe second 1 to 10 points above your race's base stat: 2 CP each.\rThe third 1 to 10 points above your race's base stat:  3 CP each.\r\r... and so on. This means that to increase a stat \u001B[0;1m40 \u001B[0mpoints above its base\rlevel, say, \u001B[0;1mAgility 40 \u001B[0mto \u001B[0;1mAgility 80 \u001B[0m(a BIG leap!), you would have to spend\r10 CP's for the first 10 Agil, 20 CP's for the second 10 Agil, 30 CP's for the\rthird 10 Agil, and 40 CP's for the fourth set of 10 Agility. This adds up to\ra grand total of 10 CP + 20 CP + 30 CP + 40 CP = \u001B[0;1m100 CP\u001B[0m! Very expensive, as\ryou can see, and not very wise: even though your character would be incredibly\ragile, he would be weak, fragile, stupid, etc... and that makes a big\rdifference. Having a one-dimensional character may be fun for a while, but\ryour character probably would not last very long. In the end a more balanced\rcharacter would be more enjoyable and would survive longer.\r\rNote that 'high' or 'low' stats are stats above or below 50, respectively.\rEach stat has a different use. Type \u001B[0;1;33mHELP STATNAME \u001B[0mfor details on a particular\rstat and its effects on your character and his abilities.\r\r\u001B[0m\u001B[255D\r\r"

[[topic]]
key = "HL1T18B"
body_key = "HL1B18B"
words = "Strength"
text = "\u001B[0m\r\u001B[1;33mSTRENGTH (STR)\r\r\u001B[0mStrength is a measure not just of your raw muscle mass, but also how well you\rcan use that strength. Good Strength adds to how easily you attack something in \rcombat, as well as the damage you do when you hit. Some weapons need a high \rStrength to use effectively. Conversely, low strength reduces how well you hit\rsomething, and the damage you do. A Halfling warrior may be extremely quick, \rbut he will do fairly poor damage when compared to a Dwarf! Strength also \rgoverns how much weight you can carry without being encumbered. Strength\ris a necessary stat for any fighting class, but is useful for magic-using\rclasses as well, because no-one has an unlimited supply of magic! It is used\rwhen bashing down doors and in some instances for moving heavy objects.\r"

[[topic]]
key = "HL1T18C"
body_key = "HL1B18C"
words = "Agility dexterity"
text = "\u001B[0m\r\u001B[1;33mAGILITY (AGI)\r\r\u001B[0mAgility is basically how quick and accurate you are in your movements. It\rinvolves not only speed, but total body coordination as well. A character with\rhigh Agility attacks faster and more accurately, and a high Agility helps\rdefend against physical attacks. Low Agility, of course, makes you slower and\rless accurate. An Elf will hit far more often than a Half-Ogre, though a\rHalf-Ogre's incredible crushing blows may compensate. Agility is a component\rof most skills, and is extremely useful for a thief. A thief with high agility\rwill have very good skills! Again, Agility is a necessary stat for any\rfighting class.\r\rAgility is important for the following character skills: \u001B[1mStealth\u001B[0m, \u001B[1mThievery\u001B[0m,\r\u001B[1mTraps \u001B[0mand \u001B[1mPicklocks\u001B[0m. It contributes heavily to your \u001B[1mAccuracy \u001B[0mand \u001B[1mCritical Hit\rChance \u001B[0mas well. Characters with above-average Agility will gain a small \u001B[1mDodge\r\u001B[0mchance, while characters with low Agility will suffer from reduced defense.     "

[[topic]]
key = "HL1T18D"
body_key = "HL1B18D"
words = "Intellect intelligence perception"
text = "\u001B[0m\r\u001B[1;33mINTELLECT (INT)\r\r\u001B[0mIntellect is a combination of raw intelligence, creativity, reasoning and\rbasic awareness. Intellect is useful for all classes in respect to their\rPerception, which is a skill that helps notice hidden and concealed items\r(and people!). A character with a low Intellect may not notice things very\roften, such as people sneaking around, robbing them, etc. Intellect is a main\rcomponent in many skills, and is useful to a thief, but it is vital to a mage!\rMages use Intellect as the main stat for their spells. A Mage with low\rIntellect will be at a severe disadvantage with spells when compared to a mage\rwith higher Intellect. Druids use both Intellect and Wisdom for their spells,\rso they need to have good levels in both stats. Warrior-types can usually get\ralong without much Intellect, and historically many have done so -- but\rIntellect is also a component of Critical Hits, so a canny fighter will do\rheavy blows more often than a dull-witted opponent.\r\rIntellect directly affects the following skills and abilities: \u001B[1mStealth\u001B[0m,\r\u001B[1mThievery\u001B[0m, \u001B[1mTraps\u001B[0m, \u001B[1mPicklocks\u001B[0m, \u001B[1mTracking\u001B[0m, \u001B[1mPerception\u001B[0m, \u001B[1mMagic Resistance\u001B[0m,\r\u001B[1mSpellcasting\u001B[0m, and \u001B[1mCritical Hit Chance\u001B[0m.                                          "

[[topic]]
key = "HL1T18E"
body_key = "HL1B18E"
words = "Willpower wisdom"
text = "\u001B[0m\r\u001B[1;33mWILLPOWER (WIL)\r\r\u001B[0mThis stat is a measure of the character's cool-headedness, determination,\rmental focus and strength of faith. It is a must for any Priestly character,\ras this is the stat they use for their spell-casting. Druids use both\rWillpower and Intellect, so they need to have good levels in both stats.\rWillpower is the prime component in Magic Resistance, so anyone needing to\rresist spells had better have a good value in this stat. A Witchunter with\rhigh WIL would have a formidable MagicRes! As for Intellect, a Warrior-type\rcould probably get along with a low Wisdom, but would then be much more\rvulnerable to magic spells.\r\rWillpower directly affects the following skills and abilities: \u001B[1mSpellcasting\u001B[0m,\r\u001B[1mTracking\u001B[0m, \u001B[1mPerception \u001B[0mand \u001B[1mMagic Resistance\u001B[0m.                                      "

[[topic]]
key = "HL1T18F"
body_key = "HL1B18F"
words = "Health constitution"
text = "\u001B[0m\r\u001B[0;1;33mHEALTH (HEA)\r\r\u001B[0mHealth is a character's vitality, toughness, and general physical well-being.\rHealth governs how many Hit Points a character starts with, as well as how\rmany are gained each time a new Level is reached. Poison is less effective on\ra healthier person, and Health is a component in Magic Resistance. Where\rWillpower is the toughness of the mind, Health is the toughness of the body.\rHealth is a prime stat for any fighting classes, but is very useful for all\rcharacters, as everyone will sustain damage at some point in their perilous\rcareers.\r\rHaving a high Health increases the rate at which you naturally heal, and the\rrate at which you gain HP through resting. It may also confer an increased\rresistance to some poisons and diseases. Characters with above- or below-\raverage Health will notice a change in their Hit Points, which will vary\rdepending on your Level and your Health. Health no longer has \"stat breaks\"\rwhere you must have a certain level of Health to obtain the increases (in the\rpast, you needed to have 65, 80 or 95 Health for the bonuses), and now works as\ra gradual process that increases your HP as both your Health and Level increase.\rTherefore, it is possible that even a one-point increase in Health could \rincrease your total HP.\r\r"

[[topic]]
key = "HL1T18G"
body_key = "HL1B18G"
words = "Charm"
text = "\u001B[0m\r\u001B[1;33mCHARM (CHA)\r\r\u001B[0mCharm is a hard stat to pin down -- it is not an actual measure of a person's\rgood looks, but people with high charm are quite attractive to others. It\rhelps with interpersonal relations, such as buying items from store-owners,\ras a charming person can lower the price of an item substantially. Charm helps\rin combat, because people are more likely to attack an offensive person than\rsomeone with a disarming smile. Charm is a component in some skills, as Charm\ris not only a measure of a character's charm, but a person with good Charm\rleads a Charmed life, so to speak, and in general is much luckier than other\rcharacters. Such a one would find himself miraculously dodging out of the way\rof some attacks, where others would have been hit. Charm is the main stat for\ruse in Bard spells, and a Bard with low Charm will be a very poor Bard indeed.\rAll characters can use a good dose of Charm.\r\rCharm directly affects the following skills and abilities: \u001B[1mStealth\u001B[0m, \u001B[1mTraps\u001B[0m,\r\u001B[1mTracking\u001B[0m, \u001B[1mCritical Hit Chance \u001B[0mand \u001B[1mPerception\u001B[0m.                                   "

[[topic]]
key = "HL1T19"
body_key = "HL1B19"
words = "Thief theif thieves theives"
text = "\u001B[0m\r\u001B[40m\u001B[2J\u001B[0;34m\u2554\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2557\r\u2551 \u001B[0;1;33mTHIEVES\u001B[58C\u001B[0;1mEXP: \u001B[0m80% \u001B[0;34m\u2551\r\u2560\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2563\r\u2551 \u001B[0mThe Thief class is fairly self-explanatory. Thieves steal, for different  \u001B[0;34m\u2551\r\u2551 \u001B[0mreasons, and are very good at it. Not all thieves rob for personal gain:  \u001B[0;34m\u2551\r\u2551 \u001B[0mmany are vigilantes, robbing sleazy nobles to help the poor. Others\u001B[7C\u001B[0;34m\u2551\r\u2551 \u001B[0mrarely use their thieving skills and are basically scouts, creeping ahead \u001B[0;34m\u2551\r\u2551 \u001B[0mto survey enemies. Of course most thieves rob for their own benefit, and  \u001B[0;34m\u2551\r\u2551 \u001B[0mthus it is usually good to keep an eye on all Thieves in your party, even \u001B[0;34m\u2551\r\u2551 \u001B[0mif they have given their word they will not rob you. Thieves have a\u001B[7C\u001B[0;34m\u2551\r\u2551 \u001B[0mnumber of useful abilites, including Thievery, Stealth, Lockpicking,\u001B[6C\u001B[0;34m\u2551\r\u2551 \u001B[0mand Traps. They can use any one-handed weapon, and will wear no armour    \u001B[0;34m\u2551\r\u2551 \u001B[0mgreater than leather due to their need for stealth. Thieves can\u001B[11C\u001B[0;34m\u2551\r\u2551 \u001B[0malso Backstab from the shadows when they are hidden, as can any class\u001B[5C\u001B[0;34m\u2551\r\u2551 \u001B[0mwith Stealth.\u001B[61C\u001B[0;34m\u2551\r\u2560\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2563\r\u2551 \u001B[0mHP/Level: \u001B[0;1m4-7  \u001B[0mMagic: \u001B[0;1mNone   \u001B[0mCombat: \u001B[0;1mFair   \u001B[0mWeapons: \u001B[0;1m1-H  \u001B[0mArmour: \u001B[0;1mLeather \u001B[0;34m\u2551\r\u2560\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2563\r\u2551 \u001B[0mAbilities: \u001B[0;1mStealth, Thievery, Traps, Lockpicking.\u001B[25C\u001B[0;34m\u2551\r\u255A\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u255D\r"

