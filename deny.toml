# cargo-deny configuration: `cargo deny check` runs in CI on every PR.

[graph]
all-features = true
exclude-dev = false

[advisories]
version = 2
# Vulnerabilities, unmaintained and unsound crates are errors. Ignore a specific
# advisory here only with a comment naming why and the card that removes it.
yanked = "deny"
ignore = [
    # RUSTSEC-2026-0459 (CVE-2026-119375): the SQLite bundled in libsqlite3-sys < 0.39 can
    # return uninitialised page-cache memory when it opens a database together with a `-wal`
    # file of a different page size that a less trusted party wrote. Silvermere opens only
    # its own database in its data directory, and a backup file the sysop names to
    # `silvermere restore` (read in place to check it, then copied without any `-wal`, and
    # the live database's `-wal` deleted). Nothing lets anyone else supply a database file.
    # Until the fix is in, don't restore a backup from someone you don't trust.
    # The fix cannot be taken yet: sqlx-sqlite 0.9.0, the newest, requires
    # libsqlite3-sys < 0.38. Remove this entry when an sqlx release allows 0.39 or later
    # and `cargo update -p libsqlite3-sys` takes it.
    { id = "RUSTSEC-2026-0459", reason = "fix needs libsqlite3-sys >= 0.39, which sqlx-sqlite 0.9.0 does not allow; Silvermere opens only its own database and the sysop's backups (see comment)" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
]
confidence-threshold = 0.8
# Check dev-dependencies too: today every third-party crate is a dev-dependency.
include-dev = true
# The allow-list is the project's policy, not the current graph; unused entries are fine.
unused-allowed-license = "allow"
# A transitive crate outside the allow-list gets a targeted exception with a comment;
# do not widen the allow-list.
exceptions = [
    # Mozilla's CA root certificates as data, pulled in by sqlx's rustls TLS
    # (no OpenSSL, so the musl static build works).
    { allow = ["CDLA-Permissive-2.0"], crate = "webpki-roots" },
]

[licenses.private]
# Workspace crates are `publish = false` and carry no licence field.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
