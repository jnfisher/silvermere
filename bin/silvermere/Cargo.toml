[package]
name = "silvermere"
description = "The server binary: serve, import, migrate, account, sysop subcommands."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
# `cargo run` starts the server, not the `normalise` helper binary
default-run = "silvermere"
# one test binary for all of tests/ (tests/all.rs), not one per file (T-129)
autotests = false

[lints]
workspace = true

[dependencies]
silvermere-api.workspace = true
silvermere-auth.workspace = true
silvermere-db.workspace = true
silvermere-engine.workspace = true
silvermere-import.workspace = true
silvermere-net.workspace = true
silvermere-text.workspace = true
silvermere-types.workspace = true
silvermere-web.workspace = true
anyhow.workspace = true
clap.workspace = true
figment.workspace = true
jiff.workspace = true
metrics.workspace = true
metrics-exporter-prometheus.workspace = true
rand.workspace = true
rpassword.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
tokio.workspace = true
toml.workspace = true
toml_edit.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
silvermere-testkit.workspace = true
metrics-util.workspace = true

[[test]]
name = "all"
path = "tests/all.rs"

# Installs the process-wide metrics recorder, which the in-process servers of the other tests
# also install: it needs a process of its own under `cargo test` too.
[[test]]
name = "metrics_recorder"
path = "tests/metrics_recorder.rs"
